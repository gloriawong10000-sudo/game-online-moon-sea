<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>互坑大冒险 终极版</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050810;color:#e8f1ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;user-select:none}
canvas{display:block;position:fixed;inset:0}
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow-y:auto;padding:12px;background:radial-gradient(circle at 50% 30%,#16233d 0%,#080c14 60%,#04060a 100%)}
h1{font-size:clamp(20px,3.6vw,34px);letter-spacing:4px;font-weight:900;background:linear-gradient(90deg,#4fc3f7,#a78bfa,#ffd54f,#ff8a65,#4fc3f7);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(120,160,255,.5));animation:tg 4s linear infinite;white-space:nowrap}
@keyframes tg{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.sub{font-size:11px;color:#7d90ab;letter-spacing:2px;margin-top:-4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.lb{font-size:11px;color:#9fb4cf;width:52px;text-align:right}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:640px}
.btns button{min-width:38px;height:32px;padding:0 8px;border-radius:7px;border:2px solid #2b3b52;background:#141d2b;color:#8ba3c0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btns button:hover{border-color:#4fc3f7;color:#c7d8ec}
.btns button.active{border-color:#4fc3f7;background:#0e2233;color:#7fdcff;box-shadow:0 0 10px rgba(79,195,247,.4)}
.modeBtn{min-width:60px!important;height:42px!important;padding:0 6px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.modeBtn .mIcon{font-size:14px;line-height:1}
.modeBtn .mName{font-size:9px;font-weight:700}
.modeBtn.active{border-color:#a78bfa;background:#1a1030;color:#d4b9ff;box-shadow:0 0 12px rgba(167,139,250,.5)}
.btns button.diff.active[data-v="easy"]{border-color:#81c784;color:#a5d6a7;background:#0f2415}
.btns button.diff.active[data-v="normal"]{border-color:#4fc3f7;color:#7fdcff;background:#0e2233}
.btns button.diff.active[data-v="hard"]{border-color:#ffb74d;color:#ffcc80;background:#2b1e0a}
.btns button.diff.active[data-v="hell"]{border-color:#ff5252;color:#ff8a80;background:#2b0a0a}
.btns button.diff.active[data-v="chaos"]{border-color:#e040fb;color:#ea80fc;background:#2a0a2e}
.btns button.diff.active[data-v="inferno"]{border-color:#ff1744;color:#ff8a80;background:#3a0000}
#actionRow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center}
#startBtn{padding:11px 42px;border-radius:11px;border:none;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:3px;font-family:inherit;background:linear-gradient(135deg,#4fc3f7,#a78bfa);color:#04121e;box-shadow:0 8px 24px rgba(120,160,255,.4)}
#continueBtn{display:none;padding:9px 32px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:900;letter-spacing:2px;font-family:inherit;border:2px solid #4ade80;background:rgba(20,45,30,0.85);color:#4ade80;line-height:1.3}
#continueBtn .cs{display:block;font-size:10px;color:#7ba888;letter-spacing:1px;font-weight:400}
#onlineRow{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#onlineRow button{padding:8px 22px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:900;letter-spacing:2px;font-family:inherit;border:none}
#hostBtn{background:linear-gradient(135deg,#81c784,#4ade80);color:#0a2410}
#joinBtn{background:linear-gradient(135deg,#4fc3f7,#2b8fd6);color:#04121e}
#onlineRow button.leave{background:linear-gradient(135deg,#ff5252,#c62828);color:#fff}
.charSection{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.charRow{display:flex;align-items:center;gap:6px}
.charLabel{font-size:11px;color:#9fb4cf;width:44px;text-align:right}
.charBtns{display:flex;gap:3px;flex-wrap:wrap}
.charBtn{width:32px;height:32px;border-radius:7px;border:2px solid #2b3b52;background:#141d2b;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.charBtn.active{border-color:#a78bfa;background:#1f1030;box-shadow:0 0 8px rgba(167,139,250,.6)}
#roomInfo{display:none;font-size:11px;color:#a5d6a7;background:#0f2415;padding:6px 14px;border-radius:7px;border:1px solid #2a5232;letter-spacing:1px;text-align:center;line-height:1.5;max-width:90vw}
#roomInfo.connected{background:#0f1a24;border-color:#2b6fa8;color:#7fdcff}
#quickStats{font-size:10px;color:#5f7691;text-align:center;line-height:1.5}
#quickStats b{color:#8fd3ff}
.tips{display:grid;grid-template-columns:repeat(2,auto);gap:2px 18px;font-size:10px;color:#7288a3;line-height:1.5;max-width:660px;margin-top:2px}
.tips b{color:#cfe3f8}
.pk{display:inline-block;padding:1px 5px;border-radius:3px;background:#1b2536;border:1px solid #2c3d55;color:#9ec8ee;font-size:10px;font-weight:700;margin:0 1px}
.pk.atk{background:#3b1a1a;border-color:#5c2a2a;color:#ff9e9e}
.pk.sk{background:#2a1a3a;border-color:#5c2a7a;color:#d4b9ff}
.ctrlRow{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#volumeSlider{width:90px;accent-color:#4fc3f7}
.smallBtn{padding:4px 10px;border-radius:6px;border:2px solid #2b3b52;background:#141d2b;color:#8ba3c0;font-size:10px;cursor:pointer;font-family:inherit}
.smallBtn:hover{border-color:#4fc3f7;color:#c7d8ec}
#gameChatLog{position:fixed;left:14px;bottom:120px;z-index:5;max-width:260px;pointer-events:none;font-size:11px}
#gameChatInputWrap{position:fixed;left:14px;bottom:80px;z-index:6;display:none;width:260px}
#gameChatInput{width:100%;background:rgba(10,16,26,0.95);border:2px solid #4fc3f7;border-radius:9px;color:#e8f1ff;padding:8px 12px;font-size:12px;font-family:inherit;outline:none}
#pauseMenu{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.85);backdrop-filter:blur(6px)}
.pausePanel{background:rgba(20,29,43,.95);border:2px solid #2b3b52;border-radius:14px;padding:24px 32px;text-align:center;min-width:240px}
.pausePanel h2{font-size:22px;letter-spacing:4px;margin-bottom:14px;color:#7fdcff}
.pausePanel button{display:block;width:100%;margin:6px 0;padding:10px;border-radius:9px;border:2px solid #2b3b52;background:#141d2b;color:#c7d8ec;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
#touchControls{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
.touchBtn{position:fixed;border-radius:50%;background:rgba(79,195,247,.15);border:2px solid rgba(79,195,247,.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:20px;color:#7fdcff;font-weight:900;user-select:none;touch-action:none}
#tbLeft{left:20px;bottom:110px;width:64px;height:64px}
#tbRight{left:100px;bottom:110px;width:64px;height:64px}
#tbJump{right:100px;bottom:110px;width:64px;height:64px}
#tbDash{right:20px;bottom:110px;width:64px;height:64px}
#tbAttack{right:60px;bottom:190px;width:56px;height:56px}
#tbSkill{right:150px;bottom:170px;width:56px;height:56px;border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:#d4b9ff}
#achievementToast{position:fixed;top:20px;right:20px;z-index:30;background:rgba(20,29,43,.95);border:2px solid #ffd54f;border-radius:12px;padding:10px 16px;display:none}
#achievementToast .at-title{font-size:11px;color:#ffd54f;letter-spacing:2px;font-weight:900}
#achievementToast .at-name{font-size:15px;color:#fff;margin-top:2px;font-weight:700}
#achievementToast .at-desc{font-size:11px;color:#8ba3c0;margin-top:2px}
#roomBanner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(15,36,21,.92);border:2px solid #2a5232;border-radius:9px;padding:6px 16px;font-size:12px;color:#a5d6a7;display:none;letter-spacing:1px}
#roomBanner b{color:#4fc3f7;letter-spacing:3px}
#helpModal,#updateModal,#keyModal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.88);backdrop-filter:blur(6px);padding:14px}
#updateModal{z-index:50}
#keyModal{z-index:45}
.helpPanel,.updatePanel,.keyPanel{width:min(780px,96vw);max-height:88vh;display:flex;flex-direction:column;background:rgba(16,24,36,.98);border:2px solid #2b3b52;border-radius:14px;overflow:hidden}
.updatePanel{width:min(560px,94vw);border-color:#4fc3f7}
.keyPanel{width:min(760px,96vw)}
.helpHead,.updateHead,.keyHead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1e2b3d;flex-wrap:wrap}
.helpTabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.helpTab{padding:6px 12px;border-radius:7px;border:2px solid #22303f;background:#141d2b;color:#8ba3c0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.helpTab.active{border-color:#4fc3f7;background:#0e2233;color:#7fdcff}
#helpClose,#keyOk,#keyReset,#updateOk,#updateHistory{padding:6px 12px;border-radius:7px;border:2px solid #2b3b52;background:#141d2b;color:#8ba3c0;cursor:pointer;font-size:12px;font-family:inherit}
.helpBody,.updateBody,.keyBody{padding:14px 18px;overflow-y:auto;font-size:13px;line-height:1.75;color:#b9cbe0}
.helpBody h3,.updateBody h4{color:#7fdcff;font-size:14px;margin:14px 0 6px}
.updateBody h4{color:#ffd54f;font-size:13px}
.updateBody ul{margin:0;padding-left:20px}
.updateBody li{margin:3px 0}
.updateBody .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px;font-weight:700}
.tag.new{background:#0f2415;color:#4ade80;border:1px solid #2a5232}
.tag.fix{background:#2b1e0a;color:#ffb74d;border:1px solid #5c3d10}
.helpTable{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.helpTable th,.helpTable td{border:1px solid #24344a;padding:5px 8px;text-align:center}
.helpTable th{background:#16202e;color:#8fd3ff}
.helpCard{background:#0e1622;border:1px solid #1f2c3e;border-radius:9px;padding:9px 12px;margin:6px 0}
.kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:#1b2536;border:1px solid #2c3d55;color:#9ec8ee;font-size:11px;font-weight:700}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#0e1622;border:1px solid #1f2c3e;border-radius:9px;margin:6px 0}
.setRow .st{font-size:12px;font-weight:700;color:#dbe8f7}
.setRow .sd{font-size:11px;color:#7d90ab;margin-top:2px}
.switch{width:46px;height:26px;border-radius:14px;background:#2b3b52;border:none;position:relative;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8ba3c0;transition:.2s}
.switch.on{background:#0e2233}
.switch.on::after{left:23px;background:#4fc3f7}
.keyPlayer{margin-bottom:14px}
.keyPName{font-size:13px;font-weight:900;margin-bottom:6px;letter-spacing:2px}
.keyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keyBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;background:#0e1622;border:2px solid #1f2c3e;border-radius:9px;color:#c7d8ec;font-family:inherit;cursor:pointer;min-height:56px}
.keyBtn.listening{border-color:#ffd54f;background:#2b1e0a}
.keyBtn .kA{font-size:11px;color:#7d90ab}
.keyBtn .kB{font-size:13px;font-weight:900;color:#8fd3ff}
.keyFoot,.updateFoot{padding:10px 16px;border-top:1px solid #1e2b3d;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.updateHead{background:linear-gradient(90deg,rgba(79,195,247,.12),rgba(167,139,250,.12))}
.updateHead h3{margin:0;font-size:16px;letter-spacing:2px;color:#7fdcff}
.updateHead .uVer{font-size:11px;color:#8ba3c0;margin-top:2px}
#helpFoot{padding:8px 16px;border-top:1px solid #1e2b3d;font-size:11px;color:#5f7691;text-align:center}
.updateBadge{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:35;background:linear-gradient(135deg,#4fc3f7,#a78bfa);color:#04121e;font-size:11px;font-weight:900;padding:4px 14px;border-radius:20px;letter-spacing:2px;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="roomBanner"></div>
<div id="menu">
  <h1>互坑大冒险</h1>
  <div class="sub">终极融合版 · 8 角色 · 8 技能 · 天气 · 随机事件 · 排行榜</div>
  <div class="row"><span class="lb">模式</span><div class="btns" id="modeBtns">
    <button class="modeBtn active" data-v="race"><span class="mIcon">🏁</span><span class="mName">竞速</span></button>
    <button class="modeBtn" data-v="dm"><span class="mIcon">⚔️</span><span class="mName">死斗</span></button>
    <button class="modeBtn" data-v="koth"><span class="mIcon">🎯</span><span class="mName">占点</span></button>
    <button class="modeBtn" data-v="collect"><span class="mIcon">💰</span><span class="mName">收集</span></button>
    <button class="modeBtn" data-v="ctf"><span class="mIcon">🚩</span><span class="mName">夺旗</span></button>
    <button class="modeBtn" data-v="horde"><span class="mIcon">👹</span><span class="mName">大乱斗</span></button>
    <button class="modeBtn" data-v="survive"><span class="mIcon">🔥</span><span class="mName">生存</span></button>
  </div></div>
  <div class="row"><span class="lb">人数</span><div class="btns" id="playerBtns">
    <button data-v="1">1</button><button data-v="2" class="active">2</button><button data-v="3">3</button><button data-v="4">4</button>
  </div></div>
  <div class="row"><span class="lb">难度</span><div class="btns" id="diffBtns">
    <button data-v="easy" class="diff">简单</button><button data-v="normal" class="diff active">普通</button>
    <button data-v="hard" class="diff">困难</button><button data-v="hell" class="diff">地狱</button>
    <button data-v="chaos" class="diff">混沌</button><button data-v="inferno" class="diff">炼狱</button>
  </div></div>
  <div class="row" id="levelRow"><span class="lb">关卡</span><div class="btns" id="levelBtns">
    <button data-v="15">15</button><button data-v="25">25</button><button data-v="40" class="active">40</button><button data-v="60">60</button>
  </div></div>
  <div class="charSection" id="charSection"></div>
  <div id="actionRow"><button id="startBtn">开 始 游 戏</button><button id="continueBtn">继 续 游 戏<span class="cs">第 1 / 40 关</span></button></div>
  <div id="onlineRow"><button id="hostBtn">创 建 房 间</button><button id="joinBtn">加 入 房 间</button></div>
  <div id="roomInfo"></div>
  <div class="ctrlRow">
    <span style="color:#8ba3c0;font-size:10px">音量</span>
    <input id="volumeSlider" type="range" min="0" max="100" value="40">
    <span id="volumeLabel" style="color:#8ba3c0;font-size:10px;width:30px">40%</span>
    <button id="musicToggle" class="smallBtn">🎵 音乐</button>
    <button id="touchToggle" class="smallBtn">📱 触屏</button>
    <button id="keyBtn" class="smallBtn">⌨️ 改键</button>
    <button id="statsBtn" class="smallBtn">📊 战绩</button>
    <button id="boardBtn" class="smallBtn">🏆 排行榜</button>
    <button id="helpBtn" class="smallBtn">❓ 玩法说明</button>
    <button id="updateBtn" class="smallBtn">📢 更新日志</button>
  </div>
  <div id="quickStats">最佳：<b>--</b> · 通关：<b>0</b> 次 · 成就：<b>0</b>/<span id="totalAchCount">0</span></div>
  <div class="tips" id="tipsRow"></div>
  <div style="font-size:10px;color:#5f7691;margin-top:2px">游戏中按 <span class="pk">T</span> 聊天 · <span class="pk">Esc</span> 暂停 · <span class="pk">1-4</span> 表情 · <span class="pk">Q</span> 标记</div>
</div>
<div id="gameChatLog"></div>
<div id="gameChatInputWrap"><input id="gameChatInput" placeholder="输入消息，回车发送，Esc 取消"></div>
<div id="pauseMenu"><div class="pausePanel">
  <h2>暂 停</h2>
  <button id="resumeBtn">继 续 游 戏</button>
  <button id="retryBtn">重 开 本 关</button>
  <button id="restartBtn">重 新 开 始</button>
  <button id="quitBtn">返 回 主 菜 单</button>
</div></div>
<div id="touchControls">
  <div class="touchBtn" id="tbLeft">◀</div><div class="touchBtn" id="tbRight">▶</div>
  <div class="touchBtn" id="tbJump">▲</div><div class="touchBtn" id="tbDash">➤</div>
  <div class="touchBtn" id="tbAttack">✦</div><div class="touchBtn" id="tbSkill">⚡</div>
</div>
<div id="achievementToast"><div class="at-title">🏆 成就达成</div><div class="at-name" id="atName"></div><div class="at-desc" id="atDesc"></div></div>
<div id="helpModal"><div class="helpPanel">
  <div class="helpHead"><div class="helpTabs">
    <button class="helpTab active" data-tab="ctrl">🎮 操作</button>
    <button class="helpTab" data-tab="mode">🎯 模式</button>
    <button class="helpTab" data-tab="char">🧩 角色</button>
    <button class="helpTab" data-tab="rule">⚙️ 规则</button>
    <button class="helpTab" data-tab="ach">🏆 成就</button>
    <button class="helpTab" data-tab="set">🔧 设置</button>
  </div><button id="helpClose">✕</button></div>
  <div class="helpBody" id="helpBody"></div>
  <div id="helpFoot">游戏中按 <span class="kbd">T</span> 聊天 · <span class="kbd">Esc</span> 暂停 · <span class="kbd">1~4</span> 表情 · <span class="kbd">Q</span> 标记</div>
</div></div>
<div id="updateModal"><div class="updatePanel">
  <div class="updateHead"><div class="uIcon">🚀</div><div class="uTitle"><h3>版 本 更 新 公 告</h3><div class="uVer" id="updateVerText"></div></div></div>
  <div class="updateBody" id="updateBody"></div>
  <div class="updateFoot"><div class="uTip">按 Esc 或点「知道了」关闭</div><div><button id="updateHistory">📜 历史</button> <button id="updateOk">知 道 了</button></div></div>
</div></div>
<div id="keyModal"><div class="keyPanel">
  <div class="keyHead"><h3>⌨️ 键位设置</h3><div class="keyHint">点击格子 → 按下新键 · <b style="color:#ffd54f">Esc</b> 取消</div></div>
  <div class="keyBody" id="keyBody"></div>
  <div class="keyFoot"><button id="keyReset">恢复默认</button><button id="keyOk">完成</button></div>
</div></div>

<script>
"use strict";
const PEER_HOST = location.hostname;
const CONNECT_TIMEOUT = 20000;
const APP_VERSION = 'v1.9.0';
const CHANGELOG = [
  { ver:'v1.9.0', date:'2026-10-10', title:'联机关卡切换同步', items:[
    { tag:'fix', text:'修复主机进入 levelend 后停止广播，客户端看不到"关卡完成"' },
    { tag:'fix', text:'修复客户端在 levelend 期间不处理广播，无法进入下一关' },
    { tag:'fix', text:'修复客户端在 levelend 期间按 1-4 表情无反应' },
    { tag:'new', text:'表情发送时屏幕中央显示大号表情反馈，确认已发出' },
    { tag:'opt', text:'客户端在关卡完成后显示"等待主机进入下一关…"' }
  ]},
  { ver:'v1.8.0', date:'2026-10-10', title:'联机通关同步', items:[
    { tag:'fix', text:'客户端主动上报到达状态' }
  ]},
  { ver:'v1.6.0', date:'2026-10-10', title:'怪物跳跃', items:[
    { tag:'new', text:'大乱斗模式中怪物会跳跃追击玩家' }
  ]},
  { ver:'v1.5.0', date:'2026-10-10', title:'竞速超时', items:[

function makeRaceLevel(i){
  const chapter=Math.floor(i/10),sub=i%10;
  const tier=sub<3?0:(sub<7?1:2);
  const seed=i*3571+chapter*9973+tier*541;
  const rng=k=>{const x=Math.sin(seed+k*127.1)*43758.5453;return x-Math.floor(x);};
  const platforms=[G(400)],hazards=[],items=[];
  const hzm=DIFF.haz?DIFF.haz/20:1.3;
  const B=i<14?1:Math.min(5,1.5+(i-14)*.16);
  const S=i<14?1:Math.min(3.2,1.3+(i-14)*.12);
  const PW=i<14?1:Math.max(.4,1-(i-14)*.03);
  const addSpikes=(n,w1,w2)=>{n=Math.min(30,Math.max(1,Math.round(n*hzm*B)));for(let j=0;j<n;j++)hazards.push({type:'spike',x:520+rng(j+2000+n*10)*3000,y:1026,w:w1+rng(j+2100)*(w2-w1)});};
  const addSaws=(n,sp)=>{n=Math.min(34,Math.max(1,Math.round(n*hzm*B)));for(let j=0;j<n;j++)hazards.push({type:'saw',x:700+rng(j+3000+n*10)*2700,y:400+rng(j+3100)*550,r:26+rng(j+3200)*8,axis:rng(j+3300)<.5?'x':'y',range:(90+rng(j+3400)*100)*S,speed:(sp+rng(j+3500)*.8)*S});};
  if(chapter===0){const pc=6+tier,sp=(WW-700)/pc;for(let j=0;j<pc;j++)platforms.push({x:500+sp*j+rng(j+10)*60,y:750+rng(j+50)*200,w:160+rng(j+100)*80,h:24});if(tier===1)addSpikes(2,60,90);else if(tier===2){addSpikes(4,70,110);addSaws(2,1.6);}}
  else if(chapter===1){const pc=7+tier,sp=(WW-700)/pc;const ice=tier===0?.3:(tier===1?.7:1);for(let j=0;j<pc;j++)platforms.push({x:500+sp*j+rng(j+10)*60,y:750+rng(j+50)*220,w:150+rng(j+100)*80,h:24,type:rng(j+300)<ice?'ice':undefined});if(tier===0)addSpikes(2,60,90);else if(tier===1)addSpikes(3,70,110);else{addSpikes(5,80,130);addSaws(2,1.8);}}
  else if(chapter===2){const pc=7+tier,sp=(WW-700)/pc;for(let j=0;j<pc;j++)platforms.push({x:500+sp*j+rng(j+10)*60,y:850-j*35+rng(j+50)*80,w:130+rng(j+100)*60,h:24,type:j%2===0?'spring':undefined});if(tier===2)addSaws(4,2);else if(tier===1)addSaws(2,1.6);}
  else if(chapter===3){const pc=8+tier,sp=(WW-700)/pc;const cc=tier===0?.5:(tier===1?.7:.9);for(let j=0;j<pc;j++)platforms.push({x:500+sp*j+rng(j+10)*50,y:800+rng(j+50)*150,w:130+rng(j+100)*40,h:22,type:rng(j+300)<cc?'crumble':undefined});if(tier===0)addSpikes(2,60,90);else if(tier===1)addSaws(3,1.8);else addSaws(6,2.2);}
  else if(chapter===4){const pc=6+tier,sp=(WW-700)/pc;const mr=tier===0?70:(tier===1?110:150),ms=tier===0?1.2:(tier===1?1.7:2.2);for(let j=0;j<pc;j++)platforms.push({x:500+sp*j+rng(j+10)*80,y:750+rng(j+50)*200,w:140+rng(j+100)*60,h:24,move:{axis:rng(j+350)<.5?'x':'y',range:mr*(.7+rng(j+400)*.6),speed:ms*(.8+rng(j+450)*.5)}});if(tier===0)addSpikes(2,60,90);else if(tier===1){addSpikes(3,70,110);addSaws(2,1.8);}else{addSpikes(5,80,130);addSaws(5,2.2);}}
  else if(chapter===5){const pc=8+tier,sp=(WW-700)/pc;for(let j=0;j<pc;j++){let type;const tr=rng(j+200);if(tr<.25)type='ice';else if(tr<.5)type='crumble';else if(tr<.7)type='spring';const plat={x:500+sp*j+rng(j+10)*60,y:700+rng(j+50)*250,w:120+rng(j+100)*60,h:22,type};if(tier>=1&&rng(j+300)<.4)plat.move={axis:rng(j+350)<.5?'x':'y',range:80+rng(j+400)*80,speed:1.6+rng(j+450)};platforms.push(plat);}if(tier===0){addSpikes(3,60,100);addSaws(2,1.8);}else if(tier===1){addSpikes(4,70,110);addSaws(4,2);}else{addSpikes(6,80,130);addSaws(7,2.4);}}
  else if(chapter===6){const pc=10+tier,sY=500-tier*30,eY=1000,sp=(WW-700)/pc;for(let j=0;j<pc;j++){const prog=j/(pc-1);let py=sY+(eY-sY)*prog+rng(j+50)*40-20;let type;if(tier===2){const tr=rng(j+200);type=tr<.4?'ice':(tr<.7?'crumble':undefined);}else if(tier===1)type=rng(j+200)<.3?'ice':undefined;const plat={x:500+sp*j+rng(j+10)*40,y:py,w:140+rng(j+100)*60,h:22,type};if(tier>=1&&rng(j+300)<.4)plat.move={axis:'x',range:80+rng(j+400)*60,speed:1.5+rng(j+450)*.8};platforms.push(plat);}if(tier===0)addSpikes(2,60,100);else if(tier===1){addSpikes(3,70,120);addSaws(2,1.8);}else{addSpikes(5,80,140);addSaws(5,2.2);}}
  else{const pc=10+tier,sp=(WW-700)/pc;for(let j=0;j<pc;j++){let type;const tr=rng(j+200);if(tr<.2)type='ice';else if(tr<.45)type='crumble';else if(tr<.65)type='spring';const plat={x:500+sp*j+rng(j+10)*50,y:600+rng(j+50)*350,w:110+rng(j+100)*60,h:22,type};if(rng(j+300)<.5)plat.move={axis:rng(j+350)<.5?'x':'y',range:90+rng(j+400)*90,speed:1.8+rng(j+450)*1.2};platforms.push(plat);}addSpikes(tier===0?5:(tier===1?7:10),60,120);addSaws(tier===0?5:(tier===1?8:12),2);}
  if(i>=14){const laserN=4+Math.floor(rng(5000)*(1+(i-14)*.3));for(let k=0;k<laserN;k++){const isV=rng(5100+k)<.6;if(isV)hazards.push({type:'laser',x:500+rng(5200+k)*4000,y:250+rng(5300+k)*150,w:8,h:600+rng(5400+k)*200,axis:'v',offset:rng(5500+k)*3});else hazards.push({type:'laser',x:0,y:500+rng(5600+k)*400,w:5000,h:8,axis:'h',offset:rng(5700+k)*3});}}
  if(i>=14){const mN=2+Math.floor(rng(6000)*(.5+(i-14)*.2));for(let k=0;k<mN;k++)hazards.push({type:'missile',x:600+rng(6100+k)*3800,y:250+rng(6200+k)*200,cd:MISSILE_CD*(.7+rng(6300+k)*.5),offset:rng(6400+k)*3});}
  if(i>=11){const dN=2+Math.floor(rng(7000)*(.5+(i-11)*.2));for(let k=0;k<dN;k++)hazards.push({type:'drone',x:600+rng(7100+k)*3800,y:400+rng(7200+k)*250,range:200+rng(7300+k)*100,speed:90+rng(7400+k)*60,cd:DRONE_CD*(.7+rng(7500+k)*.5)});}
  if(i>=5&&rng(8000)<.5){const rn=1+Math.floor(rng(8100)*2);for(let k=0;k<rn;k++)hazards.push({type:'boulder',x:800+rng(8200+k)*3400,y:-100-rng(8300+k)*200,r:22+rng(8400+k)*10});}
  if(i>=14){for(const pl of platforms){if(pl.h===60)continue;pl.w=Math.max(60,Math.round(pl.w*PW));}}
  if(i>=2){const types=['shield','heavy','speed'];const itemN=Math.min(4,1+Math.floor(rng(9000)*3));for(let k=0;k<itemN;k++)items.push({type:types[Math.floor(rng(9100+k)*3)],x:800+rng(9200+k)*3400,y:780+rng(9300+k)*160});}
  platforms.push(GF(4650,350));
  return{name:`第 ${i+1} 关`,spawn:{x:80,y:900,spread:160},platforms,hazards,items,goal:{x:4720,y:900,w:240,h:150}};
}

addEventListener('keydown',e=>{
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash'].includes(e.code))e.preventDefault();
  if(state==='playing'&&e.code==='KeyT'&&document.getElementById('gameChatInputWrap').style.display==='none'){e.preventDefault();openChat();}
  const chatOpen=document.getElementById('gameChatInputWrap').style.display!=='none';
  const modalOpen=KeyModal.isOpen()||UpdateModal.isOpen()||document.getElementById('helpModal').style.display==='flex';
  // ★ 表情/标记：playing 和 levelend 都可触发；只要没有聊天框和弹窗
  if((state==='playing'||state==='levelend')&&!chatOpen&&!modalOpen){
    const c=e.code,k=e.key;
    let emoteIdx=-1;
    if(c==='Digit1'||c==='Numpad1'||k==='1'||k==='!')emoteIdx=0;
    else if(c==='Digit2'||c==='Numpad2'||k==='2'||k==='@')emoteIdx=1;
    else if(c==='Digit3'||c==='Numpad3'||k==='3'||k==='#')emoteIdx=2;
    else if(c==='Digit4'||c==='Numpad4'||k==='4'||k==='$')emoteIdx=3;
    if(emoteIdx>=0){e.preventDefault();sendEmote(emoteIdx);}
    else if(c==='KeyQ'||k==='q'||k==='Q')sendPing();
  }
  if(e.code==='Escape'){
    if(KeyModal.isOpen())return;
    if(UpdateModal.isOpen()){UpdateModal.hide();return;}
    if(document.getElementById('helpModal').style.display==='flex'){HelpModal.hide();return;}
    if(chatOpen){closeChat();return;}
    if(state==='playing'&&!paused)togglePause();else if(paused)togglePause();
  }
  if(state==='gameover'&&e.code==='KeyR')backToMenu();
},true);

const netSnapshots=[];const NET_INTERP_DELAY=90;
function pushNetSnapshot(data){netSnapshots.push({t:performance.now(),data});while(netSnapshots.length>8)netSnapshots.shift();const now=performance.now();while(netSnapshots.length>2&&now-netSnapshots[0].t>600)netSnapshots.shift();}

/* ★★★ 应用主机快照，处理 hostState 与 li 变化 ★★★ */
function applyInterpolatedState(){
  if(!netSnapshots.length)return;
  const renderTime=performance.now()-NET_INTERP_DELAY;
  let a=netSnapshots[0],b=netSnapshots[netSnapshots.length-1];
  for(let i=0;i<netSnapshots.length-1;i++){if(netSnapshots[i].t<=renderTime&&netSnapshots[i+1].t>=renderTime){a=netSnapshots[i];b=netSnapshots[i+1];break;}}
  const dt=b.t-a.t;
  const t=dt>0?Math.min(1,Math.max(0,(renderTime-a.t)/dt)):0;
  const sb=b.data;
  if(sb.mode)gameMode=sb.mode;
  if(sb.ms)modeState=Object.assign(modeState,sb.ms);
  if(sb.weather)weather={type:sb.weather,timer:0,intensity:1};
  if(sb.event){if(!activeEvent||activeEvent.type!==sb.event)activeEvent={type:sb.event,timer:sb.eventTimer||12};else activeEvent.timer=sb.eventTimer||activeEvent.timer;}else if(activeEvent)activeEvent=null;
  const prevLi=li;
  li=sb.li;levelTime=sb.lt;
  // ★ 主机切到下一关（li 变化）→ 客户端 loadLevel 并切回 playing
  if(Net.role==='client'&&Net.active&&li!==prevLi){
    loadLevel(li);
    state='playing';
    transT=0;
  }
  // ★ 主机进入 levelend → 客户端也进入 levelend 显示"关卡完成"
  if(Net.role==='client'&&Net.active&&sb.hostState==='levelend'&&state==='playing'){
    state='levelend';
    transT=9999;
    S.clear();
    const mvp=calculateMVP();
    if(mvp){mvpState={active:true,timer:0,duration:2.4,player:mvp,title:'MVP',subTitle:`第 ${li+1} 关 · 最有价值玩家`,stats:[
      {label:'击杀',value:mvp.kills||0,color:'#ff8a65'},
      {label:'得分',value:mvp.score||0,color:'#ffd54f'},
      {label:'用时',value:mvp.finished?mvp.finishTime.toFixed(1)+'s':'--',color:'#4fc3f7'},
      {label:'掉落',value:mvp.fell||0,color:'#ff5252'}
    ],playedSounds:{}};}
  }
  const sa=a.data;
  for(const pb of sb.ps){
    let p=players.find(x=>x.id===pb.id);
    if(!p){p={id:pb.id,w:44,h:52,alive:true,mul:{},character:'ninja',color:'#fff',name:'玩家'};players.push(p);}
    const pa=(sa.ps||[]).find(x=>x.id===pb.id)||pb;
    const ix=pa.x+(pb.x-pa.x)*t;
    const iy=pa.y+(pb.y-pa.y)*t;
    if(p.id!==Net.myId){
      p._targetX=ix;p._targetY=iy;
      if(p._firstSync!==true){p.x=ix;p.y=iy;p._firstSync=true;}
    }
    if(p.id===Net.myId){
      p.character=pb.character||p.character;
      p.color=pb.color||p.color;
      p.name=pb.name||p.name;
      p.score=pb.score;
      p.kills=pb.kills||0;
      p.deaths=pb.deaths||0;
      p.finished=pb.finished;
      p.finishOrder=pb.finishOrder||0;
      p.finishTime=pb.finishTime||0;
      p.coins=pb.coins||0;
      p.kothTime=pb.kothTime||0;
      p.hasFlag=pb.hasFlag||false;
      p.combo=pb.combo||0;
      p.skillCd=pb.skillCd||0;
      p.skillActive=pb.skillActive||0;
      p.rage=pb.rage||false;
      p._srv=true;
      continue;
    }
    const savedX=p.x,savedY=p.y;
    Object.assign(p,pb);
    p.x=savedX;p.y=savedY;
    p.chargeTime=pb.chargeT||0;
    p._srv=true;
  }
  bullets=(sb.bs||[]).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,color:b.color,owner:players.find(p=>p.id===b.ownerId)||players[0],life:1,maxLife:1}));
  enemyBullets=(sb.ebs||[]).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,dmg:0,life:1,maxLife:1}));
  if(sb.bls&&level&&level.haz){const boulders=level.haz.filter(h=>h.type==='boulder');for(let i=0;i<sb.bls.length&&i<boulders.length;i++){boulders[i].x=sb.bls[i].x;boulders[i].y=sb.bls[i].y;boulders[i].r=sb.bls[i].r;}}
}

/* 工具 */
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRect(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function rr(c,x,y,w,h,rad){rad=Math.min(rad,Math.abs(w)/2,Math.abs(h)/2);c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath();}
function spawnP(x,y,n,c,sp,lf,g=1200){n=Math.max(1,Math.round(n*(QUALITY_MUL[Settings.data.quality]||1)));for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;const s=sp*(.25+Math.random()*.75);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:lf*(.6+Math.random()*.6),maxLife:lf,color:c,size:2.5+Math.random()*4,gravity:g});}}
function addFloat(x,y,t,c){if(!Settings.data.dmgText&&/^-/.test(t))return;floats.push({x,y,text:t,color:c,life:1.1,maxLife:1.1,vy:-60});}
function spawnConfetti(x,y,n){n=Math.max(6,Math.round(n*(QUALITY_MUL[Settings.data.quality]||1)));const colors=['#ffd54f','#4fc3f7','#ff8a65','#a78bfa','#81c784','#e040fb'];for(let i=0;i<n;i++){particles.push({x,y,vx:rand(-420,420),vy:rand(-520,-80),life:1.6,maxLife:1.6,color:colors[i%colors.length],size:3+Math.random()*4,gravity:900,confetti:true});}}

function registerKill(killer,victim){if(!killer||killer===victim)return;const now=levelTime;killer.kills=(killer.kills||0)+1;const dt=now-(killer.lastKillTime||-99);if(dt<=3&&killer.streak>0)killer.streak++;else killer.streak=1;killer.lastKillTime=now;killer.streakTimer=3;if(killer.rage){Achievements.stats.rageKills=(Achievements.stats.rageKills||0)+1;if(Achievements.stats.rageKills>=3)Achievements.unlock('ragequit');Achievements.save();}killFeed.push({killerName:killer.name,killerColor:killer.color,victimName:victim.name,victimColor:victim.color,life:4,maxLife:4});if(killFeed.length>5)killFeed.shift();const texts={2:'双 杀!',3:'三 杀!',4:'四 杀!',5:'五 杀!'};if(killer.streak>=2&&killer.streak<=5){streakPopups.push({x:killer.x+killer.w/2,y:killer.y-30,text:texts[killer.streak],color:killer.streak>=4?'#ff5252':(killer.streak===3?'#ff9800':'#ffd54f'),life:1.6,maxLife:1.6,vy:-70,scale:.3,big:killer.streak>=3});}else if(killer.streak>5){streakPopups.push({x:killer.x+killer.w/2,y:killer.y-30,text:'超 神!',color:'#e040fb',life:2.2,maxLife:2.2,vy:-80,scale:.3,big:true});}if(killer.streak>=3){screenBanners.push({text:killer.streak===3?'三 杀':killer.streak===4?'四 杀':killer.streak===5?'五 杀':'超 神',subText:killer.name,color:killer.color,accent:killer.streak>=5?'#e040fb':(killer.streak>=4?'#ff5252':'#ff9800'),life:1.8,maxLife:1.8});if(killer.streak>=3)Achievements.unlock('combo3');if(killer.streak>=5)Achievements.unlock('combo5');}switch(killer.streak){case 1:S.kill();break;case 2:S.sD();break;case 3:S.sT();break;case 4:S.sQ();break;case 5:S.sP();break;default:if(killer.streak>5)S.sP();break;}shake=Math.max(shake,killer.streak>=3?14:8);freeze=Math.max(freeze,.08);}

/* 玩家更新 */
function updatePlayers(dt){for(const p of players)updatePlayer(p,dt);resolvePC();}
function checkGoalFor(p){
  if(gameMode!=='race')return;
  if(p.finished||!p.alive)return;
  if(!level||!level.goal)return;
  const g=level.goal;
  const cx=p.x+p.w/2;
  const cy=p.y+p.h/2;
  const overlap=rect(p,g);
  const centerIn=cx>g.x-10&&cx<g.x+g.w+10&&cy>g.y-30&&cy<g.y+g.h+30;
  if(!overlap&&!centerIn)return;
  // 客户端只标记本地，等主机处理
  if(Net.role==='client'){
    if(p.id===Net.myId)p._localFinished=true;
    return;
  }
  p.finished=true;finishCount++;p.finishOrder=finishCount;p.finishTime=levelTime;p.vx=0;p.vy=0;
  let bonus;if(nPlayers===1)bonus=100;else bonus=[120,80,45,20][Math.min(finishCount-1,3)];
  p.score+=bonus;
  if(finishCount===1){raceWaitTimer=RACE_WAIT_MAX;addFloat(p.x+p.w/2,p.y-70,'等待其他玩家…','#8fd3ff');}
  spawnConfetti(p.x+p.w/2,p.y+p.h/2,40);
  spawnP(p.x+p.w/2,p.y+p.h/2,36,'#ffd54f',360,1.1,400);
  addFloat(p.x+p.w/2,p.y-40,`第 ${p.finishOrder} 名! +${bonus}`,'#ffd54f');
  screenBanners.push({text:`${p.name} 到达终点!`,subText:`第 ${p.finishOrder} 名 · ${p.finishTime.toFixed(1)}s`,color:'#ffd54f',accent:'#ffb300',life:1.8,maxLife:1.8});
  shake=Math.max(shake,8);S.finish();
  if(p.finishTime<=10)Achievements.unlock('speedrun');
  if(p.levelHits===0)Achievements.unlock('perfection');
  if(p.levelFell===0)Achievements.unlock('noFall');
}
function updatePlayer(p,dt){
  // 主机处理远程玩家
  if(Net.role==='host'&&Net.active&&p.id!==Net.myId&&p._netIn){
    const i=p._netIn;
    if(typeof i.myX==='number'&&isFinite(i.myX)&&isFinite(i.myY)){
      p.x=i.myX;p.y=i.myY;p.facing=i.myFacing||p.facing;p.hp=i.myHp;p.alive=i.myAlive;
      p.dashing=i.myDashing||0;p.charging=i.myCharging||false;p.chargeTime=i.myChargeTime||0;
      p.shield=i.myShield||false;p.heavy=i.myHeavy?9:0;p.speedBoost=i.mySpeed?9:0;
      // ★ 客户端上报到达：立即处理
      if(i.myFinished&&!p.finished&&gameMode==='race'){
        p.finished=true;
        finishCount++;
        p.finishOrder=p.finishOrder||finishCount;
        p.finishTime=p.finishTime||levelTime;
        p.vx=0;p.vy=0;
        addFloat(p.x+p.w/2,p.y-40,`第 ${p.finishOrder} 名!`,'#ffd54f');
        spawnConfetti(p.x+p.w/2,p.y+p.h/2,36);
        if(finishCount===1){raceWaitTimer=RACE_WAIT_MAX;addFloat(p.x+p.w/2,p.y-70,'等待其他玩家…','#8fd3ff');}
        S.finish();
        screenBanners.push({text:`${p.name} 到达终点!`,subText:`第 ${p.finishOrder} 名`,color:'#ffd54f',accent:'#ffb300',life:1.8,maxLife:1.8});
      } else {
        checkGoalFor(p);
      }
    }
    return;
  }
  // 客户端处理其他玩家插值
  if(Net.role==='client'&&Net.active&&p.id!==Net.myId){
    if(p._targetX!==undefined){const rate=1-Math.pow(.0005,dt);p.x+=(p._targetX-p.x)*rate;p.y+=(p._targetY-p.y)*rate;}
    if(p.skillCd>0)p.skillCd-=dt;
    if(p.skillActive>0)p.skillActive-=dt;
    return;
  }
  checkGoalFor(p);
  if(p.finished){p.vx=0;p.vy=0;if(level&&level.goal){p.x=clamp(p.x,level.goal.x,level.goal.x+level.goal.w-p.w);p.y=clamp(p.y,level.goal.y,level.goal.y+level.goal.h-p.h);}return;}
  if(!p.alive){p.respT-=dt;if(p.respT<=0){p.alive=true;p.x=p.spawn.x;p.y=p.spawn.y;p.vx=0;p.vy=0;p.dashing=0;p.charging=false;p.chargeTime=0;p.invuln=.7;p.canDJ=false;p.hp=p.maxHp;p.combo=0;p.comboTimer=0;p.skillCd=0;p.rage=false;p._localFinished=false;spawnP(p.x+p.w/2,p.y+p.h/2,16,p.color,220,.6);}return;}
  if(p.invuln>0)p.invuln-=dt;if(p.dashCd>0)p.dashCd-=dt;if(p.dashing>0)p.dashing-=dt;if(p.atkCd>0)p.atkCd-=dt;
  if(p.heavy>0)p.heavy-=dt;if(p.speedBoost>0)p.speedBoost-=dt;if(p.coyote>0)p.coyote-=dt;
  if(p.streakTimer>0){p.streakTimer-=dt;if(p.streakTimer<=0)p.streak=0;}
  if(p.comboTimer>0){p.comboTimer-=dt;if(p.comboTimer<=0)p.combo=0;}
  if(p.skillCd>0)p.skillCd-=dt;if(p.skillActive>0)p.skillActive-=dt;
  if(p.gp&&p.gp.active){p.x+=p.gp.dx;p.y+=p.gp.dy;}
  let left,right,jP,jH,dP,aP,sP;
  if(p._netIn){const i=p._netIn;left=i.left;right=i.right;jP=i.jumpP;jH=i.jumpHeld;dP=i.dashP;aP=i.attackP;sP=i.skillP;}
  else if(p.id===0&&touchEnabled&&!Net.active){left=touchKeys.left;right=touchKeys.right;jP=touchPressed.jump;jH=touchKeys.jump;dP=touchPressed.dash;aP=touchPressed.attack;sP=touchPressed.skill;}
  else{const m=KEYMAP[p.id]||DEFAULT_KEYMAP[p.id];left=(m.left||[]).some(k=>keys[k]);right=(m.right||[]).some(k=>keys[k]);jP=(m.jump||[]).some(k=>pressed[k]);jH=(m.jump||[]).some(k=>keys[k]);dP=(m.dash||[]).some(k=>pressed[k]);aP=(m.attack||[]).some(k=>pressed[k]);sP=m.skill?(m.skill||[]).some(k=>pressed[k]):false;}
  const mul=p.mul||{};
  let dir=0;if(left)dir-=1;if(right)dir+=1;
  if(dir!==0&&p.dashing<=0)p.facing=dir;
  const isIce=(p.gp&&p.gp.active&&p.gp.type==='ice');
  if(sP&&p.skillCd<=0)fireSkill(p);
  const atkMul=(p.skillActive>0&&p.character==='robot')?.4:1;
  if(aP&&p.atkCd<=0&&p.dashing<=0){p.atkCd=ACD*(mul.ratk||1)*atkMul;p.charging=false;p.chargeTime=0;fireBullet(p);}
  if(p.charging){
    if(jH&&p.onGround){p.chargeTime=Math.min(p.chargeTime+dt,CHARGE_TIME);const ratio=p.chargeTime/CHARGE_TIME;if(Math.random()<.4+ratio*.6){const a=Math.random()*Math.PI*2;const r=36+Math.random()*22;particles.push({x:p.x+p.w/2+Math.cos(a)*r,y:p.y+p.h/2+Math.sin(a)*r,vx:-Math.cos(a)*180,vy:-Math.sin(a)*180,life:.32,maxLife:.32,color:ratio>.85?'#ffd54f':p.color,size:2+ratio*3,gravity:0});}p.vx*=Math.pow(.2,dt);}
    else if(!jH){const ratio=p.chargeTime/CHARGE_TIME;const mult=CHARGE_MIN+(CHARGE_MAX-CHARGE_MIN)*ratio;p.vy=JVEL*mult*(mul.jmp||1);p.onGround=false;p.coyote=0;p.canDJ=true;p.charging=false;const burst=8+Math.floor(ratio*22);const bColor=ratio>.85?'#ffd54f':p.color;spawnP(p.x+p.w/2,p.y+p.h,burst,bColor,200+ratio*320,.5);if(ratio>.7){shake=Math.max(shake,3+ratio*4);addFloat(p.x+p.w/2,p.y-20,ratio>.9?'完美!':'强力跳!',bColor);}p.chargeTime=0;S.jump();}
    else{p.charging=false;p.chargeTime=0;}
  }else{
    if(jP&&p.dashing<=0){if(p.onGround||p.coyote>0){p.charging=true;p.chargeTime=0;}else if(p.canDJ){p.vy=JVEL*.88;p.canDJ=false;spawnP(p.x+p.w/2,p.y+p.h,12,'#fff',200,.4,0);S.jump();}}
  }
  if(p.dashing>0){p.vx=p.facing*DSPD*(mul.dsh||1)*(.5+.5*(p.dashing/DTIME));p.trailT-=dt;if(p.trailT<=0){p.trailT=.02;spawnP(p.x+p.w/2,p.y+p.h/2,2,p.color,60,.3,0);}}
  else if(!p.charging){
    const acc=ACC*(isIce?.18:1);
    let weatherMul=1;if(weather.type==='snow')weatherMul=.75;if(weather.type==='rain'&&p.onGround)weatherMul=.9;

    else{if(isIce)p.vx*=Math.pow(.42,dt);else p.vx*=Math.pow(p.onGround?.00015:.35,dt);}

  let gravMul=(p.skillActive>0&&p.character==='alien')?.15:1;
  if(activeEvent&&activeEvent.type==='lowgrav')gravMul*=.5;
  if(p.dashing>0)p.vy+=GRAV*.1*dt*gravMul;else p.vy+=GRAV*dt*gravMul;
  if(p.vy>1600)p.vy=1600;
  moveCol(p,dt);
  if(p.y>DEATH_Y){killP(p,'掉落');return;}

function moveCol(p,dt){p.gp=null;p.x+=p.vx*dt;for(const pl of level.plats){if(!pl.active)continue;if(rect(p,pl)){if(p.vx>0)p.x=pl.x-p.w;else if(p.vx<0)p.x=pl.x+pl.w;p.vx=0;}}p.y+=p.vy*dt;p.onGround=false;for(const pl of level.plats){if(!pl.active)continue;if(rect(p,pl)){if(p.vy>=0){p.y=pl.y-p.h;p.onGround=true;p.gp=pl;if(pl.type==='spring'){p.vy=JVEL*SPRING_MULT;p.onGround=false;p.canDJ=true;p.gp=null;p.charging=false;p.chargeTime=0;spawnP(p.x+p.w/2,p.y+p.h,16,'#7ee08a',320,.5,300);shake=Math.max(shake,3);}else p.vy=0;if(pl.type==='crumble'&&pl.crumble<=0)pl.crumble=DIFF.crumb;}else{p.y=pl.y+pl.h;p.vy=0;}}}if(p.x<-140)p.x=-140;if(p.x+p.w>WW+140)p.x=WW+140-p.w;if(p.onGround)p.coyote=.09;}
function resolvePC(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j];if(!a.alive||!b.alive||a.finished||b.finished)continue;if(!rect(a,b))continue;const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);const oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);if(ox<oy){const d=(a.x+a.w/2)<(b.x+b.w/2)?-1:1;a.x+=d*ox*.5;b.x-=d*ox*.5;if(a.dashing>0&&b.dashing<=0){knock(b,-d*980,-560,a);a.dashing=0;}else if(b.dashing>0&&a.dashing<=0){knock(a,d*980,-560,b);b.dashing=0;}else{a.vx+=d*200*(1/60);b.vx-=d*200*(1/60);}}else{const d=(a.y+a.h/2)<(b.y+b.h/2)?-1:1;a.y+=d*oy*.5;b.y-=d*oy*.5;if(d<0){if(a.vy>200&&!b.heavy&&b.invuln<=0){b.vy=480;b.vx+=(b.x-a.x)*2.5;addFloat(b.x+b.w/2,b.y-14,'被踩!','#ff8a65');}a.onGround=true;if(a.vy>0)a.vy=0;}else{if(b.vy>200&&!a.heavy&&a.invuln<=0){a.vy=480;a.vx+=(a.x-b.x)*2.5;addFloat(a.x+a.w/2,a.y-14,'被踩!','#ff8a65');}b.onGround=true;if(b.vy>0)b.vy=0;}}}}
function knock(t,vx,vy,src){if(t.invuln>0||t.finished)return;const mul=t.mul||{};vx*=(mul.kb||1);vy*=(mul.kb||1);if(t.heavy>0){t.vx+=vx*.12;t.vy+=vy*.12;addFloat(t.x+t.w/2,t.y-16,'免疫','#a78bfa');return;}if(t.shield){t.shield=false;t.invuln=.9;spawnP(t.x+t.w/2,t.y+t.h/2,26,'#ffd54f',320,.7,300);return;}t.vx=vx;t.vy=vy;t.invuln=.4;t.dashing=0;t.charging=false;t.chargeTime=0;t.canDJ=true;spawnP(t.x+t.w/2,t.y+t.h/2,20,src.color,400,.6,500);shake=Math.max(shake,5);}

function hitP(p,sx,sy,lb,dmgOverride){if(p.invuln>0||p.finished||!p.alive)return;if(p.shield){p.shield=false;p.invuln=1;spawnP(p.x+p.w/2,p.y+p.h/2,26,'#ffd54f',340,.7,300);addFloat(p.x+p.w/2,p.y-16,'格挡!','#ffd54f');return;}const cx=p.x+p.w/2,cy=p.y+p.h/2;let dx=cx-sx,dy=cy-sy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;if(dy>-.4)dy=-.7;const kb=(p.mul.kb||1)*(p.heavy>0?.2:1);p.vx=dx*720*kb;p.vy=dy*720*kb;p.invuln=.85;p.dashing=0;p.charging=false;p.chargeTime=0;p.canDJ=true;p.hits++;p.levelHits++;const dmg=dmgOverride||DIFF.haz;p.hp-=dmg;spawnP(cx,cy,22,'#ff5252',420,.7,500);addFloat(cx,p.y-16,`-${dmg} ${lb}`,'#ff5252');S.hit();shake=Math.max(shake,7);if(p.hp<=0){p.hp=0;killP(p,lb);}}
function killP(p,reason,src){if(!p.alive||p.finished)return;p.alive=false;p.respT=DIFF.resp;if(reason==='掉落'){p.fell++;p.levelFell++;p.score-=40;}else{p.deaths++;p.score-=25;}if(p.hasFlag&&modeState.flags){const f=modeState.flags.find(f=>f.team!==p.team);if(f&&f.carrier===p){f.carrier=null;f.x=p.x;f.y=p.y;}p.hasFlag=false;}if(src&&src!==p){registerKill(src,p);src.score+=40;addFloat(src.x+src.w/2,src.y-40,'+40 击杀!','#ffd54f');}S.death();spawnP(p.x+p.w/2,Math.min(p.y+p.h/2,DEATH_Y-100),30,p.color,420,1,600);shake=Math.max(shake,9);}
function fireBullet(p){S.shoot();const cx=p.x+p.w/2,cy=p.y+p.h/2,f=p.facing;bullets.push({x:cx+f*30,y:cy,vx:f*BSPD,vy:0,r:10,dmg:DIFF.atk*(p.mul.atk||1)*(p.rage?1.5:1),owner:p,life:BLIFE,maxLife:BLIFE,color:p.color});spawnP(cx+f*34,cy,8,p.color,200,.22,0);p.vx-=f*40;}
function updateBullets(dt){if(Net.role==='client'&&Net.active)return;for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-100||b.x>WW+100||b.y<-100||b.y>DEATH_Y){b.life=0;continue;}for(const o of players){if(o===b.owner||!o.alive||o.finished||o.invuln>0)continue;const ox=o.x+o.w/2,oy=o.y+o.h/2;if(Math.hypot(ox-b.x,oy-b.y)<o.w*.6+b.r){hitBullet(b,o);b.life=0;break;}}if(b.life<=0)continue;for(const m of monsters){const mx=m.x+m.w/2,my=m.y+m.h/2;if(Math.hypot(mx-b.x,my-b.y)<m.w*.6+b.r){m.hp-=b.dmg;spawnP(b.x,b.y,12,b.color,300,.4,300);if(m.hp<=0){m.dead=true;if(b.owner){b.owner.kills=(b.owner.kills||0)+1;b.owner.score+=30;addFloat(mx,my-30,'+30','#ffd54f');S.score();}spawnP(mx,my,24,'#ff5722',400,.6,500);if(gameMode==='horde'&&b.owner&&b.owner.kills>=modeState.targetKills){state='gameover';modeState.winner=b.owner.id;}}b.life=0;break;}}}bullets=bullets.filter(b=>b.life>0);
  for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-100||b.x>WW+100||b.y<-100||b.y>DEATH_Y){b.life=0;continue;}for(const p of players){if(!p.alive||p.finished||p.invuln>0)continue;const px=p.x+p.w/2,py=p.y+p.h/2;if(Math.hypot(px-b.x,py-b.y)<p.w*.6+b.r){if(p.shield){p.shield=false;p.invuln=.9;spawnP(px,py,26,'#ffd54f',320,.7,300);}else{p.hp-=b.dmg||DIFF.haz*.6;p.vx+=(b.vx>0?1:-1)*200;p.vy=-220;p.invuln=.5;p.hits++;p.levelHits++;addFloat(px,p.y-18,`-${Math.round(b.dmg||DIFF.haz*.6)}`,'#ff5252');spawnP(px,py,14,'#e040fb',320,.5,300);shake=Math.max(shake,4);if(p.hp<=0){p.hp=0;killP(p,'无人机');}}b.life=0;break;}}}enemyBullets=enemyBullets.filter(b=>b.life>0);}
function hitBullet(b,t){addCombo(b.owner);if(t.heavy>0){const dmg=b.dmg*.35;t.hp-=dmg;t.vx+=(b.vx>0?1:-1)*BKB*.15;addFloat(t.x+t.w/2,t.y-18,`-${Math.round(dmg)}`,'#a78bfa');}else if(t.shield){t.shield=false;t.invuln=.9;spawnP(t.x+t.w/2,t.y+t.h/2,26,'#ffd54f',320,.7,300);return;}else{t.hp-=b.dmg;const kb=(b.vx>0?BKB:-BKB)*(t.mul.kb||1);t.vx=kb;t.vy=-240;t.invuln=.28;t.dashing=0;t.charging=false;t.chargeTime=0;t.canDJ=true;t.hits++;t.levelHits++;addFloat(t.x+t.w/2,t.y-18,`-${Math.round(b.dmg)}`,'#ff5252');}spawnP(b.x,b.y,20,b.color,380,.5,400);freeze=.05;shake=Math.max(shake,5);if(t.hp<=0){t.hp=0;killP(t,'击杀',b.owner);}}
function addCombo(p){if(!p)return;p.hitCount=(p.hitCount||0)+1;const now=levelTime;if(now-(p.comboTimer||-99)<1.5)p.combo=(p.combo||0)+1;else p.combo=1;p.comboTimer=now;if(p.combo>=3){S.combo(p.combo);if(p.combo>=10)Achievements.unlock('combo10');}}

/* 大乱斗怪物：会跳、会被平台挡、有重力 */
function updateMonsters(dt){
  if(Net.role==='client'&&Net.active)return;
  for(const m of monsters){
    m.atkCd-=dt;m.jumpCd-=dt;
    let target=null,bd=Infinity;
    for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<600&&d<bd){bd=d;target=p;}}
    if(target){
      const dx=target.x-m.x;
      const dy=target.y-m.y;
      const adx=Math.abs(dx);
      const dir=Math.sign(dx);
      m.facing=dir;
      const playerAbove=dy<-40&&adx<140;
      let blocked=false;
      if(m.onGround){const testX=m.x+m.w/2+dir*24;for(const pl of level.plats){if(!pl.active)continue;if(testX>pl.x&&testX<pl.x+pl.w&&pl.y<m.y+m.h&&pl.y>m.y-10){blocked=true;break;}}}
      if(m.onGround&&m.jumpCd<=0&&(playerAbove||blocked)){
        m.vy=-720;m.onGround=false;m.jumpCd=.7;
        spawnP(m.x+m.w/2,m.y+m.h,8,'#ff8a80',180,.35,400);
      }
      if(bd>40)m.x+=dir*m.speed*dt;
      else if(m.atkCd<=0&&Math.abs(dy)<40){m.atkCd=.9;if(!target.invuln)hitP(target,m.x,m.y,'怪物');}
    }
    m.vy+=GRAV*dt;if(m.vy>1400)m.vy=1400;
    if(m.x<100)m.x=100;
    if(m.x+m.w>WW-100)m.x=WW-100-m.w;
    const prevY=m.y;
    m.y+=m.vy*dt;
    m.onGround=false;
    for(const pl of level.plats){
      if(!pl.active)continue;
      if(m.x<pl.x+pl.w&&m.x+m.w>pl.x&&m.y+m.h>pl.y&&m.y<pl.y+pl.h){
        if(m.vy>=0&&prevY+m.h<=pl.y+4){m.y=pl.y-m.h;m.vy=0;m.onGround=true;}
        else if(m.vy<0&&prevY>=pl.y+pl.h-4){m.y=pl.y+pl.h;m.vy=0;}
      }
    }
    if(m.y>1300){m.y=900;m.vy=0;m.onGround=false;}
  }
  if(gameMode==='horde'&&monsters.length<8&&Math.random()<.7)spawnMonster();
}
function updatePlats(dt){for(const p of level.plats){const ox=p.x,oy=p.y;if(p.move){p.phase+=p.move.speed*dt;const off=Math.sin(p.phase)*p.move.range;if(p.move.axis==='x')p.x=p.baseX+off;else p.y=p.baseY+off;}p.dx=p.x-ox;p.dy=p.y-oy;if(p.type==='crumble'){if(!p.active){p.resp-=dt;if(p.resp<=0){p.active=true;p.crumble=0;}}else if(p.crumble>0){p.crumble-=dt;if(p.crumble<=0){p.active=false;p.resp=CRUMBLE_RESPAWN;p.crumble=0;spawnP(p.x+p.w/2,p.y+p.h/2,16,'#ff8a65',220,.7);}}}}}
function updateHaz(dt){for(const h of level.haz){if(h.type==='saw'){h.phase+=h.speed*DIFF.saw*dt;h.angle+=dt*14;if(h.axis==='x')h.x=h.baseX+Math.sin(h.phase)*h.range;else if(h.axis==='y')h.y=h.baseY+Math.sin(h.phase)*h.range;}else if(h.type==='laser'){h.timer+=dt;const totalCycle=LASER_ON+LASER_OFF+LASER_WARN;const t=(h.timer/(totalCycle/DIFF.saw))%1;const warnEnd=LASER_WARN/totalCycle;const onEnd=(LASER_WARN+LASER_ON)/totalCycle;if(t<warnEnd)h.state='warn';else if(t<onEnd)h.state='on';else h.state='off';}else if(h.type==='missile'&&Net.role!=='client'){h.timer+=dt;if(h.timer>=h.cd/DIFF.saw){h.timer=0;let target=null,bd=Infinity;for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-h.x,p.y-h.y);if(d<bd){bd=d;target=p;}}if(target&&bd<1400){missiles.push({x:h.x,y:h.y,vx:0,vy:0,speed:MISSILE_SPD*(.9+Math.random()*.2),target,life:MISSILE_LIFE,angle:0,trailTimer:0});spawnP(h.x,h.y,12,'#ff5722',240,.5,100);}}}else if(h.type==='drone'&&Net.role!=='client'){h.droneX=h.x+Math.sin(h.timer*.8+h.phase)*h.range;h.droneY=h.y+Math.sin(h.timer*.5+h.phase*1.7)*60;h.timer+=dt;h.droneAngle+=dt*3;h.cd-=dt;if(h.cd<=0){let target=null,bd=Infinity;for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-h.droneX,p.y-h.droneY);if(d<DRONE_DETECT&&d<bd){bd=d;target=p;}}if(target){h.cd=DRONE_CD/DIFF.saw;const ang=Math.atan2(target.y-h.droneY,target.x-h.droneX);enemyBullets.push({x:h.droneX,y:h.droneY,vx:Math.cos(ang)*DRONE_BSPD,vy:Math.sin(ang)*DRONE_BSPD,r:8,dmg:DIFF.haz*.6,life:2.5,maxLife:2.5});}}}else if(h.type==='boulder'&&Net.role!=='client'){if(h.vy===undefined)h.vy=0;h.vy+=400*dt;h.y+=h.vy*dt;if(h.y>1200){h.y=-100-Math.random()*200;h.vy=0;h.x=800+Math.random()*3400;}}}
  if(Net.role!=='client'){for(const m of missiles){m.life-=dt;if(!m.target||!m.target.alive||m.target.finished){m.target=null;for(const p of players){if(p.alive&&!p.finished){m.target=p;break;}}}if(m.target){const desired=Math.atan2(m.target.y-m.y,m.target.x-m.x);let diff=desired-m.angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;m.angle+=clamp(diff,-MISSILE_TURN*dt,MISSILE_TURN*dt);}m.vx=Math.cos(m.angle)*m.speed;m.vy=Math.sin(m.angle)*m.speed;m.x+=m.vx*dt;m.y+=m.vy*dt;m.trailTimer-=dt;if(m.trailTimer<=0){m.trailTimer=.02;particles.push({x:m.x,y:m.y,vx:rand(-30,30),vy:rand(-30,30),life:.35,maxLife:.35,color:Math.random()<.5?'#ff9800':'#ff5722',size:4,gravity:-200});}}missiles=missiles.filter(m=>m.life>0);}}
function updateItems(dt){if(Net.role==='client'&&Net.active)return;for(const it of level.items)if(it.taken){it.resp-=dt;if(it.resp<=0)it.taken=false;}}
function checkItem(p){if(Net.role==='client'&&Net.active&&p.id!==Net.myId)return;if(p.finished)return;for(const it of level.items){if(it.taken)continue;const cx=p.x+p.w/2,cy=p.y+p.h/2;if(Math.hypot(cx-it.x,cy-it.y)<38){it.taken=true;it.resp=ITEM_DEFS[it.type].resp;if(it.type==='shield'){p.shield=true;addFloat(p.x+p.w/2,p.y-20,'护盾!','#ffd54f');}else if(it.type==='heavy'){p.heavy=ITEM_DEFS.heavy.dur;addFloat(p.x+p.w/2,p.y-20,'重物 9s','#a78bfa');}else if(it.type==='speed'){p.speedBoost=ITEM_DEFS.speed.dur;addFloat(p.x+p.w/2,p.y-20,'加速 9s','#22d3ee');}p.score+=5;S.coin();spawnP(it.x,it.y,26,it.color,340,.7,300);}}

function updateModeLogic(dt){if(state!=='playing')return;if(Net.role==='client'&&Net.active)return;

function updateParticles(dt){for(const pt of particles){pt.vy+=pt.gravity*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;}particles=particles.filter(p=>p.life>0);for(const t of floats){t.y+=t.vy*dt;t.vy*=.93;t.life-=dt;}floats=floats.filter(t=>t.life>0);for(const k of killFeed)k.life-=dt;killFeed=killFeed.filter(k=>k.life>0);for(const s of streakPopups){s.life-=dt;s.y+=s.vy*dt;s.vy*=.96;const t=1-s.life/s.maxLife;if(t<.3)s.scale=.3+(t/.3)*1.2;else if(t<.5)s.scale=1.5-((t-.3)/.2)*.5;else s.scale=1;}streakPopups=streakPopups.filter(s=>s.life>0);for(const b of screenBanners)b.life-=dt;screenBanners=screenBanners.filter(b=>b.life>0);}

/* ★★★ 主更新：levelend 期间主机继续广播，客户端处理广播 ★★★ */
function update(dt){
  if(paused)return;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(freeze>0){freeze-=dt;dt*=.3;}
  if(state==='playing'){
    levelTime+=dt;
    if(Net.role==='client'&&Net.active)applyInterpolatedState();
    if(Net.role!=='client'){if(activeEvent){activeEvent.timer-=dt;if(activeEvent.timer<=0){activeEvent=null;nextEventTime=20+Math.random()*15;}}else{nextEventTime-=dt;if(nextEventTime<=0)triggerRandomEvent();}}
    updatePlats(dt);updateHaz(dt);updatePlayers(dt);updateBullets(dt);updateMonsters(dt);updateItems(dt);updateModeLogic(dt);
    // 竞速超时
    if(Net.role!=='client'&&gameMode==='race'&&finishCount>0){
      const allFinished=players.every(p=>p.finished);
      if(!allFinished){raceWaitTimer-=dt;if(raceWaitTimer<=0){for(const p of players){if(!p.finished){p.finished=true;finishCount++;p.finishOrder=finishCount;p.finishTime=levelTime;p.vx=0;p.vy=0;}}screenBanners.push({text:'超时跳过',subText:'未到达的玩家按当前名次结算',color:'#ff8a65',accent:'#ff5252',life:1.8,maxLife:1.8});}}
    }
    updateParticles(dt);updateCamera(dt);
    if(Net.active){
      if(Net.role==='host'){for(const pid in Net.remIn){const p=players.find(x=>x.id===+pid);if(p)p._netIn=Net.remIn[pid];}Net.bcast();}
      else if(Net.role==='client'){const my=players.find(x=>x.id===Net.myId);if(my){const m=KEYMAP[my.id]||DEFAULT_KEYMAP[my.id];const anyKey=arr=>(arr||[]).some(k=>keys[k]);const anyPressed=arr=>(arr||[]).some(k=>pressed[k]);Net.sendIn({left:anyKey(m.left)||(my.id===0&&touchEnabled&&touchKeys.left),right:anyKey(m.right)||(my.id===0&&touchEnabled&&touchKeys.right),jumpP:anyPressed(m.jump)||(my.id===0&&touchEnabled&&touchPressed.jump),jumpHeld:anyKey(m.jump)||(my.id===0&&touchEnabled&&touchKeys.jump),dashP:anyPressed(m.dash)||(my.id===0&&touchEnabled&&touchPressed.dash),attackP:anyPressed(m.attack)||(my.id===0&&touchEnabled&&touchPressed.attack),skillP:m.skill?anyPressed(m.skill):false,myX:my.x,myY:my.y,myFacing:my.facing,myHp:my.hp,myAlive:my.alive,myDashing:my.dashing,myCharging:my.charging,myChargeTime:my.chargeTime,myShield:my.shield,myHeavy:my.heavy>0,mySpeed:my.speedBoost>0,myFinished:!!(my.finished||my._localFinished),myFinishOrder:my.finishOrder||0,myFinishTime:my.finishTime||0});}}
    }
    if(Net.role!=='client'&&gameMode==='race'&&players.length>0&&players.every(p=>p.finished)){
      state='levelend';transT=2.4;S.clear();
      const finishers=players.filter(p=>p.finished&&p.finishTime>0);
      if(finishers.length){const bestT=Math.min(...finishers.map(p=>p.finishTime));if(BestTimes.submit(bestT))screenBanners.push({text:'新 纪 录 !',subText:`${bestT.toFixed(2)} 秒`,color:'#ffe082',accent:'#ffb300',life:2.6,maxLife:2.6});}
      const mvp=calculateMVP();
      if(mvp){mvpState={active:true,timer:0,duration:2.4,player:mvp,title:'MVP',subTitle:`第 ${li+1} 关 · 最有价值玩家`,stats:[{label:'击杀',value:mvp.kills||0,color:'#ff8a65'},{label:'得分',value:mvp.score||0,color:'#ffd54f'},{label:'用时',value:mvp.finished?mvp.finishTime.toFixed(1)+'s':'--',color:'#4fc3f7'},{label:'掉落',value:mvp.fell||0,color:'#ff5252'}],playedSounds:{}};}
    }
  }else if(state==='levelend'){
    // ★ 客户端在 levelend 期间也处理主机快照（检测 li 变化和 hostState）
    if(Net.role==='client'&&Net.active)applyInterpolatedState();
    updateParticles(dt);updateBullets(dt);updateHaz(dt);updateCamera(dt);
    if(!(Net.role==='client'&&Net.active)){
      transT-=dt;
      if(transT<=0){
        li++;
        if(li>=totalLv){
          state='gameover';Save.clearProgress();BGM.play('victory');S.victory();

          Achievements.unlock('firstWin');
          if(totalTime<(Achievements.stats.bestTime||Infinity))Achievements.stats.bestTime=totalTime;
          Achievements.save();
          for(const p of players){if(p.score>0){Leaderboard.add({name:p.name,score:p.score,mode:gameMode,diff:DIFF.name,time:Date.now()});}}

        } else {
          loadLevel(li);state='playing';saveProgress();
        }
      }
    }
    // ★ 主机在 levelend 期间继续广播，客户端才能收到关卡切换
    if(Net.active&&Net.role==='host')Net.bcast();
  }else if(state==='gameover'){
    updateParticles(dt);
    if(mvpState.active){mvpState.timer+=dt;if(mvpState.timer>mvpState.duration)mvpState.active=false;}
  }
  for(const k in pressed)delete pressed[k];
  for(const k in touchPressed)delete touchPressed[k];
}
function calculateMVP(){const r=[...players].map(p=>{const ks=(p.kills||0)*100;const fs=p.finished?Math.max(0,300-p.finishTime*5):0;const dp=(p.deaths||0)*30+(p.fell||0)*20;p._mvp=(p.score||0)+ks+fs-dp;return p;});r.sort((a,b)=>b._mvp-a._mvp);return r[0];}

/* 渲染 */
function render(dt){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,VW,VH);
  const bg=ctx.createLinearGradient(0,0,0,VH);bg.addColorStop(0,'#0b1120');bg.addColorStop(1,'#04070d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,VW,VH);
  if(state==='menu')return;
  const shakeAmt=Settings.data.shake?shake:0;
  const shakeX=(Math.random()-.5)*shakeAmt;
  const shakeY=(Math.random()-.5)*shakeAmt;
  const sx=VW/2-camera.x*currentScale+shakeX;
  const sy=VH/2-camera.y*currentScale+shakeY;
  ctx.save();ctx.setTransform(currentScale,0,0,currentScale,sx,sy);
  const cx0=camera.x-viewW/2-200,cy0=camera.y-viewH/2-200;
  ctx.beginPath();ctx.rect(cx0,cy0,viewW+400,viewH+400);ctx.clip();
  drawWorld();drawDarkness();ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);

  if(state==='levelend')drawLevelEnd();
  if(state==='gameover')drawGameOver();
  if(mvpState.active)drawMVP(dt);
}
function drawMinimap(){if(!Settings.data.minimap||!level)return;if(state!=='playing'&&state!=='levelend')return;const mw=170,mh=Math.round(mw*WH/WW);const mx=14,my=14;const kx=mw/WW,ky=mh/WH;ctx.save();rr(ctx,mx,my,mw,mh,7);ctx.fillStyle='rgba(8,13,22,0.78)';ctx.fill();ctx.strokeStyle='rgba(79,195,247,0.4)';ctx.lineWidth=1.5;ctx.stroke();const vx=mx+(camera.x-viewW/2)*kx;const vy=my+(camera.y-viewH/2)*ky;ctx.fillStyle='rgba(79,195,247,0.10)';ctx.fillRect(vx,vy,viewW*kx,viewH*ky);if(level.goal){ctx.fillStyle='rgba(255,213,79,0.95)';ctx.fillRect(mx+level.goal.x*kx,my+level.goal.y*ky,Math.max(2.5,level.goal.w*kx),Math.max(2.5,level.goal.h*ky));}if(gameMode==='koth'&&modeState.zone){ctx.beginPath();ctx.arc(mx+modeState.zone.x*kx,my+modeState.zone.y*ky,Math.max(3,modeState.zone.r*kx),0,Math.PI*2);ctx.fillStyle='rgba(167,139,250,0.5)';ctx.fill();}for(const p of players){if(!p.alive)continue;const px=mx+(p.x+p.w/2)*kx;const py=my+clamp(p.y+p.h/2,0,WH)*ky;ctx.beginPath();ctx.arc(px,py,3.6,0,Math.PI*2);ctx.fillStyle=p.finished?'#ffd54f':p.color;ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.65)';ctx.lineWidth=1.2;ctx.stroke();}for(const m of monsters){const px=mx+(m.x+m.w/2)*kx;const py=my+clamp(m.y+m.h/2,0,WH)*ky;ctx.beginPath();ctx.arc(px,py,2.4,0,Math.PI*2);ctx.fillStyle='#ff5252';ctx.fill();}ctx.restore();}
function drawOffscreenIndicators(){if(!Settings.data.offscreen)return;if(state!=='playing'&&state!=='levelend')return;if(!players.length)return;const myId=Net.active?Net.myId:0;const myP=players.find(p=>p.id===myId);if(!myP)return;const margin=44;for(const p of players){if(p===myP||!p.alive)continue;const px=p.x+p.w/2,py=p.y+p.h/2;const sxp=(px-camera.x)*currentScale+VW/2;const syp=(py-camera.y)*currentScale+VH/2;const pad=30;if(sxp>pad&&sxp<VW-pad&&syp>pad&&syp<VH-pad)continue;const dirX=sxp-VW/2,dirY=syp-VH/2;const ang=Math.atan2(dirY,dirX);const halfW=VW/2-margin,halfH=VH/2-margin;const cosA=Math.cos(ang),sinA=Math.sin(ang);const tX=Math.abs(cosA)>.001?halfW/Math.abs(cosA):Infinity;const tY=Math.abs(sinA)>.001?halfH/Math.abs(sinA):Infinity;const t=Math.min(tX,tY);const ix=VW/2+cosA*t,iy=VH/2+sinA*t;ctx.save();ctx.translate(ix,iy);ctx.rotate(ang);const size=14;ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*.7,-size*.75);ctx.lineTo(-size*.3,0);ctx.lineTo(-size*.7,size*.75);ctx.closePath();ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();ctx.save();ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const lx=clamp(ix,margin,VW-margin);const ly=clamp(iy+(sinA>0?22:-22),margin,VH-margin);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.strokeText(p.name,lx,ly);ctx.fillStyle=p.color;ctx.fillText(p.name,lx,ly);ctx.restore();}}
function drawRaceProgress(){if(gameMode!=='race'||!level||!level.goal)return;if(state!=='playing'&&state!=='levelend')return;const startX=level.def.spawn.x;const endX=level.goal.x+level.goal.w/2;const total=endX-startX;if(total<=0)return;const bw=Math.min(500,VW*.5);const bx=(VW-bw)/2;const by=68;const bh=8;ctx.save();rr(ctx,bx,by,bw,bh,bh/2);ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#ffd54f';ctx.fillRect(bx+bw-3,by-3,3,bh+6);for(const p of players){let prog=(p.x+p.w/2-startX)/total;prog=clamp(prog,0,1);const px=bx+prog*bw;const py=by+bh/2;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fillStyle=p.finished?'#ffd54f':p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=1.5;ctx.stroke();if(p.finished&&p.finishOrder){ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(p.finishOrder,px,py+.5);}}ctx.restore();}

/* 更新公告 */
const UpdateModal={KEY:'bomb_seen_version',el:null,body:null,
  init(){this.el=document.getElementById('updateModal');this.body=document.getElementById('updateBody');if(!this.el||!this.body)return;document.getElementById('updateOk').onclick=()=>this.hide();document.getElementById('updateHistory').onclick=()=>this.showHistory();this.el.addEventListener('click',e=>{if(e.target===this.el)this.hide();});this.check();},
  getSeen(){try{return localStorage.getItem(this.KEY)||'';}catch(e){return'';}},
  setSeen(v){try{localStorage.setItem(this.KEY,v);}catch(e){}},
  check(){if(this.getSeen()===APP_VERSION)return;setTimeout(()=>this.show(),350);},
  show(){const cur=CHANGELOG.find(c=>c.ver===APP_VERSION)||CHANGELOG[0];const prev=this.getSeen();document.getElementById('updateVerText').textContent=`${cur.ver} · ${cur.date}`+(prev&&prev!==APP_VERSION?`（从 ${prev} 更新）`:'');this.body.innerHTML=this.renderVersion(cur);this.el.style.display='flex';this.setSeen(APP_VERSION);this.showBadge(cur.ver);if(typeof S!=='undefined'&&S.ctx){[659,880,1047,1319].forEach((f,i)=>S.tone(f,.18,'sine',.22,null,i*.09));}},
  hide(){if(this.el)this.el.style.display='none';},
  isOpen(){return this.el&&this.el.style.display==='flex';},
  showHistory(){this.body.innerHTML=CHANGELOG.map(c=>this.renderVersion(c)).join(`<div style="height:1px;background:#1e2b3d;margin:16px 0"></div>`);document.getElementById('updateVerText').textContent='全部更新历史';this.body.scrollTop=0;},
  renderVersion(v){const tm={new:['new','新增'],fix:['fix','修复'],opt:['opt','优化']};const isCur=v.ver===APP_VERSION;return`<h4>${isCur?'🆕 ':''}${v.title} <span style="color:#5f7691;font-size:11px;font-weight:400">· ${v.ver} · ${v.date}</span></h4><ul>${v.items.map(it=>{const t=tm[it.tag]||tm.new;return`<li><span class="tag ${t[0]}">${t[1]}</span>${it.text}</li>`;}).join('')}</ul>`;},
  showBadge(ver){let b=document.getElementById('updateBadge');if(!b){b=document.createElement('div');b.id='updateBadge';b.className='updateBadge';document.body.appendChild(b);}b.textContent='已更新到 '+ver;b.style.display='block';clearTimeout(b._to);b._to=setTimeout(()=>{b.style.display='none';},4000);}
};
