<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>互坑大冒险 终极版</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050810;color:#e8f1ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;user-select:none}
canvas{display:block;position:fixed;inset:0}
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow-y:auto;padding:12px;background:radial-gradient(circle at 50% 30%,#16233d 0%,#080c14 60%,#04060a 100%)}
h1{font-size:clamp(20px,3.6vw,34px);letter-spacing:4px;font-weight:900;background:linear-gradient(90deg,#4fc3f7,#a78bfa,#ffd54f,#ff8a65,#4fc3f7);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(120,160,255,.5));animation:tg 4s linear infinite;white-space:nowrap}
@keyframes tg{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.sub{font-size:11px;color:#7d90ab;letter-spacing:2px;margin-top:-4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.lb{font-size:11px;color:#9fb4cf;width:52px;text-align:right}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:640px}
.btns button{min-width:38px;height:32px;padding:0 8px;border-radius:7px;border:2px solid #2b3b52;background:#141d2b;color:#8ba3c0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btns button:hover{border-color:#4fc3f7;color:#c7d8ec}
.btns button.active{border-color:#4fc3f7;background:#0e2233;color:#7fdcff;box-shadow:0 0 10px rgba(79,195,247,.4)}
.modeBtn{min-width:60px!important;height:42px!important;padding:0 6px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.modeBtn .mIcon{font-size:14px;line-height:1}
.modeBtn .mName{font-size:9px;font-weight:700}
.modeBtn.active{border-color:#a78bfa;background:#1a1030;color:#d4b9ff;box-shadow:0 0 12px rgba(167,139,250,.5)}
.btns button.diff.active[data-v="easy"]{border-color:#81c784;color:#a5d6a7;background:#0f2415}
.btns button.diff.active[data-v="normal"]{border-color:#4fc3f7;color:#7fdcff;background:#0e2233}
.btns button.diff.active[data-v="hard"]{border-color:#ffb74d;color:#ffcc80;background:#2b1e0a}
.btns button.diff.active[data-v="hell"]{border-color:#ff5252;color:#ff8a80;background:#2b0a0a}
.btns button.diff.active[data-v="chaos"]{border-color:#e040fb;color:#ea80fc;background:#2a0a2e}
.btns button.diff.active[data-v="inferno"]{border-color:#ff1744;color:#ff8a80;background:#3a0000;animation:pls 1.2s infinite}
@keyframes pls{0%,100%{box-shadow:0 0 14px rgba(255,23,68,.5)}50%{box-shadow:0 0 26px rgba(255,23,68,.95)}}
#actionRow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center}
#startBtn{padding:11px 42px;border-radius:11px;border:none;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:3px;font-family:inherit;background:linear-gradient(135deg,#4fc3f7,#a78bfa);color:#04121e;box-shadow:0 8px 24px rgba(120,160,255,.4);transition:.15s}
#startBtn:hover{transform:translateY(-2px)}
#continueBtn{display:none;padding:9px 32px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:900;letter-spacing:2px;font-family:inherit;border:2px solid #4ade80;background:rgba(20,45,30,0.85);color:#4ade80;transition:.15s;line-height:1.3}
#continueBtn .cs{display:block;font-size:10px;color:#7ba888;letter-spacing:1px;font-weight:400}
#continueBtn:hover{background:rgba(30,70,45,0.95);transform:translateY(-2px)}
#onlineRow{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#onlineRow button{padding:8px 22px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:900;letter-spacing:2px;font-family:inherit;border:none;transition:.15s}
#hostBtn{background:linear-gradient(135deg,#81c784,#4ade80);color:#0a2410}
#joinBtn{background:linear-gradient(135deg,#4fc3f7,#2b8fd6);color:#04121e}
#onlineRow button:hover{transform:translateY(-2px)}
#onlineRow button.leave{background:linear-gradient(135deg,#ff5252,#c62828);color:#fff}
.charSection{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.charRow{display:flex;align-items:center;gap:6px}
.charLabel{font-size:11px;color:#9fb4cf;width:44px;text-align:right}
.charBtns{display:flex;gap:3px;flex-wrap:wrap}
.charBtn{width:32px;height:32px;border-radius:7px;border:2px solid #2b3b52;background:#141d2b;font-size:15px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.charBtn.active{border-color:#a78bfa;background:#1f1030;box-shadow:0 0 8px rgba(167,139,250,.6)}
#roomInfo{display:none;font-size:11px;color:#a5d6a7;background:#0f2415;padding:6px 14px;border-radius:7px;border:1px solid #2a5232;letter-spacing:1px;text-align:center;line-height:1.5;max-width:90vw}
#roomInfo.connected{background:#0f1a24;border-color:#2b6fa8;color:#7fdcff}
#quickStats{font-size:10px;color:#5f7691;text-align:center;line-height:1.5}
#quickStats b{color:#8fd3ff}
.tips{display:grid;grid-template-columns:repeat(2,auto);gap:2px 18px;font-size:10px;color:#7288a3;line-height:1.5;max-width:660px;margin-top:2px}
.tips b{color:#cfe3f8}
.pk{display:inline-block;padding:1px 5px;border-radius:3px;background:#1b2536;border:1px solid #2c3d55;color:#9ec8ee;font-size:10px;font-weight:700;margin:0 1px}
.pk.atk{background:#3b1a1a;border-color:#5c2a2a;color:#ff9e9e}
.pk.sk{background:#2a1a3a;border-color:#5c2a7a;color:#d4b9ff}
.ctrlRow{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#volumeSlider{width:90px;accent-color:#4fc3f7}
.smallBtn{padding:4px 10px;border-radius:6px;border:2px solid #2b3b52;background:#141d2b;color:#8ba3c0;font-size:10px;cursor:pointer;font-family:inherit}
.smallBtn:hover{border-color:#4fc3f7;color:#c7d8ec}
#gameChatLog{position:fixed;left:14px;bottom:120px;z-index:5;max-width:260px;pointer-events:none;font-size:11px}
#gameChatInputWrap{position:fixed;left:14px;bottom:80px;z-index:6;display:none;width:260px}
#gameChatInput{width:100%;background:rgba(10,16,26,0.95);border:2px solid #4fc3f7;border-radius:9px;color:#e8f1ff;padding:8px 12px;font-size:12px;font-family:inherit;outline:none}
#pauseMenu{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.85);backdrop-filter:blur(6px)}
.pausePanel{background:rgba(20,29,43,.95);border:2px solid #2b3b52;border-radius:14px;padding:24px 32px;text-align:center;min-width:240px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pausePanel h2{font-size:22px;letter-spacing:4px;margin-bottom:14px;color:#7fdcff}
.pausePanel button{display:block;width:100%;margin:6px 0;padding:10px;border-radius:9px;border:2px solid #2b3b52;background:#141d2b;color:#c7d8ec;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.pausePanel button:hover{border-color:#4fc3f7;background:#1b2638}
#touchControls{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
.touchBtn{position:fixed;border-radius:50%;background:rgba(79,195,247,.15);border:2px solid rgba(79,195,247,.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:20px;color:#7fdcff;font-weight:900;user-select:none;touch-action:none}
.touchBtn:active{background:rgba(79,195,247,.35)}
#tbLeft{left:20px;bottom:110px;width:64px;height:64px}
#tbRight{left:100px;bottom:110px;width:64px;height:64px}
#tbJump{right:100px;bottom:110px;width:64px;height:64px}
#tbDash{right:20px;bottom:110px;width:64px;height:64px}
#tbAttack{right:60px;bottom:190px;width:56px;height:56px}
#tbSkill{right:150px;bottom:170px;width:56px;height:56px;border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.15);color:#d4b9ff}
#achievementToast{position:fixed;top:20px;right:20px;z-index:30;background:rgba(20,29,43,.95);border:2px solid #ffd54f;border-radius:12px;padding:10px 16px;display:none;box-shadow:0 8px 24px rgba(255,213,79,.3);animation:slideIn .4s ease-out}
@keyframes slideIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
#achievementToast .at-title{font-size:11px;color:#ffd54f;letter-spacing:2px;font-weight:900}
#achievementToast .at-name{font-size:15px;color:#fff;margin-top:2px;font-weight:700}
#achievementToast .at-desc{font-size:11px;color:#8ba3c0;margin-top:2px}
#roomBanner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(15,36,21,.92);border:2px solid #2a5232;border-radius:9px;padding:6px 16px;font-size:12px;color:#a5d6a7;display:none;letter-spacing:1px}
#roomBanner b{color:#4fc3f7;letter-spacing:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="roomBanner"></div>

<div id="menu">
  <h1>互坑大冒险</h1>
  <div class="sub">终极融合版 · 7 模式 · 8 角色 · 8 技能 · P2P 联机</div>

  <div class="row"><span class="lb">模式</span>
    <div class="btns" id="modeBtns">
      <button class="modeBtn active" data-v="race"><span class="mIcon">🏁</span><span class="mName">竞速</span></button>
      <button class="modeBtn" data-v="dm"><span class="mIcon">⚔️</span><span class="mName">死斗</span></button>
      <button class="modeBtn" data-v="koth"><span class="mIcon">🎯</span><span class="mName">占点</span></button>
      <button class="modeBtn" data-v="collect"><span class="mIcon">💰</span><span class="mName">收集</span></button>
      <button class="modeBtn" data-v="ctf"><span class="mIcon">🚩</span><span class="mName">夺旗</span></button>
      <button class="modeBtn" data-v="horde"><span class="mIcon">👹</span><span class="mName">大乱斗</span></button>
      <button class="modeBtn" data-v="survive"><span class="mIcon">🔥</span><span class="mName">生存</span></button>
    </div>
  </div>

  <div class="row"><span class="lb">人数</span>
    <div class="btns" id="playerBtns">
      <button data-v="1">1</button><button data-v="2" class="active">2</button>
      <button data-v="3">3</button><button data-v="4">4</button>
    </div>
  </div>

  <div class="row"><span class="lb">难度</span>
    <div class="btns" id="diffBtns">
      <button data-v="easy" class="diff">简单</button>
      <button data-v="normal" class="diff active">普通</button>
      <button data-v="hard" class="diff">困难</button>
      <button data-v="hell" class="diff">地狱</button>
      <button data-v="chaos" class="diff">混沌</button>
      <button data-v="inferno" class="diff">炼狱</button>
    </div>
  </div>

  <div class="row" id="levelRow"><span class="lb">关卡</span>
    <div class="btns" id="levelBtns">
      <button data-v="15">15</button><button data-v="25">25</button>
      <button data-v="40" class="active">40</button><button data-v="60">60</button>
    </div>
  </div>

  <div class="charSection" id="charSection"></div>

  <div id="actionRow">
    <button id="startBtn">开 始 游 戏</button>
    <button id="continueBtn">继 续 游 戏<span class="cs">第 1 / 40 关</span></button>
  </div>

  <div id="onlineRow">
    <button id="hostBtn">创 建 房 间</button>
    <button id="joinBtn">加 入 房 间</button>
  </div>
  <div id="roomInfo"></div>

  <div class="ctrlRow">
    <span style="color:#8ba3c0;font-size:10px">音量</span>
    <input id="volumeSlider" type="range" min="0" max="100" value="40">
    <span id="volumeLabel" style="color:#8ba3c0;font-size:10px;width:30px">40%</span>
    <button id="musicToggle" class="smallBtn">🎵 音乐</button>
    <button id="touchToggle" class="smallBtn">📱 触屏</button>
    <button id="statsBtn" class="smallBtn">📊 战绩</button>
  </div>

  <div id="quickStats">最佳：<b>--</b> · 通关：<b>0</b> 次 · 成就：<b>0</b>/<span id="totalAchCount">0</span></div>

  <div class="tips">
    <div><b>玩家1</b> <span class="pk">A</span><span class="pk">D</span>移动 <span class="pk">W</span>蓄力跳 <span class="pk">S</span>冲刺 <span class="pk atk">F</span>射击 <span class="pk sk">E</span>技能</div>
    <div><b>玩家2</b> <span class="pk">←</span><span class="pk">→</span>移动 <span class="pk">↑</span>蓄力跳 <span class="pk">↓</span>冲刺 <span class="pk atk">/</span>射击 <span class="pk sk">右Shift</span>技能</div>
    <div><b>玩家3</b> <span class="pk">J</span><span class="pk">L</span>移动 <span class="pk">I</span>蓄力跳 <span class="pk">K</span>冲刺 <span class="pk atk">U</span>射击 <span class="pk sk">H</span>技能</div>
    <div><b>玩家4</b> <span class="pk">4</span><span class="pk">6</span>移动 <span class="pk">8</span>蓄力跳 <span class="pk">5</span>冲刺 <span class="pk atk">7</span>射击 <span class="pk sk">+</span>技能</div>
  </div>
  <div style="font-size:10px;color:#5f7691;margin-top:2px">游戏中按 <span class="pk">T</span> 聊天 · <span class="pk">Esc</span> 暂停 · <span class="pk">1-4</span> 表情 · <span class="pk">Q</span> 标记</div>
</div>

<div id="gameChatLog"></div>
<div id="gameChatInputWrap"><input id="gameChatInput" placeholder="输入消息，回车发送，Esc 取消"></div>

<div id="pauseMenu"><div class="pausePanel">
  <h2>暂 停</h2>
  <button id="resumeBtn">继 续 游 戏</button>
  <button id="restartBtn">重 新 开 始</button>
  <button id="quitBtn">返 回 主 菜 单</button>
</div></div>

<div id="touchControls">
  <div class="touchBtn" id="tbLeft">◀</div>
  <div class="touchBtn" id="tbRight">▶</div>
  <div class="touchBtn" id="tbJump">▲</div>
  <div class="touchBtn" id="tbDash">➤</div>
  <div class="touchBtn" id="tbAttack">✦</div>
  <div class="touchBtn" id="tbSkill">⚡</div>
</div>

<div id="achievementToast">
  <div class="at-title">🏆 成就达成</div>
  <div class="at-name" id="atName"></div>
  <div class="at-desc" id="atDesc"></div>
</div>

<script>
"use strict";
const PEER_HOST = location.hostname;
const CONNECT_TIMEOUT = 20000;

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random() * (b - a);

/* ═══ 音效引擎 ═══ */
const S = {
  ctx:null, master:null, sfx:null, music:null, vol:0.4, musicOn:true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.vol;
      this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.4; this.music.connect(this.master);
    } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVol(v) { this.vol = clamp(v,0,1); if (this.master) this.master.gain.value = this.vol; },
  tone(f,d,ty='sine',v=0.2,sl=null,de=0,target=null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + de;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = ty; o.frequency.setValueAtTime(f, t);
    if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(20, sl), t + d);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(target || this.sfx);
    o.start(t); o.stop(t + d + 0.05);
  },
  noise(d,v=0.2,ff=1200,de=0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + de;
    const size = this.ctx.sampleRate * d;
    const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random()*2-1)*(1-i/size);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const flt = this.ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=ff;
    const g = this.ctx.createGain(); g.gain.value = v;
    src.connect(flt); flt.connect(g); g.connect(this.sfx);
    src.start(t);
  },
  jump() { this.tone(280,0.1,'square',0.12,520); },
  dash() { this.tone(600,0.07,'sawtooth',0.15,200); this.noise(0.06,0.08,2000); },
  shoot() { this.tone(880,0.05,'square',0.08,440); },
  hit() { this.tone(200,0.08,'square',0.18,80); },
  kill() { this.tone(523,0.08,'sine',0.2); this.tone(784,0.15,'sine',0.24,null,0.08); },
  death() { this.tone(440,0.25,'sawtooth',0.18,110); },
  clear() { [523,659,784,1047].forEach((f,i)=>this.tone(f,0.2,'sine',0.22,null,i*0.12)); },
  victory() { [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone(f,0.2,'square',0.24,null,i*0.14)); },
  coin() { this.tone(1200,0.06,'square',0.12); this.tone(1600,0.1,'square',0.12,null,0.05); },
  score() { [659,880,1047].forEach((f,i)=>this.tone(f,0.15,'square',0.2,null,i*0.08)); },
  combo(n) { this.tone(600 + Math.min(n,15)*70, 0.1, 'square', 0.2); },
  skill() { this.tone(660,0.1,'sawtooth',0.2,1200); this.noise(0.1,0.15,3000); },
  emote() { this.tone(880,0.06,'sine',0.15); this.tone(1200,0.1,'sine',0.15,null,0.04); },
  mark() { this.tone(1400,0.05,'sine',0.15); this.tone(1800,0.08,'sine',0.15,null,0.03); },
  streakDouble() { this.tone(659,0.1,'square',0.22); this.tone(880,0.2,'square',0.28,null,0.1); },
  streakTriple() { [659,880].forEach((f,i)=>this.tone(f,0.08,'square',0.22,null,i*0.08)); this.tone(1047,0.25,'square',0.3,null,0.16); },
  streakQuadra() { [659,784,880,1047].forEach((f,i)=>this.tone(f,0.1,'square',0.22,null,i*0.07)); this.tone(1319,0.35,'sawtooth',0.3,null,0.32); },
  streakPenta() { [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.1,'square',0.25,null,i*0.06)); this.tone(1568,0.5,'sawtooth',0.34,null,0.35); this.noise(0.3,0.15,3000,0.35); },
  achievement() { [659,880,1047,1319,1568].forEach((f,i)=>this.tone(f,0.15,'sine',0.25,null,i*0.1)); },
  mvpIn() { this.tone(880,0.4,'sine',0.2,1760); this.noise(0.3,0.08,2500); },
  mvpTitle() { this.tone(523,0.1,'sine',0.28); this.tone(784,0.1,'sine',0.28,null,0.1); this.tone(1047,0.5,'sine',0.35,1568,0.2); },
  mvpStat(i) { this.tone(660+i*120,0.12,'sine',0.18); }
};

/* ═══ BGM ═══ */
const BGM = {
  playing:false, current:null, timer:null, step:0,
  tracks: {
    menu:{tempo:0.35,
      chords:[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],
      melody:[523.25,587.33,659.25,587.33,523.25,440,392,440,349.23,392,440,523.25,493.88,440,392,329.63]},
    battle:{tempo:0.28,
      chords:[[220,261.63,329.63],[246.94,293.66,369.99],[196,246.94,293.66],[261.63,329.63,392]],
      melody:[659.25,784,880,784,739.99,880,987.77,880,587.33,739.99,880,739.99,784,987.77,1174.66,987.77]},
    victory:{tempo:0.42,

  },
  play(name) {
    if (!S.musicOn) return;
    S.init(); S.resume();
    if (this.current === name && this.playing) return;
    this.stop();
    const t = this.tracks[name];
    if (!t) return;
    this.current = name; this.playing = true; this.step = 0;
    this.timer = setInterval(() => this.tick(t), t.tempo * 1000);
  },
  tick(t) {
    if (!this.playing || !S.musicOn || !S.ctx) return;
    const s = this.step;
    const ci = Math.floor(s/4) % t.chords.length;
    const ch = t.chords[ci];
    if (s % 4 === 0) {
      ch.forEach(f => S.tone(f, 0.9, 'sine', 0.05, null, 0, S.music));
      S.tone(ch[0]/2, 1.0, 'triangle', 0.07, null, 0, S.music);
    }
    S.tone(t.melody[s % t.melody.length], 0.25, 'square', 0.035, null, 0, S.music);
    if (s % 4 === 2) S.noise(0.05, 0.025, 3000);
    this.step = (s+1) % 64;
  },
  stop() { this.playing = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } this.current = null; }
};

function drawCharBody(c, cx, cy, r, hi, main, lo, outline) {
  const g = c.createRadialGradient(cx - r*0.35, cy - r*0.4, r*0.1, cx, cy, r+2);
  g.addColorStop(0, hi); g.addColorStop(0.4, main); g.addColorStop(1, lo);
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI*2);
  c.fillStyle = g; c.fill();
  c.strokeStyle = outline || 'rgba(255,255,255,0.7)'; c.lineWidth = 2; c.stroke();
}
function drawNinja(c, cx, cy, r, p, t) {

  c.fillStyle = '#fff'; c.fillRect(cx - r*0.8, cy - r*0.2, r*1.6, r*0.32);
  const eo = p.facing * r * 0.18;

  c.beginPath();
  c.arc(cx - r*0.32 + eo, cy - r*0.04, r*0.13, 0, Math.PI*2);
  c.arc(cx + r*0.32 + eo, cy - r*0.04, r*0.13, 0, Math.PI*2);

  const wave = Math.sin(t*5)*4;
  c.fillStyle = '#e53935';
  c.beginPath();
  c.moveTo(cx - r*0.7, cy - r*0.1);
  c.quadraticCurveTo(cx - r*1.6, cy - r*0.3 + wave, cx - r*1.8, cy + r*0.25 + wave);
  c.lineTo(cx - r*0.7, cy + r*0.3); c.closePath(); c.fill();
  c.save();
  c.translate(cx + p.facing * r * 1.05, cy); c.rotate(t*8);
  c.fillStyle = '#c0c0c0'; c.strokeStyle = '#606060'; c.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    c.beginPath();
    c.moveTo(0,0);
    c.lineTo(Math.cos(a-0.35)*r*0.35, Math.sin(a-0.35)*r*0.35);
    c.lineTo(Math.cos(a)*r*0.5, Math.sin(a)*r*0.5);
    c.lineTo(Math.cos(a+0.35)*r*0.35, Math.sin(a+0.35)*r*0.35);
    c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
}

function drawGhost(c, cx, cy, r, p, t) {
  const floatY = Math.sin(t*2.5) * 2;
  const gy = cy + floatY;
  c.save();
  c.globalAlpha = 0.88;

    c.quadraticCurveTo(x1, gy + r*1.45, x2, gy + r);

  c.closePath();
  const g = c.createRadialGradient(cx - r*0.3, gy - r*0.4, 2, cx, gy, r*1.2);

  const eo = p.facing * r * 0.12;

/* ═══ 关卡生成 ═══ */
function G(w, ice) { return { x:0, y:1050, w, h:60, type: ice ? 'ice' : undefined }; }
function GF(sx, w, ice) { return { x:sx, y:1050, w, h:60, type: ice ? 'ice' : undefined }; }

function makeRaceLevel(i) {
  const chapter = Math.floor(i/10), sub = i % 10;
  const tier = sub < 3 ? 0 : (sub < 7 ? 1 : 2);
  const seed = i*3571 + chapter*9973 + tier*541;
  const rng = k => { const x = Math.sin(seed + k*127.1)*43758.5453; return x - Math.floor(x); };
  const platforms = [G(400)], hazards = [], items = [];
  const hzm = DIFF.haz ? DIFF.haz / 20 : 1.3;
  const B = i < 14 ? 1 : Math.min(5.0, 1.5 + (i-14)*0.16);
  const S = i < 14 ? 1 : Math.min(3.2, 1.3 + (i-14)*0.12);
  const PW = i < 14 ? 1 : Math.max(0.40, 1 - (i-14)*0.03);
  const addSpikes = (n,w1,w2) => {
    n = Math.min(30, Math.max(1, Math.round(n * hzm * B)));
    for (let j=0;j<n;j++) hazards.push({ type:'spike', x:520+rng(j+2000+n*10)*3000, y:1026, w:w1+rng(j+2100)*(w2-w1) });
  };
  const addSaws = (n,sp) => {
    n = Math.min(34, Math.max(1, Math.round(n * hzm * B)));
    for (let j=0;j<n;j++) hazards.push({ type:'saw', x:700+rng(j+3000+n*10)*2700, y:400+rng(j+3100)*550, r:26+rng(j+3200)*8, axis:rng(j+3300)<0.5?'x':'y', range:(90+rng(j+3400)*100)*S, speed:(sp+rng(j+3500)*0.8)*S });
  };
  if (chapter === 0) {
    const pc = 6+tier, sp = (WW-700)/pc;
    for (let j=0;j<pc;j++) platforms.push({ x:500+sp*j+rng(j+10)*60, y:750+rng(j+50)*200, w:160+rng(j+100)*80, h:24 });
    if (tier===1) addSpikes(2,60,90); else if (tier===2) { addSpikes(4,70,110); addSaws(2,1.6); }
  } else if (chapter === 1) {
    const pc = 7+tier, sp = (WW-700)/pc;
    const ice = tier===0?0.3:(tier===1?0.7:1.0);
    for (let j=0;j<pc;j++) platforms.push({ x:500+sp*j+rng(j+10)*60, y:750+rng(j+50)*220, w:150+rng(j+100)*80, h:24, type:rng(j+300)<ice?'ice':undefined });
    if (tier===0) addSpikes(2,60,90); else if (tier===1) addSpikes(3,70,110); else { addSpikes(5,80,130); addSaws(2,1.8); }
  } else if (chapter === 2) {
    const pc = 7+tier, sp = (WW-700)/pc;
    for (let j=0;j<pc;j++) platforms.push({ x:500+sp*j+rng(j+10)*60, y:850-j*35+rng(j+50)*80, w:130+rng(j+100)*60, h:24, type:j%2===0?'spring':undefined });
    if (tier===2) addSaws(4,2.0); else if (tier===1) addSaws(2,1.6);
  } else if (chapter === 3) {
    const pc = 8+tier, sp = (WW-700)/pc;
    const cc = tier===0?0.5:(tier===1?0.7:0.9);
    for (let j=0;j<pc;j++) platforms.push({ x:500+sp*j+rng(j+10)*50, y:800+rng(j+50)*150, w:130+rng(j+100)*40, h:22, type:rng(j+300)<cc?'crumble':undefined });
    if (tier===0) addSpikes(2,60,90); else if (tier===1) addSaws(3,1.8); else addSaws(6,2.2);
  } else if (chapter === 4) {
    const pc = 6+tier, sp = (WW-700)/pc;
    const mr = tier===0?70:(tier===1?110:150), ms = tier===0?1.2:(tier===1?1.7:2.2);
    for (let j=0;j<pc;j++) platforms.push({ x:500+sp*j+rng(j+10)*80, y:750+rng(j+50)*200, w:140+rng(j+100)*60, h:24, move:{ axis:rng(j+350)<0.5?'x':'y', range:mr*(0.7+rng(j+400)*0.6), speed:ms*(0.8+rng(j+450)*0.5) } });
    if (tier===0) addSpikes(2,60,90); else if (tier===1) { addSpikes(3,70,110); addSaws(2,1.8); } else { addSpikes(5,80,130); addSaws(5,2.2); }
  } else if (chapter === 5) {
    const pc = 8+tier, sp = (WW-700)/pc;
    for (let j=0;j<pc;j++) {
      let type; const tr = rng(j+200);
      if (tr<0.25) type='ice'; else if (tr<0.5) type='crumble'; else if (tr<0.7) type='spring';
      const plat = { x:500+sp*j+rng(j+10)*60, y:700+rng(j+50)*250, w:120+rng(j+100)*60, h:22, type };
      if (tier>=1 && rng(j+300)<0.4) plat.move = { axis:rng(j+350)<0.5?'x':'y', range:80+rng(j+400)*80, speed:1.6+rng(j+450)*1.0 };
      platforms.push(plat);
    }
    if (tier===0) { addSpikes(3,60,100); addSaws(2,1.8); } else if (tier===1) { addSpikes(4,70,110); addSaws(4,2.0); } else { addSpikes(6,80,130); addSaws(7,2.4); }
  } else if (chapter === 6) {
    const pc = 10+tier, sY=500-tier*30, eY=1000, sp = (WW-700)/pc;
    for (let j=0;j<pc;j++) {
      const prog = j/(pc-1);
      let py = sY + (eY-sY)*prog + rng(j+50)*40-20;
      let type;
      if (tier===2) { const tr=rng(j+200); type=tr<0.4?'ice':(tr<0.7?'crumble':undefined); }
      else if (tier===1) type = rng(j+200)<0.3?'ice':undefined;
      const plat = { x:500+sp*j+rng(j+10)*40, y:py, w:140+rng(j+100)*60, h:22, type };
      if (tier>=1 && rng(j+300)<0.4) plat.move = { axis:'x', range:80+rng(j+400)*60, speed:1.5+rng(j+450)*0.8 };
      platforms.push(plat);
    }
    if (tier===0) addSpikes(2,60,100); else if (tier===1) { addSpikes(3,70,120); addSaws(2,1.8); } else { addSpikes(5,80,140); addSaws(5,2.2); }
  } else {
    const pc = 10+tier, sp = (WW-700)/pc;
    for (let j=0;j<pc;j++) {
      let type; const tr = rng(j+200);
      if (tr<0.2) type='ice'; else if (tr<0.45) type='crumble'; else if (tr<0.65) type='spring';
      const plat = { x:500+sp*j+rng(j+10)*50, y:600+rng(j+50)*350, w:110+rng(j+100)*60, h:22, type };
      if (rng(j+300)<0.5) plat.move = { axis:rng(j+350)<0.5?'x':'y', range:90+rng(j+400)*90, speed:1.8+rng(j+450)*1.2 };
      platforms.push(plat);
    }
    addSpikes(tier===0?5:(tier===1?7:10),60,120);
    addSaws(tier===0?5:(tier===1?8:12),2.0);
  }
  if (i >= 14) {
    const laserN = 4 + Math.floor(rng(5000)*(1 + (i-14)*0.3));
    for (let k = 0; k < laserN; k++) {
      const isV = rng(5100+k) < 0.6;
      if (isV) hazards.push({ type:'laser', x:500+rng(5200+k)*4000, y:250+rng(5300+k)*150, w:8, h:600+rng(5400+k)*200, axis:'v', offset:rng(5500+k)*3 });
      else hazards.push({ type:'laser', x:0, y:500+rng(5600+k)*400, w:5000, h:8, axis:'h', offset:rng(5700+k)*3 });
    }
  }
  if (i >= 14) {
    const mN = 2 + Math.floor(rng(6000)*(0.5 + (i-14)*0.2));
    for (let k = 0; k < mN; k++) hazards.push({ type:'missile', x:600+rng(6100+k)*3800, y:250+rng(6200+k)*200, cd:MISSILE_CD*(0.7+rng(6300+k)*0.5), offset:rng(6400+k)*3 });
  }
  if (i >= 11) {
    const dN = 2 + Math.floor(rng(7000)*(0.5 + (i-11)*0.2));
    for (let k = 0; k < dN; k++) hazards.push({ type:'drone', x:600+rng(7100+k)*3800, y:400+rng(7200+k)*250, range:200+rng(7300+k)*100, speed:90+rng(7400+k)*60, cd:DRONE_CD*(0.7+rng(7500+k)*0.5) });
  }
  if (i >= 5 && rng(8000) < 0.5) {
    const rollingN = 1 + Math.floor(rng(8100) * 2);
    for (let k = 0; k < rollingN; k++) {
      hazards.push({ type:'boulder', x:800+rng(8200+k)*3400, y:-100-rng(8300+k)*200, r:22+rng(8400+k)*10 });
    }
  }
  if (i >= 14) {
    for (const pl of platforms) {
      if (pl.h === 60) continue;
      pl.w = Math.max(60, Math.round(pl.w * PW));
    }
  }
  platforms.push(GF(4650, 350));
  return { name:`第 ${i+1} 关`, spawn:{ x:80, y:900, spread:160 }, platforms, hazards, items, goal:{ x:4800, y:930, w:110, h:120 } };
}

const Save = {

        settings:{ nPlayers, diffKey, totalLv, gameMode, myChars:[...myChars], myNames:[...myNames], musicOn:S.musicOn, vol:S.vol },
        progress: progress || null };
      localStorage.setItem(this.KEY, JSON.stringify(data));
    } catch(e) {}
  },
  load() { try { const raw = localStorage.getItem(this.KEY); if (!raw) return null; const d = JSON.parse(raw); if (!d || d.v !== 3) return null; return d; } catch(e) { return null; } },
  clearProgress() { const d = this.load(); if (d) { d.progress = null; try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch(e) {} } },
  hasProgress() { const d = this.load(); return !!(d && d.progress && typeof d.progress.li === 'number' && d.progress.li >= 0); }
};

    else if (e.code === 'Digit2' || e.code === 'Numpad2') sendEmote(1);
    else if (e.code === 'Digit3' || e.code === 'Numpad3') sendEmote(2);
    else if (e.code === 'Digit4' || e.code === 'Numpad4') sendEmote(3);
    else if (e.code === 'KeyQ') sendPing();
  }
  if (e.code === 'Escape') {
    if (document.getElementById('gameChatInputWrap').style.display !== 'none') { closeChat(); return; }
    if (state === 'playing' && !paused) togglePause();
    else if (paused) togglePause();

  if (state === 'gameover' && e.code === 'KeyR') backToMenu();

function bindTouch(id, key, isPressed) {
  const el = document.getElementById(id);
  const set = (on) => { touchKeys[key] = on; if (on && isPressed) touchPressed[key] = true; };
  el.addEventListener('touchstart', e => { e.preventDefault(); set(true); }, { passive:false });
  el.addEventListener('touchend', e => { e.preventDefault(); set(false); }, { passive:false });
  el.addEventListener('touchcancel', e => { e.preventDefault(); set(false); }, { passive:false });
  el.addEventListener('mousedown', e => { e.preventDefault(); set(true); });
  el.addEventListener('mouseup', e => { e.preventDefault(); set(false); });
  el.addEventListener('mouseleave', () => set(false));
}

/* ═══ P2P 联机 ═══ */
const Net = {
  peer:null, conns:[], hostConn:null, role:null, code:null, myId:0, active:false,
  remIn:{}, lastBC:0, lastIn:0, onStart:null,
  genCode() { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 6; i++) c += ch[Math.floor(Math.random()*ch.length)]; return c; },
  peerConfig(extra) {
    const cfg = {
      debug: 0,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ],
        sdpSemantics: 'unified-plan'
      }
    };
    if (PEER_HOST) { cfg.host = PEER_HOST; cfg.port = 443; cfg.secure = true; cfg.path = '/peerjs'; }
    return Object.assign(cfg, extra || {});
  },
  errMsg(err) {
    if (!err) return '未知错误';
    const map = {
      'browser-incompatible':'浏览器不支持 WebRTC（请用 Chrome / Edge / Firefox）',
      'network':'网络错误，连不上信令服务器',
      'server-error':'信令服务器出错，稍后重试',
      'socket-error':'套接字断开，请重试',
      'socket-closed':'连接已关闭，请重试',
      'unavailable-id':'房间号冲突，请重新创建',
      'invalid-id':'房间号格式不合法',
      'invalid-key':'API Key 无效',
      'peer-unavailable':'找不到该房间，确认房间码是否正确'
    };
    return map[err.type] || err.message || err.type || '未知错误';
  },
  host() {
    return new Promise((resolve, reject) => {
      this.disconnect();
      const code = this.genCode();
      const fullId = 'bomb-' + code;
      let done = false, timer = null;
      const finish = (err) => {
        if (done) return;
        done = true; clearTimeout(timer);
        if (err) { try { this.peer && this.peer.destroy(); } catch(e) {} reject(err); }
        else resolve(code);
      };
      try { this.peer = new Peer(fullId, this.peerConfig()); }
      catch(e) { finish(new Error('初始化失败：' + e.message)); return; }
      timer = setTimeout(() => finish(new Error('连接信令服务器超时')), CONNECT_TIMEOUT);
      this.peer.on('open', () => {
        this.role = 'host'; this.code = code; this.myId = 0;
        this.active = true; this.remIn = {}; this.conns = [];
        this.peer.on('connection', conn => {
          conn.on('open', () => {
            this.conns.push(conn);
            try { conn.send({ type:'welcome', id:this.conns.length }); } catch(e) {}
            refreshRoomUI();
          });
          conn.on('data', data => this.onMsg(data));
          conn.on('close', () => { const i = this.conns.indexOf(conn); if (i >= 0) this.conns.splice(i, 1); refreshRoomUI(); });
          conn.on('error', e => { console.warn('conn error', e); });
        });
        this.peer.on('disconnected', () => { try { this.peer.reconnect(); } catch(e) {} });
        finish(null);
      });
      this.peer.on('error', err => { console.warn('peer error', err); finish(new Error(this.errMsg(err))); });
    });
  },
  join(code) {
    return new Promise((resolve, reject) => {
      this.disconnect();
      let done = false, timer = null;
      const finish = (err) => {
        if (done) return;
        done = true; clearTimeout(timer);
        if (err) { try { this.peer && this.peer.destroy(); } catch(e) {} reject(err); }
        else resolve();
      };
      try { this.peer = new Peer(this.peerConfig()); }
      catch(e) { finish(new Error('初始化失败：' + e.message)); return; }
      timer = setTimeout(() => finish(new Error('连接信令服务器超时')), CONNECT_TIMEOUT);
      this.peer.on('open', () => {
        const conn = this.peer.connect('bomb-' + code.toUpperCase(), { reliable:true });
        this.hostConn = conn;
        let connTimer = setTimeout(() => finish(new Error('连接房主超时，确认房间码是否正确')), 15000);
        conn.on('open', () => {
          clearTimeout(connTimer);
          this.role = 'client'; this.code = code.toUpperCase();
          this.myId = 1; this.active = true;
          finish(null);
        });
        conn.on('data', data => this.onMsg(data));
        conn.on('error', e => { clearTimeout(connTimer); finish(new Error(this.errMsg(e))); });
        conn.on('close', () => { if (this.active) { alert('与房主断开连接'); closeRoomHandler(); } });
      });
      this.peer.on('error', err => { console.warn('peer error', err); finish(new Error(this.errMsg(err))); });
    });
  },
  onMsg(data) {
    if (!data || !data.type) return;
    if (data.type === 'welcome') { this.myId = data.id; return; }
    if (this.role === 'host' && data.type === 'input') { this.remIn[data.id] = data.input; return; }
    if (this.role === 'client') {
      if (data.type === 'state') pushNetSnapshot(data.state);
      if (data.type === 'start' && this.onStart) this.onStart(data.config);
      if (data.type === 'chat') appendChat(data);
      if (data.type === 'emote') spawnEmote(data.x, data.y, data.emoji);
      if (data.type === 'ping') spawnPing(data.x, data.y, data.color);
    }
    if (this.role === 'host' && (data.type === 'emote' || data.type === 'ping')) {
      for (const c of this.conns) { try { c.send(data); } catch(e) {} }
      if (data.type === 'emote') spawnEmote(data.x, data.y, data.emoji);
      else spawnPing(data.x, data.y, data.color);
    }
  },
  bcast(force) {
    if (this.role !== 'host' || !this.active) return;
    const now = performance.now();
    if (!force && now - this.lastBC < 50) return;
    this.lastBC = now;
    const sd = {
      mode:gameMode, li, lt:Math.round(levelTime*10)/10, hostState:state,
      ps: players.map(p => ({
        id:p.id, x:Math.round(p.x), y:Math.round(p.y),
        hp:p.hp, maxHp:p.maxHp, alive:p.alive, finished:p.finished,
        finishOrder:p.finishOrder || 0, finishTime:p.finishTime || 0,
        facing:p.facing, score:p.score, kills:p.kills || 0, deaths:p.deaths || 0,
        combo:p.combo || 0,
        coins:p.coins || 0, kothTime:Math.round((p.kothTime || 0)*10)/10,
        hasFlag:p.hasFlag || false,
        character:p.character, color:p.color, name:p.name,
        shield:p.shield, heavy:p.heavy > 0, speedBoost:p.speedBoost > 0,
        charging:p.charging, chargeT:p.chargeTime,
        skillCd:Math.round((p.skillCd || 0) * 10) / 10,
        skillActive:p.skillActive || 0
      })),
      bs: bullets.slice(0, 40).map(b => ({ x:Math.round(b.x), y:Math.round(b.y), vx:Math.round(b.vx), vy:Math.round(b.vy), r:b.r, color:b.color, ownerId:b.owner.id })),
      ebs: enemyBullets.slice(0, 30).map(b => ({ x:Math.round(b.x), y:Math.round(b.y), vx:Math.round(b.vx), vy:Math.round(b.vy), r:b.r })),
      bls: level && level.haz ? level.haz.filter(h => h.type === 'boulder').map(h => ({ x:Math.round(h.x), y:Math.round(h.y), r:h.r })) : [],
      ms: { zone:modeState.zone, coins:modeState.coins, flags:modeState.flags,
            targetKills:modeState.targetKills, targetScore:modeState.targetScore,
            targetCoins:modeState.targetCoins }
    };
    for (const c of this.conns) { try { c.send({ type:'state', state:sd }); } catch(e) {} }
  },
  sendIn(inp) {
    if (this.role !== 'client' || !this.hostConn || !this.active) return;
    const now = performance.now();
    if (now - this.lastIn < 33) return;
    this.lastIn = now;
    try { this.hostConn.send({ type:'input', id:this.myId, input:inp }); } catch(e) {}
  },
  sendStart(cfg) { if (this.role !== 'host') return; for (const c of this.conns) { try { c.send({ type:'start', config:cfg }); } catch(e) {} } },
  sendChat(text) {
    if (!this.active || !text) return;
    const msg = { type:'chat', name:myNames[this.myId] || ('玩家'+(this.myId+1)), color:PCOLORS[this.myId], text:text.slice(0, 60) };
    if (this.role === 'host') { for (const c of this.conns) { try { c.send(msg); } catch(e) {} } }
    else { try { this.hostConn.send(msg); } catch(e) {} }
    appendChat(msg);
  },
  sendEmote(x, y, emoji) {
    if (!this.active) return;
    const msg = { type:'emote', x, y, emoji };
    if (this.role === 'host') { for (const c of this.conns) { try { c.send(msg); } catch(e) {} } }
    else { try { this.hostConn.send(msg); } catch(e) {} }
  },
  sendPing(x, y, color) {
    if (!this.active) return;
    const msg = { type:'ping', x, y, color };
    if (this.role === 'host') { for (const c of this.conns) { try { c.send(msg); } catch(e) {} } }
    else { try { this.hostConn.send(msg); } catch(e) {} }
  },
  disconnect() {
    try { if (this.peer) this.peer.destroy(); } catch(e) {}
    this.peer = null; this.conns = []; this.hostConn = null;
    this.role = null; this.code = null; this.active = false;
    this.remIn = {}; this.onStart = null;
  }
};

/* ═══ 网络快照 ═══ */
const netSnapshots = [];
const NET_INTERP_DELAY = 90;

function pushNetSnapshot(data) {
  netSnapshots.push({ t: performance.now(), data });
  while (netSnapshots.length > 8) netSnapshots.shift();
  const now = performance.now();
  while (netSnapshots.length > 2 && now - netSnapshots[0].t > 600) netSnapshots.shift();
}

function applyInterpolatedState() {
  if (netSnapshots.length === 0) return;
  const renderTime = performance.now() - NET_INTERP_DELAY;
  let a = netSnapshots[0], b = netSnapshots[netSnapshots.length - 1];
  for (let i = 0; i < netSnapshots.length - 1; i++) {
    if (netSnapshots[i].t <= renderTime && netSnapshots[i+1].t >= renderTime) { a = netSnapshots[i]; b = netSnapshots[i+1]; break; }
  }
  const dt = b.t - a.t;
  const t = dt > 0 ? Math.min(1, Math.max(0, (renderTime - a.t) / dt)) : 0;

  const sb = b.data;
  if (sb.mode) gameMode = sb.mode;
  if (sb.ms) modeState = Object.assign(modeState, sb.ms);
  const prevLi = li;
  li = sb.li; levelTime = sb.lt;
  if (Net.role === 'client' && Net.active && li !== prevLi) {
    loadLevel(li);
    state = 'playing';
    transT = 0;
  }

  const sa = a.data;
  for (const pb of sb.ps) {
    let p = players.find(x => x.id === pb.id);
    if (!p) { p = { id:pb.id, w:44, h:52, alive:true, mul:{}, character:'ninja', color:'#fff', name:'玩家' }; players.push(p); }
    const pa = (sa.ps || []).find(x => x.id === pb.id) || pb;
    const ix = pa.x + (pb.x - pa.x) * t;
    const iy = pa.y + (pb.y - pa.y) * t;

    if (p.id !== Net.myId) {
      p._targetX = ix;
      p._targetY = iy;
      if (p._firstSync !== true) { p.x = ix; p.y = iy; p._firstSync = true; }
    }

    if (p.id === Net.myId) {
      p.character = pb.character || p.character;
      p.color = pb.color || p.color;
      p.name = pb.name || p.name;
      p.score = pb.score;
      p.kills = pb.kills || 0;
      p.deaths = pb.deaths || 0;
      p.finished = pb.finished;
      p.finishOrder = pb.finishOrder || 0;
      p.finishTime = pb.finishTime || 0;
      p.coins = pb.coins || 0;
      p.kothTime = pb.kothTime || 0;
      p.hasFlag = pb.hasFlag || false;
      p.combo = pb.combo || 0;
      p.skillCd = pb.skillCd || 0;
      p.skillActive = pb.skillActive || 0;
      p._srv = true;
      continue;
    }
    const savedX = p.x, savedY = p.y;
    Object.assign(p, pb);
    p.x = savedX; p.y = savedY;
    p.chargeTime = pb.chargeT || 0;
    p._srv = true;
  }

  bullets = (sb.bs || []).map(b => ({
    x:b.x, y:b.y, vx:b.vx, vy:b.vy, r:b.r, color:b.color,
    owner: players.find(p => p.id === b.ownerId) || players[0],
    life:1, maxLife:1
  }));
  enemyBullets = (sb.ebs || []).map(b => ({
    x:b.x, y:b.y, vx:b.vx, vy:b.vy, r:b.r, dmg:0, life:1, maxLife:1
  }));
  if (sb.bls && level && level.haz) {
    const boulders = level.haz.filter(h => h.type === 'boulder');
    for (let i = 0; i < sb.bls.length && i < boulders.length; i++) {
      boulders[i].x = sb.bls[i].x;
      boulders[i].y = sb.bls[i].y;
      boulders[i].r = sb.bls[i].r;
    }
  }
}

/* ═══ 房间 UI ═══ */
async function createRoomHandler() {
  const info = document.getElementById('roomInfo');
  const btn = document.getElementById('hostBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  info.style.display = 'block';
  info.classList.remove('connected');
  info.innerHTML = PEER_HOST ? '正在连接自建服务器…' : '正在创建房间（约 1~10 秒）…';
  try { await Net.host(); refreshRoomUI(); }
  catch(e) { info.innerHTML = `<span style="color:#ff5252">创建失败：${e.message}</span><br><span style="font-size:10px;color:#5f7691">可重试</span>`; }
  finally { btn.disabled = false; }
}

async function joinRoomHandler() {
  const code = prompt('请输入 6 位房间码：');
  if (!code || code.length < 4) return;
  const info = document.getElementById('roomInfo');
  const btn = document.getElementById('joinBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  info.style.display = 'block';
  info.innerHTML = '正在加入（约 1~10 秒）…';
  try {
    await Net.join(code);
    Net.onStart = cfg => {
      nPlayers = cfg.nPlayers; totalLv = cfg.totalLv; diffKey = cfg.diffKey;
      gameMode = cfg.mode || 'race'; DIFF = DIFFS[diffKey];
      if (cfg.chars) for (let i=0;i<cfg.chars.length;i++) if (cfg.chars[i]) myChars[i] = cfg.chars[i];
      if (cfg.names) for (let i=0;i<cfg.names.length;i++) if (cfg.names[i]) myNames[i] = cfg.names[i];
      buildUI();
      initGame(null);
    };
    refreshRoomUI();
  } catch(e) { info.innerHTML = `<span style="color:#ff5252">加入失败：${e.message}</span><br><span style="font-size:10px;color:#5f7691">可重试</span>`; }
  finally { btn.disabled = false; }
}

function closeRoomHandler() {
  Net.disconnect();
  netSnapshots.length = 0;
  refreshRoomUI();
}

function refreshRoomUI() {
  const info = document.getElementById('roomInfo');
  const hostBtn = document.getElementById('hostBtn');
  const joinBtn = document.getElementById('joinBtn');
  const banner = document.getElementById('roomBanner');

  if (!Net.active) {
    info.style.display = 'none'; info.classList.remove('connected');
    hostBtn.textContent = '创 建 房 间'; hostBtn.onclick = createRoomHandler;
    hostBtn.classList.remove('leave'); hostBtn.style.display = '';
    joinBtn.textContent = '加 入 房 间'; joinBtn.onclick = joinRoomHandler;
    joinBtn.classList.remove('leave'); joinBtn.style.display = '';
    banner.style.display = 'none'; return;
  }

  if (Net.role === 'host') {
    info.style.display = 'block'; info.classList.add('connected');
    info.innerHTML = `房间码 <b style="color:#4fc3f7;letter-spacing:4px">${Net.code}</b> · ${Net.conns.length} 位玩家在线<br><span style="font-size:10px;color:#7d90ab">退出游戏会保留房间 · 点「开始游戏」让所有人进入</span>`;
    hostBtn.textContent = '关 闭 房 间'; hostBtn.onclick = closeRoomHandler;
    hostBtn.classList.add('leave'); hostBtn.style.display = '';
    joinBtn.style.display = 'none';
  } else if (Net.role === 'client') {
    info.style.display = 'block'; info.classList.add('connected');
    info.innerHTML = `已加入房间 <b style="color:#4fc3f7;letter-spacing:4px">${Net.code}</b> · 等待房主开始…<br><span style="font-size:10px;color:#7d90ab">退出游戏会保留连接</span>`;
    hostBtn.style.display = 'none';
    joinBtn.textContent = '离 开 房 间'; joinBtn.onclick = closeRoomHandler;
    joinBtn.classList.add('leave'); joinBtn.style.display = '';
  }

  if (state === 'playing') {
    banner.style.display = 'block';
    if (Net.role === 'host') banner.innerHTML = `房间 <b>${Net.code}</b> · ${Net.conns.length + 1} 人`;
    else banner.innerHTML = `房间 <b>${Net.code}</b> · 已连接`;
  } else banner.style.display = 'none';
}

function appendChat(m) {
  const log = document.getElementById('gameChatLog');
  if (!log) return;

  d.style.cssText = `background:rgba(10,16,26,0.8);border-left:3px solid ${m.color};padding:4px 10px;margin-bottom:3px;border-radius:6px;font-size:12px;color:#e8f1ff;transition:opacity .5s`;
  d.innerHTML = `<span style="color:${m.color};font-weight:700">${m.name}</span>: ${m.text}`;
  log.appendChild(d);
  while (log.children.length > 6) log.removeChild(log.firstChild);
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 600); }, 5000);
}

/* ═══ 主动技能 ═══ */
function fireSkill(p) {
  const cid = p.character || 'ninja';
  const cdef = CHARS.find(c => c.id === cid) || CHARS[0];
  const cdMax = (cdef.skillCd || 5) * (p.mul && p.mul.cd ? p.mul.cd : 1);
  if (p.skillCd > 0) return;
  p.skillCd = cdMax;
  const mul = p.mul || {};
  const cx = p.x + p.w/2, cy = p.y + p.h/2;
  if (cid === 'ninja') {
    const dist = 200 * (mul.dsh || 1);
    for (let i = 1; i <= 8; i++) {
      particles.push({ x: cx - p.facing*i*22, y: cy, vx: -p.facing*80, vy: rand(-30,30),
        life: 0.45, maxLife: 0.45, color: p.color, size: 5-i*0.4, gravity: 0 });
    }
    p.x += p.facing * dist;
    p.invuln = Math.max(p.invuln, 0.35);
    spawnP(p.x+p.w/2, p.y+p.h/2, 22, p.color, 400, 0.6, 0);
    addFloat(p.x+p.w/2, p.y-20, '瞬影!', p.color);
  } else if (cid === 'mage') {
    for (let i = -2; i <= 2; i++) {
      bullets.push({
        x: cx + p.facing*24, y: cy + i*10,
        vx: p.facing * BSPD, vy: i*50,
        r: 9, dmg: DIFF.atk * (mul.atk || 1) * 0.75,
        owner: p, life: BLIFE, maxLife: BLIFE, color: '#d4b9ff'
      });
    }
    spawnP(cx+p.facing*24, cy, 22, '#a78bfa', 300, 0.5, 0);
    S.shoot();
    addFloat(p.x+p.w/2, p.y-20, '弹幕!', '#a78bfa');
  } else if (cid === 'knight') {
    p.shield = true;
    p.invuln = Math.max(p.invuln, 0.6);
    spawnP(cx, cy, 30, '#ffd54f', 340, 0.8, 300);
    addFloat(p.x+p.w/2, p.y-20, '圣光护盾!', '#ffd54f');
  } else if (cid === 'robot') {
    p.skillActive = 3.0;
    spawnP(cx, cy, 26, '#ff5252', 380, 0.7, 200);
    addFloat(p.x+p.w/2, p.y-20, '火力全开!', '#ff5252');
  } else if (cid === 'cat') {
    p.vy = JVEL * 1.8;
    p.canDJ = true;
    p.invuln = Math.max(p.invuln, 0.4);
    spawnP(p.x+p.w/2, p.y+p.h, 30, '#ffb74d', 380, 0.6, 400);
    addFloat(p.x+p.w/2, p.y-20, '猫弹跳!', '#ff8a65');
    S.jump();
  } else if (cid === 'panda') {
    p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.3));
    addFloat(p.x+p.w/2, p.y-20, '+30% 血量!', '#4ade80');
    shake = Math.max(shake, 12);
    spawnP(cx, cy, 40, '#a5d6a7', 480, 0.8, 500);
    for (const o of players) {
      if (o === p || !o.alive || o.finished) continue;
      if (Math.hypot(o.x - p.x, o.y - p.y) < 240) {
        const dir = o.x < p.x ? -1 : 1;
        knock(o, dir * 1200, -700, p);
        addFloat(o.x+o.w/2, o.y-20, '地震!', '#ff8a65');
      }
    }
  } else if (cid === 'alien') {
    p.skillActive = 2.0;
    p.vy = Math.min(p.vy, -400);
    p.invuln = Math.max(p.invuln, 0.4);
    spawnP(cx, cy, 30, '#81c784', 400, 0.7, -100);
    addFloat(p.x+p.w/2, p.y-20, '重力反转!', '#81c784');
  } else if (cid === 'ghost') {
    p.invuln = Math.max(p.invuln, 1.5);
    p.skillActive = 1.5;
    spawnP(cx, cy, 30, '#d8b4fe', 340, 0.8, -100);
    addFloat(p.x+p.w/2, p.y-20, '虚化!', '#d8b4fe');
  }
  S.skill();
  Achievements.stats.skillCount = (Achievements.stats.skillCount || 0) + 1;
  Achievements.save();
  if (Achievements.stats.skillCount >= 30) Achievements.unlock('skillmaster');
}

/* ═══ 游戏生命周期 ═══ */
function startGame() {
  if (Net.active && Net.role === 'host') {
    const cc = Net.conns.length;
    nPlayers = Math.min(4, cc + 1);
    Net.sendStart({ nPlayers, totalLv, diffKey, mode:gameMode, chars:[...myChars], names:[...myNames] });
  } else Save.clearProgress();
  Save.save(null);
  initGame(null);
}

function continueGame() {
  const d = Save.load();
  if (!d || !d.progress) return;
  if (d.settings) {
    if (typeof d.settings.nPlayers === 'number') nPlayers = d.settings.nPlayers;
    if (d.settings.diffKey) diffKey = d.settings.diffKey;
    if (typeof d.settings.totalLv === 'number') totalLv = d.settings.totalLv;
    if (d.settings.gameMode) gameMode = d.settings.gameMode;
    if (d.settings.myChars) for (let i=0;i<4;i++) if (d.settings.myChars[i]) myChars[i] = d.settings.myChars[i];
    if (d.settings.myNames) for (let i=0;i<4;i++) if (d.settings.myNames[i]) myNames[i] = d.settings.myNames[i];
    document.querySelectorAll('#playerBtns button').forEach(b => b.classList.toggle('active', +b.dataset.v === nPlayers));
    document.querySelectorAll('#diffBtns button').forEach(b => b.classList.toggle('active', b.dataset.v === diffKey));
    document.querySelectorAll('#levelBtns button').forEach(b => b.classList.toggle('active', +b.dataset.v === totalLv));
    document.querySelectorAll('#modeBtns button').forEach(b => b.classList.toggle('active', b.dataset.v === gameMode));
    document.getElementById('levelRow').style.display = gameMode === 'race' ? 'flex' : 'none';
    buildUI();
  }
  S.coin();
  initGame(d.progress);
}

function initGame(resume) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('pauseMenu').style.display = 'none';
  paused = false;
  BGM.play('battle');
  DIFF = DIFFS[diffKey];
  players = [];
  const baseHp = DIFF.hp;
  for (let i = 0; i < nPlayers; i++) {
    const cid = myChars[i] || CHARS[i % CHARS.length].id;
    const cdef = CHARS.find(c => c.id === cid) || CHARS[0];
    const mul = cdef.mul || {};
    const hp = Math.round(baseHp * (mul.hp || 1));
    players.push({
      id:i, character:cid, color:cdef.color, name:myNames[i] || ('玩家'+(i+1)),
      team:i % 2,
      x:0, y:0, w:44, h:52, vx:0, vy:0,
      onGround:false, gp:null, canDJ:false, coyote:0,
      facing:1, alive:true, respT:0, dashing:0, dashCd:0, invuln:0, atkCd:0,
      finished:false, finishOrder:0, finishTime:0, fell:0, hits:0, deaths:0, kills:0, score:0,
      spawn:{x:100, y:100}, shield:false, heavy:0, speedBoost:0,
      trailT:0, charging:false, chargeTime:0, hp, maxHp:hp,
      coins:0, kothTime:0, hasFlag:false,
      mul, streak:0, streakTimer:0, lastKillTime:-99,
      combo:0, comboTimer:0, hitCount:0,
      skillCd:0, skillActive:0,
      levelHits:0, levelFell:0, _targetX:0, _targetY:0
    });
  }
  particles = []; floats = []; bullets = []; enemyBullets = []; missiles = []; monsters = [];
  shake = 0; freeze = 0;
  killFeed = []; streakPopups = []; screenBanners = [];
  mvpState.active = false;
  modeState = { mode:gameMode };
  netSnapshots.length = 0;

  let startLi = 0, startStats = null;
  if (resume && gameMode === 'race' && typeof resume.li === 'number') {
    startLi = clamp(resume.li, 0, totalLv - 1);
    startStats = resume.stats || null;
  }
  li = startLi;
  totalTime = 0;
  loadLevel(li);
  if (startStats) for (const st of startStats) {
    const p = players.find(x => x.id === st.id);
    if (p) { p.score = st.score || 0; p.kills = st.kills || 0; }
  }
  Achievements.stats.games++;
  Achievements.save();
  state = 'playing';
  refreshRoomUI();
}

function loadLevel(i) {
  let def;
  if (gameMode === 'race') def = makeRaceLevel(i % 60);
  else {
    def = makeArena();
    if (gameMode === 'koth') {
      modeState.zone = { x:2500, y:700, r:180 }; modeState.targetScore = 30;
      for (const p of players) p.kothTime = 0;
    } else if (gameMode === 'collect') {
      modeState.coins = [];
      for (let k = 0; k < 12; k++) modeState.coins.push({ x: 300+Math.random()*(WW-600), y: 500+Math.random()*400, taken:false, resp:0, bob:Math.random()*6.28 });
      modeState.targetCoins = 10;
      for (const p of players) p.coins = 0;
    } else if (gameMode === 'dm') {
      modeState.targetKills = 5;
      for (const p of players) p.kills = 0;
    } else if (gameMode === 'ctf') {
      modeState.flags = [
        { team:0, x:300, y:900, baseX:300, baseY:900, carrier:null },
        { team:1, x:WW-300, y:900, baseX:WW-300, baseY:900, carrier:null }
      ];
      modeState.targetScore = 2;
      for (const p of players) { p.score = 0; p.hasFlag = false; }
    } else if (gameMode === 'horde') {
      modeState.targetKills = 20;
      for (const p of players) p.kills = 0;
      monsters = [];
      for (let k = 0; k < 8; k++) spawnMonster();
    } else if (gameMode === 'survive') modeState.targetTime = 60;
  }
  const plats = def.platforms.map(p => ({
    x:p.x, y:p.y, w:p.w, h:p.h, baseX:p.x, baseY:p.y,
    type:p.type || 'normal', move:p.move || null,
    phase:Math.random()*Math.PI*2, dx:0, dy:0, active:true, crumble:0, resp:0
  }));
  const haz = def.hazards.map(h => ({
    ...h, baseX:h.x, baseY:h.y, phase:Math.random()*Math.PI*2, angle:0,
    timer:h.offset || 0, state:'off', cd:0,
    droneX:h.x, droneY:h.y, droneAngle:0,
    vy: h.type === 'boulder' ? 0 : undefined
  }));
  const items = def.items.map(it => ({
    x:it.x, y:it.y, type:it.type, taken:false, resp:0,
    color:ITEM_DEFS[it.type].color, phase:Math.random()*6.28
  }));
  level = { name:def.name, plats, haz, items, goal:def.goal, def };
  levelTime = 0; finishCount = 0;
  particles = []; floats = []; bullets = []; enemyBullets = []; missiles = [];

  const n = players.length;
  for (let k = 0; k < n; k++) {
    const p = players[k];
    let sx, sy;
    if (gameMode === 'race') { sx = def.spawn.x + def.spawn.spread*(k+0.5)/n; sy = def.spawn.y; }
    else { const spread = (WW-400)/Math.max(1, n-1); sx = 200 + spread*k; sy = 900; }
    p.spawn = { x:sx, y:sy };
    p.x = sx; p.y = sy;
    p._targetX = sx; p._targetY = sy;
    p.vx = 0; p.vy = 0;
    p.onGround = false; p.gp = null; p.canDJ = false; p.coyote = 0;
    p.alive = true; p.finished = false; p.finishOrder = 0; p.finishTime = 0;
    p.dashing = 0; p.dashCd = 0; p.invuln = 0; p.atkCd = 0;
    p.respT = 0; p.facing = 1; p.shield = false; p.heavy = 0; p.speedBoost = 0;
    p.charging = false; p.chargeTime = 0; p.hp = p.maxHp;
    p.deaths = 0; p.fell = 0; p.hits = 0;
    p.streak = 0; p.streakTimer = 0;
    p.combo = 0; p.comboTimer = 0; p.hitCount = 0;
    p.skillCd = 0; p.skillActive = 0;
    p.levelHits = 0; p.levelFell = 0;
    if (gameMode === 'collect') p.coins = 0;
    if (gameMode === 'koth') p.kothTime = 0;
    if (gameMode === 'ctf') { p.hasFlag = false; p.score = 0; }
    if (gameMode === 'horde' || gameMode === 'dm') p.kills = 0;
  }
  if (players.length > 0) {
    let ccx = 0, ccy = 0;
    for (const p of players) { ccx += p.x + p.w/2; ccy += p.y + p.h/2; }
    camera.x = ccx / players.length;
    camera.y = ccy / players.length;
  }
  currentScale = BASE_VIEW_SCALE;
  viewW = VW / currentScale;
  viewH = VH / currentScale;
}
