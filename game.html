<title>互坑大冒险 终极版</title>

<style>

.tag.fix{background:#2b1e0a;color:#ffb74d;border:1px solid #5c3d10}

.helpTable th,.helpTable td{border:1px solid #24344a;padding:5px 8px;text-align:center}
.helpTable th{background:#16202e;color:#8fd3ff}
.helpCard{background:#0e1622;border:1px solid #1f2c3e;border-radius:9px;padding:9px 12px;margin:6px 0}
.kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:#1b2536;border:1px solid #2c3d55;color:#9ec8ee;font-size:11px;font-weight:700}
.keyPName{font-size:13px;font-weight:900;margin-bottom:6px;letter-spacing:2px}
.keyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keyBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;background:#0e1622;border:2px solid #1f2c3e;border-radius:9px;color:#c7d8ec;font-family:inherit;cursor:pointer;min-height:56px}
.keyBtn.listening{border-color:#ffd54f;background:#2b1e0a}
.keyBtn .kA{font-size:11px;color:#7d90ab}
.keyBtn .kB{font-size:13px;font-weight:900;color:#8fd3ff}
.keyFoot,.updateFoot{padding:10px 16px;border-top:1px solid #1e2b3d;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#0e1622;border:1px solid #1f2c3e;border-radius:9px;margin:6px 0}
.setRow .st{font-size:12px;font-weight:700;color:#dbe8f7}
.setRow .sd{font-size:11px;color:#7d90ab;margin-top:2px}
.switch{width:46px;height:26px;border-radius:14px;background:#2b3b52;border:none;position:relative;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8ba3c0;transition:.2s}
.switch.on{background:#0e2233}
.switch.on::after{left:23px;background:#4fc3f7}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="roomBanner"></div>
<div id="menu">
  <h1>互坑大冒险</h1>
  <div class="sub">终极融合版 · 8 角色 · 天气 · 事件 · 联机</div>
  <div class="row"><span class="lb">模式</span><div class="btns" id="modeBtns">
    <button class="modeBtn active" data-v="race"><span class="mIcon">🏁</span><span class="mName">竞速</span></button>
    <button class="modeBtn" data-v="dm"><span class="mIcon">⚔️</span><span class="mName">死斗</span></button>
    <button class="modeBtn" data-v="koth"><span class="mIcon">🎯</span><span class="mName">占点</span></button>
    <button class="modeBtn" data-v="collect"><span class="mIcon">💰</span><span class="mName">收集</span></button>
    <button class="modeBtn" data-v="ctf"><span class="mIcon">🚩</span><span class="mName">夺旗</span></button>
    <button class="modeBtn" data-v="horde"><span class="mIcon">👹</span><span class="mName">大乱斗</span></button>
    <button class="modeBtn" data-v="survive"><span class="mIcon">🔥</span><span class="mName">生存</span></button>
  </div></div>
  <div class="row"><span class="lb">人数</span><div class="btns" id="playerBtns">
    <button data-v="1">1</button><button data-v="2" class="active">2</button><button data-v="3">3</button><button data-v="4">4</button>
  </div></div>
  <div class="row"><span class="lb">难度</span><div class="btns" id="diffBtns">
    <button data-v="easy" class="diff">简单</button><button data-v="normal" class="diff active">普通</button>
    <button data-v="hard" class="diff">困难</button><button data-v="hell" class="diff">地狱</button>
    <button data-v="chaos" class="diff">混沌</button><button data-v="inferno" class="diff">炼狱</button>
  </div></div>
  <div class="row" id="levelRow"><span class="lb">关卡</span><div class="btns" id="levelBtns">
    <button data-v="15">15</button><button data-v="25">25</button><button data-v="40" class="active">40</button><button data-v="60">60</button>
  </div></div>
  <div class="charSection" id="charSection"></div>
  <div id="actionRow"><button id="startBtn">开 始 游 戏</button><button id="continueBtn">继 续 游 戏<span class="cs">第 1 / 40 关</span></button></div>
  <div id="onlineRow"><button id="hostBtn">创 建 房 间</button><button id="joinBtn">加 入 房 间</button></div>
  <div id="roomInfo"></div>
  <div class="ctrlRow">
    <span style="color:#8ba3c0;font-size:10px">音量</span>
    <input id="volumeSlider" type="range" min="0" max="100" value="40">
    <span id="volumeLabel" style="color:#8ba3c0;font-size:10px;width:30px">40%</span>
    <button id="musicToggle" class="smallBtn">🎵 音乐</button>
    <button id="touchToggle" class="smallBtn">📱 触屏</button>
    <button id="keyBtn" class="smallBtn">⌨️ 改键</button>
    <button id="statsBtn" class="smallBtn">📊 战绩</button>
    <button id="boardBtn" class="smallBtn">🏆 排行榜</button>
    <button id="helpBtn" class="smallBtn">❓ 玩法</button>
    <button id="updateBtn" class="smallBtn">📢 更新</button>
  </div>
  <div id="quickStats">最佳：<b>--</b> · 通关：<b>0</b> 次 · 成就：<b>0</b>/<span id="totalAchCount">0</span></div>
  <div class="tips" id="tipsRow"></div>
  <div style="font-size:10px;color:#5f7691;margin-top:2px">游戏中按 <span class="pk">1-4</span> 表情 · <span class="pk">T</span> 聊天 · <span class="pk">Esc</span> 暂停 · <span class="pk">Q</span> 标记</div>
</div>
<div id="gameChatLog"></div>
<div id="gameChatInputWrap"><input id="gameChatInput" placeholder="输入消息，回车发送，Esc 取消"></div>
<div id="pauseMenu"><div class="pausePanel">
  <h2>暂 停</h2>
  <button id="resumeBtn">继 续 游 戏</button>
  <button id="retryBtn">重 开 本 关</button>
  <button id="restartBtn">重 新 开 始</button>
  <button id="quitBtn">返 回 主 菜 单</button>
</div></div>
<div id="touchControls">
  <div class="touchBtn" id="tbLeft">◀</div><div class="touchBtn" id="tbRight">▶</div>
  <div class="touchBtn" id="tbJump">▲</div><div class="touchBtn" id="tbDash">➤</div>
  <div class="touchBtn" id="tbAttack">✦</div><div class="touchBtn" id="tbSkill">⚡</div>
</div>
<div id="achievementToast"><div class="at-title">🏆 成就达成</div><div class="at-name" id="atName"></div><div class="at-desc" id="atDesc"></div></div>

<div class="modal" id="helpModal"><div class="modalPanel">
  <div class="modalHead"><div class="helpTabs">
    <button class="helpTab active" data-tab="ctrl">🎮 操作</button>
    <button class="helpTab" data-tab="mode">🎯 模式</button>
    <button class="helpTab" data-tab="rule">⚙️ 规则</button>
    <button class="helpTab" data-tab="set">🔧 设置</button>
  </div><button id="helpClose">✕</button></div>
  <div class="modalBody" id="helpBody"></div>
</div></div>

<div class="modal" id="updateModal"><div class="modalPanel">
  <div class="modalHead"><h3>🚀 版本更新公告</h3><span id="updateVerText" style="font-size:11px;color:#8ba3c0"></span></div>
  <div class="modalBody" id="updateBody"></div>
  <div class="updateFoot"><span style="font-size:11px;color:#5f7691">按 Esc 关闭</span><div><button id="updateHistory" class="smallBtn">📜 历史</button> <button id="updateOk" class="smallBtn">知道了</button></div></div>
</div></div>

<div class="modal" id="keyModal"><div class="modalPanel">
  <div class="modalHead"><h3>⌨️ 键位设置</h3><span style="font-size:11px;color:#7d90ab">点击格子 → 按下新键 · Esc 取消</span></div>
  <div class="modalBody" id="keyBody"></div>
  <div class="keyFoot"><button id="keyReset" class="smallBtn">恢复默认</button><button id="keyOk" class="smallBtn">完成</button></div>
</div></div>

<script>
"use strict";
const PEER_HOST = location.hostname;
const CONNECT_TIMEOUT = 20000;
const APP_VERSION = 'v3.0.0';
const CHANGELOG = [
  { ver:'v3.0.0', date:'2026-10-11', title:'超时直接切关 + 改键修复', items:[
    { tag:'fix', text:'超时后直接进入下一关，不再卡在 MVP 结算循环' },
    { tag:'fix', text:'改键改用 pendingHandler 机制，点击格子后按键即刻生效' },
    { tag:'fix', text:'补上到达终点的加分（第 1/2/3/4 名 = 120/80/45/20）' }
  ]},
  { ver:'v2.1.0', date:'2026-10-11', title:'联机终点判定', items:[{ tag:'fix', text:'主机主动检测客户端位置' }]},
  { ver:'v1.9.0', date:'2026-10-10', title:'关卡切换同步', items:[{ tag:'fix', text:'levelend 期间继续广播' }]},
  { ver:'v1.6.0', date:'2026-10-10', title:'怪物跳跃', items:[{ tag:'new', text:'大乱斗怪物跳跃' }]}
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);

/* 音效（精简保留） */
const S={ctx:null,master:null,sfx:null,music:null,vol:.4,musicOn:true,
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.vol;this.master.connect(this.ctx.destination);this.sfx=this.ctx.createGain();this.sfx.gain.value=1;this.sfx.connect(this.master);this.music=this.ctx.createGain();this.music.gain.value=.4;this.music.connect(this.master);}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setVol(v){this.vol=clamp(v,0,1);if(this.master)this.master.gain.value=this.vol;},
  tone(f,d,ty='sine',v=.2,sl=null,de=0,target=null){if(!this.ctx)return;const t=this.ctx.currentTime+de;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(target||this.sfx);o.start(t);o.stop(t+d+.05);},
  noise(d,v=.2,ff=1200,de=0){if(!this.ctx)return;const t=this.ctx.currentTime+de;const size=this.ctx.sampleRate*d;const buf=this.ctx.createBuffer(1,size,this.ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<size;i++)data[i]=(Math.random()*2-1)*(1-i/size);const src=this.ctx.createBufferSource();src.buffer=buf;const flt=this.ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=ff;const g=this.ctx.createGain();g.gain.value=v;src.connect(flt);flt.connect(g);g.connect(this.sfx);src.start(t);},

function makeRaceLevel(i){

const KeyModal={
  el:null,body:null,listening:null,pendingHandler:null,
  init(){
    this.el=document.getElementById('keyModal');
    this.body=document.getElementById('keyBody');
    if(!this.el||!this.body)return;
    document.getElementById('keyReset').onclick=()=>{
      if(confirm('恢复默认键位？')){
        KEYMAP=cloneKeymap(DEFAULT_KEYMAP);
        saveKeymap();
        this.listening=null;
        this.render();
        updateTips();
      }
    };
    document.getElementById('keyOk').onclick=()=>this.hide();
    this.el.addEventListener('click',e=>{if(e.target===this.el)this.hide();});
  },
  isOpen(){return this.el&&this.el.style.display==='flex';},
  show(){this.el.style.display='flex';this.listening=null;this.render();},
  hide(){
    this.el.style.display='none';
    if(this.pendingHandler){document.removeEventListener('keydown',this.pendingHandler,true);this.pendingHandler=null;}
    this.listening=null;
  },
  keyName(k){if(!k)return'—';const map={Slash:'/',Period:'.',Comma:',',Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']',Backslash:'\\',Minus:'-',Equal:'=',Backquote:'`',Space:'Space',Enter:'Enter',Backspace:'Bksp',NumpadAdd:'Num+',NumpadSubtract:'Num-',NumpadMultiply:'Num*',NumpadDivide:'Num/',NumpadDecimal:'Num.',NumpadEnter:'NumEnt',ShiftLeft:'LShift',ShiftRight:'RShift',ControlLeft:'LCtrl',ControlRight:'RCtrl',AltLeft:'LAlt',AltRight:'RAlt'};if(map[k])return map[k];return k.replace('Key','').replace('Digit','').replace('Numpad','Num').replace('Arrow','');},
  render(){
    let html='';
    for(let pi=0;pi<4;pi++){
      const color=PCOLORS[pi];
      html+=`<div style="margin-bottom:14px"><div class="keyPName" style="color:${color}">玩家 ${pi+1}</div><div class="keyGrid">`;
      for(const a of ACTION_KEYS){
        const ks=(KEYMAP[pi]&&KEYMAP[pi][a])||[];
        const isL=this.listening&&this.listening.pi===pi&&this.listening.action===a;
        const label=isL?'按下新键…':(ks.map(k=>this.keyName(k)).join(' / ')||'—');
        html+=`<button class="keyBtn ${isL?'listening':''}" data-pi="${pi}" data-action="${a}"><span class="kA">${ACTION_NAMES[a]}</span><span class="kB">${label}</span></button>`;
      }
      html+=`</div></div>`;
    }
    this.body.innerHTML=html;
    const that=this;
    this.body.querySelectorAll('.keyBtn').forEach(b=>{
      b.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        that.startListening(+b.dataset.pi,b.dataset.action);
      });
    });
  },
  startListening(pi,action){
    if(this.pendingHandler){document.removeEventListener('keydown',this.pendingHandler,true);this.pendingHandler=null;}
    this.listening={pi,action};
    this.render();
    const that=this;
    this.pendingHandler=function(e){
      e.preventDefault();
      e.stopPropagation();
      const code=e.code;
      document.removeEventListener('keydown',that.pendingHandler,true);
      that.pendingHandler=null;
      if(code==='Escape'){
        that.listening=null;
        that.render();
        return;
      }
      if(['Tab','F5','F11','F12','F1','F2','F3','F4','F6','F7','F8','F9','F10'].includes(code))return;
      const km=KEYMAP[pi];
      for(const a of ACTION_KEYS){
        if(a===action)continue;
        km[a]=(km[a]||[]).filter(k=>k!==code);
      }
      km[action]=[code];
      saveKeymap();
      that.listening=null;
      that.render();
      updateTips();
      if(typeof S!=='undefined'&&S.ctx)S.coin();
    };
    document.addEventListener('keydown',this.pendingHandler,true);
  }
};

/* 输入 */
addEventListener('keydown',e=>{
  if(KeyModal.pendingHandler)return;
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash'].includes(e.code))e.preventDefault();
  if(state==='playing'&&e.code==='KeyT'&&document.getElementById('gameChatInputWrap').style.display==='none'){e.preventDefault();openChat();}
  const chatOpen=document.getElementById('gameChatInputWrap').style.display!=='none';
  const modalOpen=KeyModal.isOpen()||UpdateModal.isOpen()||HelpModal.isOpen();
  if(state!=='menu' && !chatOpen && !modalOpen){
    const c=e.code,k=e.key;
    let emoteIdx=-1;
    if(c==='Digit1'||c==='Numpad1'||k==='1'||k==='!')emoteIdx=0;
    else if(c==='Digit2'||c==='Numpad2'||k==='2'||k==='@')emoteIdx=1;
    else if(c==='Digit3'||c==='Numpad3'||k==='3'||k==='#')emoteIdx=2;
    else if(c==='Digit4'||c==='Numpad4'||k==='4'||k==='$')emoteIdx=3;
    if(emoteIdx>=0){e.preventDefault();sendEmote(emoteIdx);}
    else if(c==='KeyQ'||k==='q'||k==='Q')sendPing();
  }
  if(e.code==='Escape'){
    if(KeyModal.isOpen()){KeyModal.hide();return;}
    if(UpdateModal.isOpen()){UpdateModal.hide();return;}
    if(HelpModal.isOpen()){HelpModal.hide();return;}
    if(chatOpen){closeChat();return;}
    if(state==='playing'&&!paused)togglePause();else if(paused)togglePause();
  }
  if(state==='gameover'&&e.code==='KeyR')backToMenu();
},true);

const netSnapshots=[];const NET_INTERP_DELAY=90;

function applyInterpolatedState(){
  if(!netSnapshots.length)return;
  const renderTime=performance.now()-NET_INTERP_DELAY;
  let a=netSnapshots[0],b=netSnapshots[netSnapshots.length-1];
  for(let i=0;i<netSnapshots.length-1;i++){if(netSnapshots[i].t<=renderTime&&netSnapshots[i+1].t>=renderTime){a=netSnapshots[i];b=netSnapshots[i+1];break;}}
  const dt=b.t-a.t;
  const t=dt>0?Math.min(1,Math.max(0,(renderTime-a.t)/dt)):0;
  const sb=b.data;
  if(sb.mode)gameMode=sb.mode;
  if(sb.ms)modeState=Object.assign(modeState,sb.ms);
  if(sb.weather)weather={type:sb.weather,timer:0,intensity:1};
  if(sb.event){if(!activeEvent||activeEvent.type!==sb.event)activeEvent={type:sb.event,timer:sb.eventTimer||12};else activeEvent.timer=sb.eventTimer||activeEvent.timer;}else if(activeEvent)activeEvent=null;
  const prevLi=li;
  li=sb.li;levelTime=sb.lt;
  // ★ 客户端检测 li 变化 → 立即切关
  if(Net.role==='client'&&Net.active&&li!==prevLi){
    loadLevel(li);
    state='playing';
    transT=0;
    mvpState.active=false;
  }
  if(Net.role==='client'&&Net.active&&sb.hostState==='levelend'&&state==='playing'){state='levelend';transT=9999;S.clear();}
  const sa=a.data;
  for(const pb of sb.ps){
    let p=players.find(x=>x.id===pb.id);
    if(!p){p={id:pb.id,w:44,h:52,alive:true,mul:{},character:'ninja',color:'#fff',name:'玩家'};players.push(p);}
    const pa=(sa.ps||[]).find(x=>x.id===pb.id)||pb;
    const ix=pa.x+(pb.x-pa.x)*t;
    const iy=pa.y+(pb.y-pa.y)*t;
    if(p.id!==Net.myId){p._targetX=ix;p._targetY=iy;if(p._firstSync!==true){p.x=ix;p.y=iy;p._firstSync=true;}}
    if(p.id===Net.myId){
      p.character=pb.character||p.character;p.color=pb.color||p.color;p.name=pb.name||p.name;
      p.score=pb.score;p.kills=pb.kills||0;p.deaths=pb.deaths||0;
      p.finished=pb.finished;p.finishOrder=pb.finishOrder||p.finishOrder||0;p.finishTime=pb.finishTime||p.finishTime||0;
      p.coins=pb.coins||0;p.kothTime=pb.kothTime||0;p.hasFlag=pb.hasFlag||false;
      p.combo=pb.combo||0;p.skillCd=pb.skillCd||0;p.skillActive=pb.skillActive||0;p.rage=pb.rage||false;
      p._srv=true;continue;
    }
    const savedX=p.x,savedY=p.y;
    Object.assign(p,pb);
    p.x=savedX;p.y=savedY;p.chargeTime=pb.chargeT||0;p._srv=true;
  }
  bullets=(sb.bs||[]).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,color:b.color,owner:players.find(p=>p.id===b.ownerId)||players[0],life:1,maxLife:1}));
  enemyBullets=(sb.ebs||[]).map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,dmg:0,life:1,maxLife:1}));
}

/* ★★★ checkGoalFor —— 加分补回 + 客户端乐观标记 ★★★ */
function checkGoalFor(p){
  if(gameMode!=='race')return;
  if(!p.alive)return;
  if(!level||!level.goal)return;
  const g=level.goal;
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  const overlap=rect(p,g);
  const centerIn=cx>g.x-15&&cx<g.x+g.w+15&&cy>g.y-40&&cy<g.y+g.h+40;
  if(!overlap&&!centerIn)return;
  // 客户端：本地乐观标记，立即显示"✓ 到达"
  if(Net.role==='client'){
    if(p.id===Net.myId&&!p._localFinished){
      p._localFinished=true;
      p.finished=true;
      if(!p.finishTime)p.finishTime=levelTime;
    }
    return;
  }
  // 主机端：已处理过就跳过
  if(p.finished)return;
  p.finished=true;
  let maxOrder=0;
  for(const o of players){if(o!==p&&o.finished)maxOrder=Math.max(maxOrder,o.finishOrder||0);}
  p.finishOrder=maxOrder+1;
  p.finishTime=levelTime;
  p.vx=0;p.vy=0;
  // ★ 加分补回
  const bonus=nPlayers===1?100:[120,80,45,20][Math.min(p.finishOrder-1,3)];
  p.score+=bonus;
  finishCount++;
  if(p.finishOrder===1){raceWaitTimer=RACE_WAIT_MAX;addFloat(p.x+p.w/2,p.y-70,'等待其他玩家…','#8fd3ff');}
  spawnConfetti(p.x+p.w/2,p.y+p.h/2,40);
  spawnP(p.x+p.w/2,p.y+p.h/2,36,'#ffd54f',360,1.1,400);
  addFloat(p.x+p.w/2,p.y-40,`第 ${p.finishOrder} 名! +${bonus}`, '#ffd54f');
  screenBanners.push({text:`${p.name} 到达终点!`,subText:`第 ${p.finishOrder} 名`,color:'#ffd54f',accent:'#ffb300',life:1.8,maxLife:1.8});
  shake=Math.max(shake,8);S.finish();
}

function moveCol(p,dt){p.gp=null;p.x+=p.vx*dt;for(const pl of level.plats){if(!pl.active)continue;if(rect(p,pl)){if(p.vx>0)p.x=pl.x-p.w;else if(p.vx<0)p.x=pl.x+pl.w;p.vx=0;}}p.y+=p.vy*dt;p.onGround=false;for(const pl of level.plats){if(!pl.active)continue;if(rect(p,pl)){if(p.vy>=0){p.y=pl.y-p.h;p.onGround=true;p.gp=pl;if(pl.type==='spring'){p.vy=JVEL*SPRING_MULT;p.onGround=false;p.canDJ=true;p.gp=null;p.charging=false;p.chargeTime=0;spawnP(p.x+p.w/2,p.y+p.h,16,'#7ee08a',320,.5,300);}else p.vy=0;if(pl.type==='crumble'&&pl.crumble<=0)pl.crumble=DIFF.crumb;}else{p.y=pl.y+pl.h;p.vy=0;}}}if(p.x<-140)p.x=-140;if(p.x+p.w>WW+140)p.x=WW+140-p.w;if(p.onGround)p.coyote=.09;}
function resolvePC(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j];if(!a.alive||!b.alive||a.finished||b.finished)continue;if(!rect(a,b))continue;const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);const oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);if(ox<oy){const d=(a.x+a.w/2)<(b.x+b.w/2)?-1:1;a.x+=d*ox*.5;b.x-=d*ox*.5;if(a.dashing>0&&b.dashing<=0){knock(b,-d*980,-560,a);a.dashing=0;}else if(b.dashing>0&&a.dashing<=0){knock(a,d*980,-560,b);b.dashing=0;}else{a.vx+=d*200*(1/60);b.vx-=d*200*(1/60);}}else{const d=(a.y+a.h/2)<(b.y+b.h/2)?-1:1;a.y+=d*oy*.5;b.y-=d*oy*.5;}}}
function knock(t,vx,vy,src){if(t.invuln>0||t.finished)return;const mul=t.mul||{};vx*=(mul.kb||1);vy*=(mul.kb||1);if(t.heavy>0){t.vx+=vx*.12;t.vy+=vy*.12;return;}if(t.shield){t.shield=false;t.invuln=.9;spawnP(t.x+t.w/2,t.y+t.h/2,26,'#ffd54f',320,.7,300);return;}t.vx=vx;t.vy=vy;t.invuln=.4;t.dashing=0;t.charging=false;t.chargeTime=0;t.canDJ=true;spawnP(t.x+t.w/2,t.y+t.h/2,20,src.color,400,.6,500);shake=Math.max(shake,5);}
function checkHaz(p){if(p.invuln>0||p.finished)return;for(const h of level.haz){if(h.type==='spike'){if(rect(p,{x:h.x,y:h.y,w:h.w,h:24})){hitP(p,h.x+h.w/2,h.y+12,'尖刺');return;}}else if(h.type==='saw'){if(circleRect(h.x,h.y,h.r,p.x,p.y,p.w,p.h)){hitP(p,h.x,h.y,'锯片');return;}}else if(h.type==='laser'&&h.state==='on'){let hit=false;if(h.axis==='v')hit=p.x+p.w>h.x-h.w/2&&p.x<h.x+h.w/2&&p.y+p.h>h.y&&p.y<h.y+h.h;else hit=p.y+p.h>h.y-h.h/2&&p.y<h.y+h.h/2&&p.x+p.w>h.x&&p.x<h.x+h.w;if(hit){hitP(p,p.x+p.w/2,p.y+p.h/2,'激光');return;}}}for(const m of missiles){if(circleRect(m.x,m.y,14,p.x,p.y,p.w,p.h)){m.life=0;hitP(p,m.x,m.y,'导弹',DIFF.haz);return;}}}
function hitP(p,sx,sy,lb,dmgOverride){if(p.invuln>0||p.finished||!p.alive)return;if(p.shield){p.shield=false;p.invuln=1;spawnP(p.x+p.w/2,p.y+p.h/2,26,'#ffd54f',340,.7,300);addFloat(p.x+p.w/2,p.y-16,'格挡!','#ffd54f');return;}const cx=p.x+p.w/2,cy=p.y+p.h/2;let dx=cx-sx,dy=cy-sy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;if(dy>-.4)dy=-.7;const kb=(p.mul.kb||1)*(p.heavy>0?.2:1);p.vx=dx*720*kb;p.vy=dy*720*kb;p.invuln=.85;p.dashing=0;p.charging=false;p.chargeTime=0;p.canDJ=true;p.hits++;p.levelHits++;const dmg=dmgOverride||DIFF.haz;p.hp-=dmg;spawnP(cx,cy,22,'#ff5252',420,.7,500);addFloat(cx,p.y-16,`-${dmg} ${lb}`,'#ff5252');S.hit();shake=Math.max(shake,7);if(p.hp<=0){p.hp=0;killP(p,lb);}}
function killP(p,reason,src){if(!p.alive||p.finished)return;p.alive=false;p.respT=DIFF.resp;if(reason==='掉落'){p.fell++;p.levelFell++;p.score-=40;}else{p.deaths++;p.score-=25;}if(src&&src!==p){registerKill(src,p);src.score+=40;addFloat(src.x+src.w/2,src.y-40,'+40!','#ffd54f');}S.death();spawnP(p.x+p.w/2,Math.min(p.y+p.h/2,DEATH_Y-100),30,p.color,420,1,600);shake=Math.max(shake,9);}
function fireBullet(p){S.shoot();const cx=p.x+p.w/2,cy=p.y+p.h/2,f=p.facing;bullets.push({x:cx+f*30,y:cy,vx:f*BSPD,vy:0,r:10,dmg:DIFF.atk*(p.mul.atk||1)*(p.rage?1.5:1),owner:p,life:BLIFE,maxLife:BLIFE,color:p.color});spawnP(cx+f*34,cy,8,p.color,200,.22,0);p.vx-=f*40;}
function updateBullets(dt){if(Net.role==='client'&&Net.active)return;for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-100||b.x>WW+100||b.y<-100||b.y>DEATH_Y){b.life=0;continue;}for(const o of players){if(o===b.owner||!o.alive||o.finished||o.invuln>0)continue;const ox=o.x+o.w/2,oy=o.y+o.h/2;if(Math.hypot(ox-b.x,oy-b.y)<o.w*.6+b.r){hitBullet(b,o);b.life=0;break;}}if(b.life<=0)continue;for(const m of monsters){const mx=m.x+m.w/2,my=m.y+m.h/2;if(Math.hypot(mx-b.x,my-b.y)<m.w*.6+b.r){m.hp-=b.dmg;if(m.hp<=0){if(b.owner){b.owner.kills=(b.owner.kills||0)+1;b.owner.score+=30;}spawnP(mx,my,24,'#ff5722',400,.6,500);if(gameMode==='horde'&&b.owner&&b.owner.kills>=modeState.targetKills){state='gameover';modeState.winner=b.owner.id;}}b.life=0;break;}}}bullets=bullets.filter(b=>b.life>0);
  for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-100||b.x>WW+100||b.y<-100||b.y>DEATH_Y){b.life=0;continue;}for(const p of players){if(!p.alive||p.finished||p.invuln>0)continue;const px=p.x+p.w/2,py=p.y+p.h/2;if(Math.hypot(px-b.x,py-b.y)<p.w*.6+b.r){if(p.shield){p.shield=false;p.invuln=.9;}else{p.hp-=b.dmg||DIFF.haz*.6;p.vx+=(b.vx>0?1:-1)*200;p.vy=-220;p.invuln=.5;if(p.hp<=0){p.hp=0;killP(p,'无人机');}}b.life=0;break;}}}enemyBullets=enemyBullets.filter(b=>b.life>0);}
function hitBullet(b,t){addCombo(b.owner);if(t.heavy>0){t.hp-=b.dmg*.35;t.vx+=(b.vx>0?1:-1)*BKB*.15;}else if(t.shield){t.shield=false;t.invuln=.9;spawnP(t.x+t.w/2,t.y+t.h/2,26,'#ffd54f',320,.7,300);return;}else{t.hp-=b.dmg;const kb=(b.vx>0?BKB:-BKB)*(t.mul.kb||1);t.vx=kb;t.vy=-240;t.invuln=.28;t.dashing=0;t.charging=false;t.chargeTime=0;t.canDJ=true;}spawnP(b.x,b.y,20,b.color,380,.5,400);shake=Math.max(shake,5);if(t.hp<=0){t.hp=0;killP(t,'击杀',b.owner);}}
function addCombo(p){if(!p)return;const now=levelTime;if(now-(p.comboTimer||-99)<1.5)p.combo=(p.combo||0)+1;else p.combo=1;p.comboTimer=now;if(p.combo>=3)S.combo(p.combo);}

function updateMonsters(dt){if(Net.role==='client'&&Net.active)return;for(const m of monsters){m.atkCd-=dt;m.jumpCd-=dt;let target=null,bd=Infinity;for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<600&&d<bd){bd=d;target=p;}}if(target){const dx=target.x-m.x;const dy=target.y-m.y;const adx=Math.abs(dx);const dir=Math.sign(dx);m.facing=dir;const playerAbove=dy<-40&&adx<140;let blocked=false;if(m.onGround){const testX=m.x+m.w/2+dir*24;for(const pl of level.plats){if(!pl.active)continue;if(testX>pl.x&&testX<pl.x+pl.w&&pl.y<m.y+m.h&&pl.y>m.y-10){blocked=true;break;}}}if(m.onGround&&m.jumpCd<=0&&(playerAbove||blocked)){m.vy=-720;m.onGround=false;m.jumpCd=.7;}if(bd>40)m.x+=dir*m.speed*dt;else if(m.atkCd<=0&&Math.abs(dy)<40){m.atkCd=.9;if(!target.invuln)hitP(target,m.x,m.y,'怪物');}}
    m.vy+=GRAV*dt;if(m.vy>1400)m.vy=1400;if(m.x<100)m.x=100;if(m.x+m.w>WW-100)m.x=WW-100-m.w;const prevY=m.y;m.y+=m.vy*dt;m.onGround=false;for(const pl of level.plats){if(!pl.active)continue;if(m.x<pl.x+pl.w&&m.x+m.w>pl.x&&m.y+m.h>pl.y&&m.y<pl.y+pl.h){if(m.vy>=0&&prevY+m.h<=pl.y+4){m.y=pl.y-m.h;m.vy=0;m.onGround=true;}else if(m.vy<0&&prevY>=pl.y+pl.h-4){m.y=pl.y+pl.h;m.vy=0;}}}if(m.y>1300){m.y=900;m.vy=0;m.onGround=false;}}
  if(gameMode==='horde'&&monsters.length<8&&Math.random()<.7)spawnMonster();
}
function updatePlats(dt){for(const p of level.plats){const ox=p.x,oy=p.y;if(p.move){p.phase+=p.move.speed*dt;const off=Math.sin(p.phase)*p.move.range;if(p.move.axis==='x')p.x=p.baseX+off;else p.y=p.baseY+off;}p.dx=p.x-ox;p.dy=p.y-oy;if(p.type==='crumble'){if(!p.active){p.resp-=dt;if(p.resp<=0){p.active=true;p.crumble=0;}}else if(p.crumble>0){p.crumble-=dt;if(p.crumble<=0){p.active=false;p.resp=CRUMBLE_RESPAWN;p.crumble=0;}}}}}
function updateHaz(dt){for(const h of level.haz){if(h.type==='saw'){h.phase+=h.speed*DIFF.saw*dt;h.angle+=dt*14;if(h.axis==='x')h.x=h.baseX+Math.sin(h.phase)*h.range;else if(h.axis==='y')h.y=h.baseY+Math.sin(h.phase)*h.range;}else if(h.type==='laser'){h.timer+=dt;const totalCycle=LASER_ON+LASER_OFF+LASER_WARN;const t=(h.timer/(totalCycle/DIFF.saw))%1;const warnEnd=LASER_WARN/totalCycle;const onEnd=(LASER_WARN+LASER_ON)/totalCycle;if(t<warnEnd)h.state='warn';else if(t<onEnd)h.state='on';else h.state='off';}else if(h.type==='missile'&&Net.role!=='client'){h.timer+=dt;if(h.timer>=h.cd/DIFF.saw){h.timer=0;let target=null,bd=Infinity;for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-h.x,p.y-h.y);if(d<bd){bd=d;target=p;}}if(target&&bd<1400){missiles.push({x:h.x,y:h.y,vx:0,vy:0,speed:MISSILE_SPD,target,life:MISSILE_LIFE,angle:0,trailTimer:0});}}}else if(h.type==='drone'&&Net.role!=='client'){h.droneX=h.x+Math.sin(h.timer*.8+h.phase)*h.range;h.droneY=h.y+Math.sin(h.timer*.5+h.phase*1.7)*60;h.timer+=dt;h.droneAngle+=dt*3;h.cd-=dt;if(h.cd<=0){let target=null,bd=Infinity;for(const p of players){if(!p.alive||p.finished)continue;const d=Math.hypot(p.x-h.droneX,p.y-h.droneY);if(d<DRONE_DETECT&&d<bd){bd=d;target=p;}}if(target){h.cd=DRONE_CD/DIFF.saw;const ang=Math.atan2(target.y-h.droneY,target.x-h.droneX);enemyBullets.push({x:h.droneX,y:h.droneY,vx:Math.cos(ang)*DRONE_BSPD,vy:Math.sin(ang)*DRONE_BSPD,r:8,dmg:DIFF.haz*.6,life:2.5,maxLife:2.5});}}}}
  if(Net.role!=='client'){for(const m of missiles){m.life-=dt;if(!m.target||!m.target.alive||m.target.finished){m.target=null;for(const p of players){if(p.alive&&!p.finished){m.target=p;break;}}}if(m.target){const desired=Math.atan2(m.target.y-m.y,m.target.x-m.x);let diff=desired-m.angle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;m.angle+=clamp(diff,-MISSILE_TURN*dt,MISSILE_TURN*dt);}m.vx=Math.cos(m.angle)*m.speed;m.vy=Math.sin(m.angle)*m.speed;m.x+=m.vx*dt;m.y+=m.vy*dt;}missiles=missiles.filter(m=>m.life>0);}}
function updateItems(dt){if(Net.role==='client'&&Net.active)return;for(const it of level.items)if(it.taken){it.resp-=dt;if(it.resp<=0)it.taken=false;}}
function checkItem(p){if(Net.role==='client'&&Net.active&&p.id!==Net.myId)return;if(p.finished)return;for(const it of level.items){if(it.taken)continue;const cx=p.x+p.w/2,cy=p.y+p.h/2;if(Math.hypot(cx-it.x,cy-it.y)<38){it.taken=true;it.resp=ITEM_DEFS[it.type].resp;if(it.type==='shield'){p.shield=true;addFloat(p.x+p.w/2,p.y-20,'护盾!','#ffd54f');}else if(it.type==='heavy'){p.heavy=ITEM_DEFS.heavy.dur;}else if(it.type==='speed'){p.speedBoost=ITEM_DEFS.speed.dur;}p.score+=5;S.coin();}}
  if(gameMode==='collect'&&modeState.coins){for(const c of modeState.coins){if(c.taken)continue;const cx=p.x+p.w/2,cy=p.y+p.h/2;if(Math.hypot(cx-c.x,cy-c.y)<38){c.taken=true;c.resp=5;p.coins=(p.coins||0)+1;p.score+=20;S.score();if(p.coins>=modeState.targetCoins){state='gameover';modeState.winner=p.id;}}}}}
function updateModeLogic(dt){if(state!=='playing')return;if(Net.role==='client'&&Net.active)return;
  if(gameMode==='koth'&&modeState.zone){const z=modeState.zone;for(const p of players){if(!p.alive)continue;const cx=p.x+p.w/2,cy=p.y+p.h/2;if(Math.hypot(cx-z.x,cy-z.y)<z.r){p.kothTime=(p.kothTime||0)+dt;p.score+=dt*5;if(p.kothTime>=modeState.targetScore){state='gameover';modeState.winner=p.id;}}}}
  if(gameMode==='dm'){for(const p of players)if((p.kills||0)>=modeState.targetKills){state='gameover';modeState.winner=p.id;}}
  if(gameMode==='collect'&&modeState.coins){for(const c of modeState.coins){if(c.taken){c.resp-=dt;if(c.resp<=0){c.taken=false;c.x=300+Math.random()*(WW-600);c.y=500+Math.random()*400;}}}}
  if(gameMode==='ctf'&&modeState.flags){for(const p of players){if(!p.alive||!p.hasFlag)continue;const homeFlag=modeState.flags.find(f=>f.team===p.team);if(Math.hypot(p.x-homeFlag.baseX,p.y-homeFlag.baseY)<60){p.score++;p.hasFlag=false;const f=modeState.flags.find(f=>f.team!==p.team);f.carrier=null;f.x=f.baseX;f.y=f.baseY;S.victory();spawnP(p.x+p.w/2,p.y+p.h/2,40,'#ffd54f',400,.9,300);shake=Math.max(shake,12);if(p.score>=modeState.targetScore){state='gameover';modeState.winner=p.id;}}}}
  if(gameMode==='survive'){if(nPlayers>1){const alive=players.filter(p=>p.alive).length;if(alive<=1){state='gameover';const w=players.find(p=>p.alive);modeState.winner=w?w.id:-1;}}else if(levelTime>=90){state='gameover';modeState.winner=players[0]?players[0].id:-1;}}
}
function updateParticles(dt){for(const pt of particles){pt.vy+=pt.gravity*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;}particles=particles.filter(p=>p.life>0);for(const t of floats){t.y+=t.vy*dt;t.vy*=.93;t.life-=dt;}floats=floats.filter(t=>t.life>0);for(const k of killFeed)k.life-=dt;killFeed=killFeed.filter(k=>k.life>0);for(const s of streakPopups){s.life-=dt;s.y+=s.vy*dt;s.vy*=.96;const t=1-s.life/s.maxLife;if(t<.3)s.scale=.3+(t/.3)*1.2;else if(t<.5)s.scale=1.5-((t-.3)/.2)*.5;else s.scale=1;}streakPopups=streakPopups.filter(s=>s.life>0);for(const b of screenBanners)b.life-=dt;screenBanners=screenBanners.filter(b=>b.life>0);if(emoteFeedback.timer>0)emoteFeedback.timer-=dt;}
function updateCamera(dt){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;let count=0;for(const p of players){let px=p.x,py=p.y;if(!p.alive&&p.respT>.4){px=p.spawn.x;py=p.spawn.y;}minX=Math.min(minX,px);maxX=Math.max(maxX,px+p.w);minY=Math.min(minY,py);maxY=Math.max(maxY,py+p.h);count++;}if(count===0){camera.x=WW/2;camera.y=WH/2;currentScale=BASE_VIEW_SCALE;viewW=VW/currentScale;viewH=VH/currentScale;return;}const targetX=(minX+maxX)/2;const targetY=(minY+maxY)/2;const padX=200,padY=220;const bbW=Math.max(500,(maxX-minX)+padX*2);const bbH=Math.max(400,(maxY-minY)+padY*2);const scaleX=VW/bbW,scaleY=VH/bbH;const targetScale=Math.max(MIN_VIEW_SCALE,Math.min(scaleX,scaleY,BASE_VIEW_SCALE));currentScale+=(targetScale-currentScale)*Math.min(1,dt*3.5);viewW=VW/currentScale;viewH=VH/currentScale;const k=Math.min(1,dt*5);camera.x+=(targetX-camera.x)*k;camera.y+=(targetY-camera.y)*k;const halfW=viewW/2,halfH=viewH/2;if(viewW>=WW)camera.x=WW/2;else camera.x=clamp(camera.x,halfW,WW-halfW);if(viewH>=WH)camera.y=WH/2;else camera.y=clamp(camera.y,halfH,WH-halfH);}

/* ★★★ 主更新 —— 超时直接切关，不再走 levelend ★★★ */
function update(dt){
  if(paused)return;
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(freeze>0){freeze-=dt;dt*=.3;}
  if(state==='playing'){
    levelTime+=dt;
    if(Net.role==='client'&&Net.active)applyInterpolatedState();
    if(Net.role!=='client'){if(activeEvent){activeEvent.timer-=dt;if(activeEvent.timer<=0){activeEvent=null;nextEventTime=20+Math.random()*15;}}else{nextEventTime-=dt;if(nextEventTime<=0)triggerRandomEvent();}}
    updatePlats(dt);updateHaz(dt);updatePlayers(dt);updateBullets(dt);updateMonsters(dt);updateItems(dt);updateModeLogic(dt);
    // ★ 竞速超时：首位到达后 10 秒，直接进下一关
    if(Net.role!=='client'&&gameMode==='race'&&finishCount>0){
      const allFinished=players.every(p=>p.finished);
      if(!allFinished){
        raceWaitTimer-=dt;
        if(raceWaitTimer<=0){
          screenBanners.push({text:'超时跳过',subText:'未到达的按当前名次结算',color:'#ff8a65',accent:'#ff5252',life:1.5,maxLife:1.5});
          // ★ 直接切关
          li++;
          if(li>=totalLv){
            state='gameover';Save.clearProgress();
            BGM.play('victory');S.victory();
            Achievements.stats.wins++;Achievements.save();
            for(const p of players){if(p.score>0)Leaderboard.add({name:p.name,score:p.score,mode:gameMode,diff:DIFF.name,time:Date.now()});}
            const mvp=calculateMVP();
            if(mvp){mvpState={active:true,timer:0,duration:5,player:mvp,title:'总 MVP',subTitle:'全场最有价值玩家',stats:[{label:'总分',value:mvp.score||0,color:'#ffd54f'},{label:'总击杀',value:mvp.kills||0,color:'#ff8a65'},{label:'掉落',value:mvp.fell||0,color:'#ff5252'},{label:'死亡',value:mvp.deaths||0,color:'#4fc3f7'}],playedSounds:{}};}
          } else {
            loadLevel(li);
            state='playing';
            saveProgress();
            mvpState.active=false;
          }
          // 立即广播，让客户端同步
          Net.bcast(true);
        }
      }
    }
    updateParticles(dt);updateCamera(dt);
    if(Net.active){
      if(Net.role==='host'){for(const pid in Net.remIn){const p=players.find(x=>x.id===+pid);if(p)p._netIn=Net.remIn[pid];}Net.bcast();}

  const emoteTip=['👍','😂','💀','🔥'];const tipY=VH-100;const tipX0=14;
  ctx.save();ctx.globalAlpha=.75;
  for(let i=0;i<4;i++){const bx=tipX0+i*34;ctx.beginPath();ctx.arc(bx+14,tipY,13,0,Math.PI*2);ctx.fillStyle='rgba(10,16,26,0.75)';ctx.fill();ctx.strokeStyle='rgba(79,195,247,0.5)';ctx.lineWidth=1.5;ctx.stroke();ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#8fd3ff';ctx.fillText(String(i+1),bx+14,tipY-6);ctx.font='14px system-ui';ctx.fillText(emoteTip[i],bx+14,tipY+6);}
  ctx.restore();
}
function drawLevelEnd(){
  ctx.fillStyle='rgba(0,0,0,0.68)';ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 48px system-ui';ctx.fillStyle='#4ade80';ctx.shadowColor='#22c55e';ctx.shadowBlur=30;
  ctx.fillText('关 卡 完 成 ！',VW/2,VH/2-60);ctx.shadowBlur=0;
  if(Net.role==='client'&&Net.active){ctx.font='17px system-ui';ctx.fillStyle='#8fd3ff';ctx.fillText('等待主机进入下一关…',VW/2,VH/2+40);}
  else{const next=Math.max(0,Math.ceil(transT));ctx.font='17px system-ui';ctx.fillStyle='#7d94b0';ctx.fillText(li+1>=totalLv?'结算中…':`${next} 秒后下一关…`,VW/2,VH/2+40);}
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 50px system-ui';ctx.fillStyle='#ffd54f';ctx.shadowColor='#ffb300';ctx.shadowBlur=36;
  ctx.fillText('最 终 结 算',VW/2,VH/2-200);ctx.shadowBlur=0;
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  sorted.forEach((p,i)=>{const y=VH/2-30+i*50;ctx.font='bold 24px system-ui';ctx.textAlign='right';ctx.fillStyle=i===0?'#ffd54f':p.color;ctx.fillText(`${i+1}. ${p.name}`,VW/2-20,y);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(`${p.score} 分`,VW/2+20,y);});
  ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillStyle='#8fd3ff';
  ctx.fillText('按 R 键返回主菜单（房间保留）',VW/2,VH-50);
}
function drawMVP(dt){if(!mvpState.active||!mvpState.player)return;mvpState.timer+=dt;const t=mvpState.timer;const dur=mvpState.duration;if(t>dur){mvpState.active=false;return;}const bgA=t<.5?t/.5:(t>dur-.5?1-(t-(dur-.5))/.5:1);const p=mvpState.player;ctx.save();ctx.fillStyle=`rgba(0,0,0,${.88*bgA})`;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=bgA;ctx.font='bold 68px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffd54f';ctx.fillText(mvpState.title,VW/2,VH/2-100);ctx.font='bold 44px system-ui';ctx.fillStyle=p.color;ctx.fillText(p.name,VW/2,VH/2);ctx.restore();}

const UpdateModal={el:null,body:null,
  init(){this.el=document.getElementById('updateModal');this.body=document.getElementById('updateBody');if(!this.el||!this.body)return;document.getElementById('updateOk').onclick=()=>this.hide();document.getElementById('updateHistory').onclick=()=>this.showHistory();this.el.addEventListener('click',e=>{if(e.target===this.el)this.hide();});this.check();},
  getSeen(){try{return localStorage.getItem('bomb_seen_version')||'';}catch(e){return'';}},
  setSeen(v){try{localStorage.setItem('bomb_seen_version',v);}catch(e){}},
  check(){if(this.getSeen()===APP_VERSION)return;setTimeout(()=>this.show(),350);},
  show(){const cur=CHANGELOG[0];document.getElementById('updateVerText').textContent=`${cur.ver} · ${cur.date}`;this.body.innerHTML=this.renderVersion(cur);this.el.style.display='flex';this.setSeen(APP_VERSION);},
  hide(){this.el.style.display='none';},
  isOpen(){return this.el&&this.el.style.display==='flex';},
  showHistory(){this.body.innerHTML=CHANGELOG.map(c=>this.renderVersion(c)).join('<div style="height:1px;background:#1e2b3d;margin:16px 0"></div>');document.getElementById('updateVerText').textContent='历史';},
  renderVersion(v){const tm={new:['new','新增'],fix:['fix','修复'],opt:['opt','优化']};return`<h4>${v.title} · ${v.ver} · ${v.date}</h4><ul>${v.items.map(it=>{const t=tm[it.tag]||tm.new;return`<li><span class="tag ${t[0]}">${t[1]}</span>${it.text}</li>`;}).join('')}</ul>`;}
};

function checkCharAchievement(){const used=Achievements.stats.usedChars||{};for(const c of myChars)used[c]=true;Achievements.stats.usedChars=used;Achievements.save();}
function loadNamesInit(){const saved=Save.load();if(saved&&saved.settings){if(saved.settings.musicOn!==undefined)S.musicOn=saved.settings.musicOn;if(saved.settings.vol!==undefined){S.vol=saved.settings.vol;document.getElementById('volumeSlider').value=Math.round(S.vol*100);document.getElementById('volumeLabel').textContent=Math.round(S.vol*100)+'%';document.getElementById('musicToggle').textContent=S.musicOn?'🎵 音乐':'🔇 静音';}}}
loadNamesInit();Achievements.load();HelpModal.init();KeyModal.init();UpdateModal.init();buildUI();updateTips();updateContinueBtn();updateQuickStats();refreshRoomUI();BGM.play('menu');
setInterval(()=>{if(state==='playing'){Achievements.stats.totalTime+=60;Achievements.save();}},60000);
let lastT=performance.now();
function loop(now){let dt=(now-lastT)/1000;lastT=now;if(dt>1/30)dt=1/30;update(dt);render(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
