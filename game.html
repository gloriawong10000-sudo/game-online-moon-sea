/* ═══ 工具 ═══ */
function rect(a, b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx+rw), ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}
function rr(c, x, y, w, h, rad) {
  rad = Math.min(rad, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+rad, y);
  c.arcTo(x+w, y, x+w, y+h, rad);
  c.arcTo(x+w, y+h, x, y+h, rad);
  c.arcTo(x, y+h, x, y, rad);
  c.arcTo(x, y, x+w, y, rad);
  c.closePath();
}
function spawnP(x, y, n, c, sp, lf, g = 1200) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2;
    const s = sp*(0.25 + Math.random()*0.75);
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-70, life:lf*(0.6+Math.random()*0.6), maxLife:lf, color:c, size:2.5+Math.random()*4, gravity:g });
  }
}
function addFloat(x, y, t, c) { floats.push({ x, y, text:t, color:c, life:1.1, maxLife:1.1, vy:-60 }); }

/* ═══ 击杀 / 连杀 ═══ */
function registerKill(killer, victim) {
  if (!killer || killer === victim) return;
  const now = levelTime;
  killer.kills = (killer.kills || 0) + 1;
  const dt = now - (killer.lastKillTime || -99);
  if (dt <= 3.0 && killer.streak > 0) killer.streak++;
  else killer.streak = 1;
  killer.lastKillTime = now;
  killer.streakTimer = 3.0;
  killFeed.push({ killerName:killer.name, killerColor:killer.color, victimName:victim.name, victimColor:victim.color, life:4.0, maxLife:4.0 });
  if (killFeed.length > 5) killFeed.shift();
  const texts = { 2:'双 杀!', 3:'三 杀!', 4:'四 杀!', 5:'五 杀!' };
  if (killer.streak >= 2 && killer.streak <= 5) {
    streakPopups.push({ x:killer.x+killer.w/2, y:killer.y-30, text:texts[killer.streak],
      color:killer.streak>=4?'#ff5252':(killer.streak===3?'#ff9800':'#ffd54f'),
      life:1.6, maxLife:1.6, vy:-70, scale:0.3, big:killer.streak>=3 });
  } else if (killer.streak > 5) {
    streakPopups.push({ x:killer.x+killer.w/2, y:killer.y-30, text:'超 神!', color:'#e040fb', life:2.2, maxLife:2.2, vy:-80, scale:0.3, big:true });
  }
  if (killer.streak >= 3) {
    screenBanners.push({
      text:killer.streak===3?'三 杀':killer.streak===4?'四 杀':killer.streak===5?'五 杀':'超 神',
      subText:killer.name, color:killer.color,
      accent:killer.streak>=5?'#e040fb':(killer.streak>=4?'#ff5252':'#ff9800'),
      life:1.8, maxLife:1.8 });
    if (killer.streak >= 3) Achievements.unlock('combo3');
    if (killer.streak >= 5) Achievements.unlock('combo5');
  }
  switch (killer.streak) {
    case 1: S.kill(); break; case 2: S.streakDouble(); break;
    case 3: S.streakTriple(); break; case 4: S.streakQuadra(); break;
    case 5: S.streakPenta(); break;
    default: if (killer.streak > 5) S.streakPenta(); break;
  }
  shake = Math.max(shake, killer.streak >= 3 ? 14 : 8);
  freeze = Math.max(freeze, 0.08);
}

/* ═══ 玩家更新 ═══ */
function updatePlayers(dt) { for (const p of players) updatePlayer(p, dt); resolvePC(); }

function updatePlayer(p, dt) {
  // 主机端：直接应用客户端上报的位置
  if (Net.role === 'host' && Net.active && p.id !== Net.myId && p._netIn) {
    const i = p._netIn;
    if (typeof i.myX === 'number') {
      p.x = i.myX; p.y = i.myY;
      p.facing = i.myFacing || p.facing;
      p.hp = i.myHp; p.alive = i.myAlive;
      p.dashing = i.myDashing || 0;
      p.charging = i.myCharging || false;
      p.chargeTime = i.myChargeTime || 0;
      p.shield = i.myShield || false;
      p.heavy = i.myHeavy ? 9 : 0;
      p.speedBoost = i.mySpeed ? 9 : 0;
      if (gameMode === 'race' && !p.finished && level.goal && rect(p, level.goal)) {
        p.finished = true; finishCount++;
        p.finishOrder = finishCount; p.finishTime = levelTime;
        spawnP(p.x+p.w/2, p.y+p.h/2, 36, '#ffd54f', 360, 1.1, 400);
        shake = Math.max(shake, 6);
      }
    }
    return;
  }
  // 客户端：远程玩家插值
  if (Net.role === 'client' && Net.active && p.id !== Net.myId) {
    if (p._targetX !== undefined) {
      const rate = 1 - Math.pow(0.0005, dt);
      p.x += (p._targetX - p.x) * rate;
      p.y += (p._targetY - p.y) * rate;
    }
    if (p.skillCd > 0) p.skillCd -= dt;
    if (p.skillActive > 0) p.skillActive -= dt;
    return;
  }

  if (p.finished) { p.vx = 0; p.vy = 0; return; }
  if (!p.alive) {
    p.respT -= dt;
    if (p.respT <= 0) {
      p.alive = true; p.x = p.spawn.x; p.y = p.spawn.y;
      p.vx = 0; p.vy = 0; p.dashing = 0; p.charging = false; p.chargeTime = 0;
      p.invuln = 0.7; p.canDJ = false; p.hp = p.maxHp;
      p.combo = 0; p.comboTimer = 0; p.skillCd = 0;
      spawnP(p.x+p.w/2, p.y+p.h/2, 16, p.color, 220, 0.6);
    }
    return;
  }
  if (p.invuln > 0) p.invuln -= dt;
  if (p.dashCd > 0) p.dashCd -= dt;
  if (p.dashing > 0) p.dashing -= dt;
  if (p.atkCd > 0) p.atkCd -= dt;
  if (p.heavy > 0) p.heavy -= dt;
  if (p.speedBoost > 0) p.speedBoost -= dt;
  if (p.coyote > 0) p.coyote -= dt;
  if (p.streakTimer > 0) { p.streakTimer -= dt; if (p.streakTimer <= 0) p.streak = 0; }
  if (p.comboTimer > 0) { p.comboTimer -= dt; if (p.comboTimer <= 0) p.combo = 0; }
  if (p.skillCd > 0) p.skillCd -= dt;
  if (p.skillActive > 0) p.skillActive -= dt;
  if (p.gp && p.gp.active) { p.x += p.gp.dx; p.y += p.gp.dy; }

  let left, right, jP, jH, dP, aP, sP;
  if (p._netIn) {
    const i = p._netIn;
    left = i.left; right = i.right; jP = i.jumpP; jH = i.jumpHeld; dP = i.dashP; aP = i.attackP; sP = i.skillP;
  } else if (p.id === 0 && touchEnabled && !Net.active) {
    left = touchKeys.left; right = touchKeys.right;
    jP = touchPressed.jump; jH = touchKeys.jump;
    dP = touchPressed.dash; aP = touchPressed.attack; sP = touchPressed.skill;
  } else {
    const m = KEYMAP[p.id];
    left = m.left.some(k => keys[k]); right = m.right.some(k => keys[k]);
    jP = m.jump.some(k => pressed[k]); jH = m.jump.some(k => keys[k]);
    dP = m.dash.some(k => pressed[k]); aP = m.attack.some(k => pressed[k]);
    sP = m.skill ? m.skill.some(k => pressed[k]) : false;
  }
  const mul = p.mul || {};
  let dir = 0;
  if (left) dir -= 1;
  if (right) dir += 1;
  if (dir !== 0 && p.dashing <= 0) p.facing = dir;
  const isIce = (p.gp && p.gp.active && p.gp.type === 'ice');

  // 主动技能
  if (sP && p.skillCd <= 0) fireSkill(p);
  // 火力全开
  const atkMul = (p.skillActive > 0 && p.character === 'robot') ? 0.4 : 1;
  if (aP && p.atkCd <= 0 && p.dashing <= 0) {
    p.atkCd = ACD * (mul.ratk || 1) * atkMul;
    p.charging = false; p.chargeTime = 0;
    fireBullet(p);
  }
  if (p.charging) {
    if (jH && p.onGround) {
      p.chargeTime = Math.min(p.chargeTime + dt, CHARGE_TIME);
      const ratio = p.chargeTime / CHARGE_TIME;
      if (Math.random() < 0.4 + ratio*0.6) {
        const a = Math.random()*Math.PI*2;
        const r = 36 + Math.random()*22;
        particles.push({ x: p.x+p.w/2 + Math.cos(a)*r, y: p.y+p.h/2 + Math.sin(a)*r,
          vx: -Math.cos(a)*180, vy: -Math.sin(a)*180, life:0.32, maxLife:0.32,
          color: ratio > 0.85 ? '#ffd54f' : p.color, size: 2 + ratio*3, gravity:0 });
      }
      p.vx *= Math.pow(0.2, dt);
    } else if (!jH) {
      const ratio = p.chargeTime / CHARGE_TIME;
      const mult = CHARGE_MIN + (CHARGE_MAX - CHARGE_MIN) * ratio;
      p.vy = JVEL * mult * (mul.jmp || 1);
      p.onGround = false; p.coyote = 0; p.canDJ = true;
      p.charging = false;
      const burst = 8 + Math.floor(ratio*22);
      const bColor = ratio > 0.85 ? '#ffd54f' : p.color;
      spawnP(p.x+p.w/2, p.y+p.h, burst, bColor, 200 + ratio*320, 0.5);
      if (ratio > 0.7) { shake = Math.max(shake, 3 + ratio*4); addFloat(p.x+p.w/2, p.y-20, ratio > 0.9 ? '完美!' : '强力跳!', bColor); }
      p.chargeTime = 0;
      S.jump();
    } else { p.charging = false; p.chargeTime = 0; }
  } else {
    if (jP && p.dashing <= 0) {
      if (p.onGround || p.coyote > 0) { p.charging = true; p.chargeTime = 0; }
      else if (p.canDJ) { p.vy = JVEL * 0.88; p.canDJ = false; spawnP(p.x+p.w/2, p.y+p.h, 12, '#fff', 200, 0.4, 0); S.jump(); }
    }
  }
  if (p.dashing > 0) {
    p.vx = p.facing * DSPD * (mul.dsh || 1) * (0.5 + 0.5*(p.dashing/DTIME));
    p.trailT -= dt;
    if (p.trailT <= 0) { p.trailT = 0.02; spawnP(p.x+p.w/2, p.y+p.h/2, 2, p.color, 60, 0.3, 0); }
  } else if (!p.charging) {
    const acc = ACC * (isIce ? 0.18 : 1);
    const mv = MSPD * (mul.spd || 1) * (p.speedBoost > 0 ? 1.55 : 1) * (isIce ? 1.2 : 1);
    if (dir !== 0) { p.vx += dir * acc * dt; p.vx = clamp(p.vx, -mv, mv); }
    else {
      if (isIce) p.vx *= Math.pow(0.42, dt);
      else p.vx *= Math.pow(p.onGround ? 0.00015 : 0.35, dt);
    }
  }
  if (dP && p.dashCd <= 0 && p.dashing <= 0) {
    p.charging = false; p.chargeTime = 0;
    p.dashing = DTIME * (mul.dsh || 1);
    p.dashCd = DCD * (mul.cd || 1);
    p.vx = p.facing * DSPD * (mul.dsh || 1);
    p.vy = -160; p.canDJ = true;
    spawnP(p.x+p.w/2, p.y+p.h/2, 14, p.color, 260, 0.45, 0);
    S.dash();
  }
  const gravMul = (p.skillActive > 0 && p.character === 'alien') ? 0.15 : 1;
  if (p.dashing > 0) p.vy += GRAV * 0.1 * dt * gravMul;
  else p.vy += GRAV * dt * gravMul;
  if (p.vy > 1600) p.vy = 1600;
  moveCol(p, dt);
  if (p.y > DEATH_Y) { killP(p, '掉落'); return; }
  checkHaz(p);
  checkItem(p);

  if (gameMode === 'ctf' && modeState.flags) {
    for (const f of modeState.flags) {
      if (f.team === p.team) continue;
      if (f.carrier === null && Math.hypot(p.x - f.x, p.y - f.y) < 40) {
        f.carrier = p; p.hasFlag = true;
        addFloat(p.x+p.w/2, p.y-40, '抢到旗子!', '#ffd54f');
        spawnP(f.x, f.y, 20, '#ffd54f', 300, 0.6, 200);
      }
    }
  }
  if (Net.role !== 'client' && gameMode === 'race' && !p.finished && level.goal && rect(p, level.goal)) {
    p.finished = true; finishCount++;
    p.finishOrder = finishCount; p.finishTime = levelTime;
    if (nPlayers === 1) p.score += 100;
    else { const b = [120, 80, 45, 20][Math.min(finishCount-1, 3)]; p.score += b; }
    spawnP(p.x+p.w/2, p.y+p.h/2, 36, '#ffd54f', 360, 1.1, 400);
    shake = Math.max(shake, 6);
    if (p.finishTime <= 10) Achievements.unlock('speedrun');
    if (p.levelHits === 0) Achievements.unlock('perfection');
    if (p.levelFell === 0) Achievements.unlock('noFall');
  }
}

function moveCol(p, dt) {
  p.gp = null;
  p.x += p.vx * dt;
  for (const pl of level.plats) {
    if (!pl.active) continue;
    if (rect(p, pl)) {
      if (p.vx > 0) p.x = pl.x - p.w;
      else if (p.vx < 0) p.x = pl.x + pl.w;
      p.vx = 0;
    }
  }
  p.y += p.vy * dt;
  p.onGround = false;
  for (const pl of level.plats) {
    if (!pl.active) continue;
    if (rect(p, pl)) {
      if (p.vy >= 0) {
        p.y = pl.y - p.h; p.onGround = true; p.gp = pl;
        if (pl.type === 'spring') {
          p.vy = JVEL * SPRING_MULT; p.onGround = false; p.canDJ = true; p.gp = null;
          p.charging = false; p.chargeTime = 0;
          spawnP(p.x+p.w/2, p.y+p.h, 16, '#7ee08a', 320, 0.5, 300);
          shake = Math.max(shake, 3);
        } else p.vy = 0;
        if (pl.type === 'crumble' && pl.crumble <= 0) pl.crumble = DIFF.crumb;
      } else { p.y = pl.y + pl.h; p.vy = 0; }
    }
  }
  if (p.x < -140) p.x = -140;
  if (p.x + p.w > WW + 140) p.x = WW + 140 - p.w;
  if (p.onGround) p.coyote = 0.09;
}

function resolvePC() {
  for (let i = 0; i < players.length; i++) for (let j = i+1; j < players.length; j++) {
    const a = players[i], b = players[j];
    if (!a.alive || !b.alive || a.finished || b.finished) continue;
    if (!rect(a, b)) continue;
    const ox = Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y);
    if (ox < oy) {
      const d = (a.x+a.w/2) < (b.x+b.w/2) ? -1 : 1;
      a.x += d*ox*0.5; b.x -= d*ox*0.5;
      if (a.dashing > 0 && b.dashing <= 0) { knock(b, -d*980, -560, a); a.dashing = 0; }
      else if (b.dashing > 0 && a.dashing <= 0) { knock(a, d*980, -560, b); b.dashing = 0; }
      else { a.vx += d*200*(1/60); b.vx -= d*200*(1/60); }
    } else {
      const d = (a.y+a.h/2) < (b.y+b.h/2) ? -1 : 1;
      a.y += d*oy*0.5; b.y -= d*oy*0.5;
      if (d < 0) {
        if (a.vy > 200 && !b.heavy && b.invuln <= 0) { b.vy = 480; b.vx += (b.x - a.x)*2.5; addFloat(b.x+b.w/2, b.y-14, '被踩!', '#ff8a65'); }
        a.onGround = true; if (a.vy > 0) a.vy = 0;
      } else {
        if (b.vy > 200 && !a.heavy && a.invuln <= 0) { a.vy = 480; a.vx += (a.x - b.x)*2.5; addFloat(a.x+a.w/2, a.y-14, '被踩!', '#ff8a65'); }
        b.onGround = true; if (b.vy > 0) b.vy = 0;
      }
    }
  }
}

function knock(t, vx, vy, src) {
  if (t.invuln > 0) return;
  const mul = t.mul || {};
  vx *= (mul.kb || 1); vy *= (mul.kb || 1);
  if (t.heavy > 0) { t.vx += vx*0.12; t.vy += vy*0.12; addFloat(t.x+t.w/2, t.y-16, '免疫', '#a78bfa'); return; }
  if (t.shield) { t.shield = false; t.invuln = 0.9; spawnP(t.x+t.w/2, t.y+t.h/2, 26, '#ffd54f', 320, 0.7, 300); return; }
  t.vx = vx; t.vy = vy; t.invuln = 0.4; t.dashing = 0;
  t.charging = false; t.chargeTime = 0; t.canDJ = true;
  spawnP(t.x+t.w/2, t.y+t.h/2, 20, src.color, 400, 0.6, 500);
  shake = Math.max(shake, 5);
}

function checkHaz(p) {
  if (p.invuln > 0) return;
  for (const h of level.haz) {
    if (h.type === 'spike') {
      if (rect(p, { x:h.x, y:h.y, w:h.w, h:24 })) { hitP(p, h.x+h.w/2, h.y+12, '尖刺'); return; }
    } else if (h.type === 'saw') {
      if (circleRect(h.x, h.y, h.r, p.x, p.y, p.w, p.h)) { hitP(p, h.x, h.y, '锯片'); return; }
    } else if (h.type === 'laser' && h.state === 'on') {
      let hit = false;
      if (h.axis === 'v') hit = p.x + p.w > h.x - h.w/2 && p.x < h.x + h.w/2 && p.y + p.h > h.y && p.y < h.y + h.h;
      else hit = p.y + p.h > h.y - h.h/2 && p.y < h.y + h.h/2 && p.x + p.w > h.x && p.x < h.x + h.w;
      if (hit) { hitP(p, p.x + p.w/2, p.y + p.h/2, '激光'); return; }
    } else if (h.type === 'boulder') {
      if (circleRect(h.x, h.y, h.r, p.x, p.y, p.w, p.h)) { hitP(p, h.x, h.y, '滚石'); return; }
    }
  }
  for (const m of missiles) {
    if (circleRect(m.x, m.y, 14, p.x, p.y, p.w, p.h)) { m.life = 0; hitP(p, m.x, m.y, '导弹', DIFF.haz); return; }
  }
}

function hitP(p, sx, sy, lb, dmgOverride) {
  if (p.invuln > 0 || p.finished || !p.alive) return;
  if (p.shield) { p.shield = false; p.invuln = 1.0; spawnP(p.x+p.w/2, p.y+p.h/2, 26, '#ffd54f', 340, 0.7, 300); addFloat(p.x+p.w/2, p.y-16, '格挡!', '#ffd54f'); return; }
  const cx = p.x+p.w/2, cy = p.y+p.h/2;
  let dx = cx-sx, dy = cy-sy;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  if (dy > -0.4) dy = -0.7;
  const kb = (p.mul.kb || 1) * (p.heavy > 0 ? 0.2 : 1);
  p.vx = dx*720*kb; p.vy = dy*720*kb;
  p.invuln = 0.85;
  p.dashing = 0; p.charging = false; p.chargeTime = 0; p.canDJ = true;
  p.hits++; p.levelHits++;
  const dmg = dmgOverride || DIFF.haz;
  p.hp -= dmg;
  spawnP(cx, cy, 22, '#ff5252', 420, 0.7, 500);
  addFloat(cx, p.y-16, `-${dmg} ${lb}`, '#ff5252');
  S.hit(); shake = Math.max(shake, 7);
  if (p.hp <= 0) { p.hp = 0; killP(p, lb); }
}

function killP(p, reason, src) {
  if (!p.alive) return;
  p.alive = false; p.respT = DIFF.resp;
  if (reason === '掉落') { p.fell++; p.levelFell++; p.score -= 40; }
  else { p.deaths++; p.score -= 25; }
  if (p.hasFlag && modeState.flags) {
    const f = modeState.flags.find(f => f.team !== p.team);
    if (f && f.carrier === p) { f.carrier = null; f.x = p.x; f.y = p.y; }
    p.hasFlag = false;
  }
  if (src && src !== p) { registerKill(src, p); src.score += 40; addFloat(src.x+src.w/2, src.y-40, '+40 击杀!', '#ffd54f'); }
  S.death();
  spawnP(p.x+p.w/2, Math.min(p.y+p.h/2, DEATH_Y-100), 30, p.color, 420, 1.0, 600);
  shake = Math.max(shake, 9);
}

function fireBullet(p) {
  S.shoot();
  const cx = p.x+p.w/2, cy = p.y+p.h/2, f = p.facing;
  bullets.push({ x: cx+f*30, y: cy, vx:f*BSPD, vy:0, r:10, dmg: DIFF.atk * (p.mul.atk || 1), owner: p, life:BLIFE, maxLife:BLIFE, color:p.color });
  spawnP(cx+f*34, cy, 8, p.color, 200, 0.22, 0);
  p.vx -= f*40;
}

function updateBullets(dt) {
  if (Net.role === 'client' && Net.active) return;
  for (const b of bullets) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.x < -100 || b.x > WW+100 || b.y < -100 || b.y > DEATH_Y) { b.life = 0; continue; }
    for (const o of players) {
      if (o === b.owner || !o.alive || o.finished || o.invuln > 0) continue;
      const ox = o.x+o.w/2, oy = o.y+o.h/2;
      if (Math.hypot(ox-b.x, oy-b.y) < o.w*0.6+b.r) { hitBullet(b, o); b.life = 0; break; }
    }
    if (b.life <= 0) continue;
    for (const m of monsters) {
      const mx = m.x+m.w/2, my = m.y+m.h/2;
      if (Math.hypot(mx-b.x, my-b.y) < m.w*0.6+b.r) {
        m.hp -= b.dmg;
        spawnP(b.x, b.y, 12, b.color, 300, 0.4, 300);
        if (m.hp <= 0) {
          m.dead = true;
          if (b.owner) { b.owner.kills = (b.owner.kills || 0) + 1; b.owner.score += 30; addFloat(mx, my-30, '+30', '#ffd54f'); S.score(); }
          spawnP(mx, my, 24, '#ff5722', 400, 0.6, 500);
          if (gameMode === 'horde' && b.owner && b.owner.kills >= modeState.targetKills) { state = 'gameover'; modeState.winner = b.owner.id; }
        }
        b.life = 0; break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  for (const b of enemyBullets) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.x < -100 || b.x > WW+100 || b.y < -100 || b.y > DEATH_Y) { b.life = 0; continue; }
    for (const p of players) {
      if (!p.alive || p.finished || p.invuln > 0) continue;
      const px = p.x+p.w/2, py = p.y+p.h/2;
      if (Math.hypot(px-b.x, py-b.y) < p.w*0.6+b.r) {
        if (p.shield) { p.shield = false; p.invuln = 0.9; spawnP(px, py, 26, '#ffd54f', 320, 0.7, 300); }
        else {
          p.hp -= b.dmg || DIFF.haz*0.6;
          p.vx += (b.vx > 0 ? 1 : -1)*200;
          p.vy = -220; p.invuln = 0.5;
          p.hits++; p.levelHits++;
          addFloat(px, p.y-18, `-${Math.round(b.dmg || DIFF.haz*0.6)}`, '#ff5252');
          spawnP(px, py, 14, '#e040fb', 320, 0.5, 300);
          shake = Math.max(shake, 4);
          if (p.hp <= 0) { p.hp = 0; killP(p, '无人机'); }
        }
        b.life = 0; break;
      }
    }
  }
  enemyBullets = enemyBullets.filter(b => b.life > 0);
}

function hitBullet(b, t) {
  // 连击计数
  addCombo(b.owner);
  if (t.heavy > 0) {
    const dmg = b.dmg * 0.35;
    t.hp -= dmg;
    t.vx += (b.vx > 0 ? 1 : -1) * BKB * 0.15;
    addFloat(t.x+t.w/2, t.y-18, `-${Math.round(dmg)}`, '#a78bfa');
  } else if (t.shield) { t.shield = false; t.invuln = 0.9; spawnP(t.x+t.w/2, t.y+t.h/2, 26, '#ffd54f', 320, 0.7, 300); return; }
  else {
    t.hp -= b.dmg;
    const kb = (b.vx > 0 ? BKB : -BKB) * (t.mul.kb || 1);
    t.vx = kb; t.vy = -240;
    t.invuln = 0.28;
    t.dashing = 0; t.charging = false; t.chargeTime = 0; t.canDJ = true;
    t.hits++; t.levelHits++;
    addFloat(t.x+t.w/2, t.y-18, `-${Math.round(b.dmg)}`, '#ff5252');
  }
  spawnP(b.x, b.y, 20, b.color, 380, 0.5, 400);
  freeze = 0.05; shake = Math.max(shake, 5);
  if (t.hp <= 0) { t.hp = 0; killP(t, '击杀', b.owner); }
}

function addCombo(p) {
  if (!p) return;
  p.hitCount = (p.hitCount || 0) + 1;
  const now = levelTime;
  if (now - (p.comboTimer || -99) < 1.5) p.combo = (p.combo || 0) + 1;
  else p.combo = 1;
  p.comboTimer = now;
  if (p.combo >= 3) {
    S.combo(p.combo);
    if (p.combo >= 10) Achievements.unlock('combo10');
  }
}

function updateMonsters(dt) {
  if (Net.role === 'client' && Net.active) return;
  for (const m of monsters) {
    m.atkCd -= dt;
    let target = null, bd = Infinity;
    for (const p of players) {
      if (!p.alive || p.finished) continue;
      const d = Math.hypot(p.x-m.x, p.y-m.y);
      if (d < 600 && d < bd) { bd = d; target = p; }
    }
    if (target) {
      const dir = Math.sign(target.x - m.x);
      m.facing = dir;
      if (bd > 40) m.x += dir * m.speed * dt;
      else if (m.atkCd <= 0) { m.atkCd = 0.9; if (!target.invuln) hitP(target, m.x, m.y, '怪物'); }
    }
    m.vy += GRAV * dt;
    m.y += m.vy * dt;
    if (m.y > 1000) { m.y = 1000; m.vy = 0; }
  }
  if (gameMode === 'horde' && monsters.length < 8 && Math.random() < 0.7) spawnMonster();
}

function updatePlats(dt) {
  for (const p of level.plats) {
    const ox = p.x, oy = p.y;
    if (p.move) {
      p.phase += p.move.speed * dt;
      const off = Math.sin(p.phase) * p.move.range;
      if (p.move.axis === 'x') p.x = p.baseX + off; else p.y = p.baseY + off;
    }
    p.dx = p.x - ox; p.dy = p.y - oy;
    if (p.type === 'crumble') {
      if (!p.active) { p.resp -= dt; if (p.resp <= 0) { p.active = true; p.crumble = 0; } }
      else if (p.crumble > 0) {
        p.crumble -= dt;
        if (p.crumble <= 0) {
          p.active = false; p.resp = CRUMBLE_RESPAWN; p.crumble = 0;
          spawnP(p.x+p.w/2, p.y+p.h/2, 16, '#ff8a65', 220, 0.7);
        }
      }
    }
  }
}

function updateHaz(dt) {
  for (const h of level.haz) {
    if (h.type === 'saw') {
      h.phase += h.speed * DIFF.saw * dt;
      h.angle += dt * 14;
      if (h.axis === 'x') h.x = h.baseX + Math.sin(h.phase)*h.range;
      else if (h.axis === 'y') h.y = h.baseY + Math.sin(h.phase)*h.range;
    } else if (h.type === 'laser') {
      h.timer += dt;
      const totalCycle = LASER_ON + LASER_OFF + LASER_WARN;
      const t = (h.timer / (totalCycle / DIFF.saw)) % 1;
      const warnEnd = LASER_WARN / totalCycle;
      const onEnd = (LASER_WARN + LASER_ON) / totalCycle;
      if (t < warnEnd) h.state = 'warn';
      else if (t < onEnd) h.state = 'on';
      else h.state = 'off';
    } else if (h.type === 'missile' && Net.role !== 'client') {
      h.timer += dt;
      if (h.timer >= h.cd / DIFF.saw) {
        h.timer = 0;
        let target = null, bd = Infinity;
        for (const p of players) {
          if (!p.alive || p.finished) continue;
          const d = Math.hypot(p.x - h.x, p.y - h.y);
          if (d < bd) { bd = d; target = p; }
        }
        if (target && bd < 1400) {
          missiles.push({ x:h.x, y:h.y, vx:0, vy:0, speed:MISSILE_SPD * (0.9 + Math.random()*0.2), target, life:MISSILE_LIFE, angle:0, trailTimer:0 });
          spawnP(h.x, h.y, 12, '#ff5722', 240, 0.5, 100);
        }
      }
    } else if (h.type === 'drone' && Net.role !== 'client') {
      h.droneX = h.x + Math.sin(h.timer*0.8 + h.phase) * h.range;
      h.droneY = h.y + Math.sin(h.timer*0.5 + h.phase*1.7) * 60;
      h.timer += dt;
      h.droneAngle += dt*3;
      h.cd -= dt;
      if (h.cd <= 0) {
        let target = null, bd = Infinity;
        for (const p of players) {
          if (!p.alive || p.finished) continue;
          const d = Math.hypot(p.x - h.droneX, p.y - h.droneY);
          if (d < DRONE_DETECT && d < bd) { bd = d; target = p; }
        }
        if (target) {
          h.cd = DRONE_CD / DIFF.saw;
          const ang = Math.atan2(target.y - h.droneY, target.x - h.droneX);
          enemyBullets.push({ x:h.droneX, y:h.droneY, vx:Math.cos(ang) * DRONE_BSPD, vy:Math.sin(ang) * DRONE_BSPD, r:8, dmg:DIFF.haz*0.6, life:2.5, maxLife:2.5 });
        }
      }
    } else if (h.type === 'boulder' && Net.role !== 'client') {
      // 滚石：受重力下落
      if (h.vy === undefined) h.vy = 0;
      h.vy += 400 * dt;
      h.y += h.vy * dt;
      // 落地反弹消失
      if (h.y > 1200) {
        h.y = -100 - Math.random()*200;
        h.vy = 0;
        h.x = 800 + Math.random()*3400;
      }
    }
  }
  if (Net.role !== 'client') {
    for (const m of missiles) {
      m.life -= dt;
      if (!m.target || !m.target.alive || m.target.finished) {
        m.target = null;
        for (const p of players) { if (p.alive && !p.finished) { m.target = p; break; } }
      }
      if (m.target) {
        const desired = Math.atan2(m.target.y - m.y, m.target.x - m.x);
        let diff = desired - m.angle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        m.angle += clamp(diff, -MISSILE_TURN*dt, MISSILE_TURN*dt);
      }
      m.vx = Math.cos(m.angle) * m.speed;
      m.vy = Math.sin(m.angle) * m.speed;
      m.x += m.vx*dt; m.y += m.vy*dt;
      m.trailTimer -= dt;
      if (m.trailTimer <= 0) {
        m.trailTimer = 0.02;
        particles.push({ x:m.x, y:m.y, vx:rand(-30, 30), vy:rand(-30, 30), life:0.35, maxLife:0.35, color: Math.random() < 0.5 ? '#ff9800' : '#ff5722', size:4, gravity:-200 });
      }
    }
    missiles = missiles.filter(m => m.life > 0);
  }
}

function updateItems(dt) {
  if (Net.role === 'client' && Net.active) return;
  for (const it of level.items) if (it.taken) { it.resp -= dt; if (it.resp <= 0) it.taken = false; }
}

function checkItem(p) {
  if (Net.role === 'client' && Net.active && p.id !== Net.myId) return;
  for (const it of level.items) {
    if (it.taken) continue;
    const cx = p.x+p.w/2, cy = p.y+p.h/2;
    if (Math.hypot(cx-it.x, cy-it.y) < 38) {
      it.taken = true; it.resp = ITEM_DEFS[it.type].resp;
      if (it.type === 'shield') { p.shield = true; addFloat(p.x+p.w/2, p.y-20, '护盾!', '#ffd54f'); }
      else if (it.type === 'heavy') { p.heavy = ITEM_DEFS.heavy.dur; addFloat(p.x+p.w/2, p.y-20, '重物 9s', '#a78bfa'); }
      else if (it.type === 'speed') { p.speedBoost = ITEM_DEFS.speed.dur; addFloat(p.x+p.w/2, p.y-20, '加速 9s', '#22d3ee'); }
      p.score += 5;
      S.coin();
      spawnP(it.x, it.y, 26, it.color, 340, 0.7, 300);
    }
  }
  if (gameMode === 'collect' && modeState.coins) {
    for (const c of modeState.coins) {
      if (c.taken) continue;
      const cx = p.x+p.w/2, cy = p.y+p.h/2;
      if (Math.hypot(cx-c.x, cy-c.y) < 38) {
        c.taken = true; c.resp = 5;
        p.coins = (p.coins || 0) + 1;
        p.score += 20;
        S.score();
        spawnP(c.x, c.y, 24, '#ffd54f', 340, 0.6, 200);
        addFloat(p.x+p.w/2, p.y-30, `+1 金币 (${p.coins})`, '#ffd54f');
        if (p.coins >= 50) Achievements.unlock('collector');
        if (p.coins >= modeState.targetCoins) { state = 'gameover'; modeState.winner = p.id; }
      }
    }
  }
}

function updateModeLogic(dt) {
  if (state !== 'playing') return;
  if (Net.role === 'client' && Net.active) return;
  if (gameMode === 'koth' && modeState.zone) {
    const z = modeState.zone;
    for (const p of players) {
      if (!p.alive) continue;
      const cx = p.x+p.w/2, cy = p.y+p.h/2;
      if (Math.hypot(cx-z.x, cy-z.y) < z.r) {
        p.kothTime = (p.kothTime || 0) + dt;
        p.score += dt*5;
        if (p.kothTime >= modeState.targetScore) { state = 'gameover'; modeState.winner = p.id; }
      }
    }
  }
  if (gameMode === 'dm') {
    for (const p of players) if ((p.kills || 0) >= modeState.targetKills) { state = 'gameover'; modeState.winner = p.id; }
  }
  if (gameMode === 'collect' && modeState.coins) {
    for (const c of modeState.coins) {
      if (c.taken) {
        c.resp -= dt;
        if (c.resp <= 0) { c.taken = false; c.x = 300 + Math.random()*(WW-600); c.y = 500 + Math.random()*400; }
      }
    }
  }
  if (gameMode === 'ctf' && modeState.flags) {
    for (const p of players) {
      if (!p.alive || !p.hasFlag) continue;
      const homeFlag = modeState.flags.find(f => f.team === p.team);
      if (Math.hypot(p.x - homeFlag.baseX, p.y - homeFlag.baseY) < 60) {
        p.score++; p.hasFlag = false;
        const f = modeState.flags.find(f => f.team !== p.team);
        f.carrier = null; f.x = f.baseX; f.y = f.baseY;
        addFloat(p.x+p.w/2, p.y-40, '得旗! +1', '#ffd54f');
        S.victory();
        spawnP(p.x+p.w/2, p.y+p.h/2, 40, '#ffd54f', 400, 0.9, 300);
        shake = Math.max(shake, 12);
        if (p.score >= modeState.targetScore) { state = 'gameover'; modeState.winner = p.id; }
      }
    }
  }
  if (gameMode === 'survive') {
    if (levelTime > 180) Achievements.unlock('survivor');
    const alive = players.filter(p => p.alive).length;
    if (alive <= 1) {
      state = 'gameover';
      const w = players.find(p => p.alive);
      modeState.winner = w ? w.id : -1;
    }
  }
}

function updateParticles(dt) {
  for (const pt of particles) { pt.vy += pt.gravity*dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of floats) { t.y += t.vy*dt; t.vy *= 0.93; t.life -= dt; }
  floats = floats.filter(t => t.life > 0);
  for (const k of killFeed) k.life -= dt;
  killFeed = killFeed.filter(k => k.life > 0);
  for (const s of streakPopups) {
    s.life -= dt; s.y += s.vy*dt; s.vy *= 0.96;
    const t = 1 - s.life/s.maxLife;
    if (t < 0.3) s.scale = 0.3 + (t/0.3)*1.2;
    else if (t < 0.5) s.scale = 1.5 - ((t-0.3)/0.2)*0.5;
    else s.scale = 1.0;
  }
  streakPopups = streakPopups.filter(s => s.life > 0);
  for (const b of screenBanners) b.life -= dt;
  screenBanners = screenBanners.filter(b => b.life > 0);
}

function updateCamera(dt) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  let count = 0;
  for (const p of players) {
    let px = p.x, py = p.y;
    if (!p.alive && p.respT > 0.4) { px = p.spawn.x; py = p.spawn.y; }
    minX = Math.min(minX, px); maxX = Math.max(maxX, px + p.w);
    minY = Math.min(minY, py); maxY = Math.max(maxY, py + p.h);
    count++;
  }
  if (count === 0) {
    camera.x = WW/2; camera.y = WH/2;
    currentScale = BASE_VIEW_SCALE;
    viewW = VW / currentScale; viewH = VH / currentScale;
    return;
  }
  const targetX = (minX + maxX) / 2;
  const targetY = (minY + maxY) / 2;
  const padX = 200, padY = 220;
  const bbW = Math.max(500, (maxX - minX) + padX * 2);
  const bbH = Math.max(400, (maxY - minY) + padY * 2);
  const scaleX = VW / bbW, scaleY = VH / bbH;
  const targetScale = Math.max(MIN_VIEW_SCALE, Math.min(scaleX, scaleY, BASE_VIEW_SCALE));
  currentScale += (targetScale - currentScale) * Math.min(1, dt * 3.5);
  viewW = VW / currentScale; viewH = VH / currentScale;
  const k = Math.min(1, dt * 5);
  camera.x += (targetX - camera.x) * k;
  camera.y += (targetY - camera.y) * k;
  const halfW = viewW / 2, halfH = viewH / 2;
  if (viewW >= WW) camera.x = WW/2; else camera.x = clamp(camera.x, halfW, WW - halfW);
  if (viewH >= WH) camera.y = WH/2; else camera.y = clamp(camera.y, halfH, WH - halfH);
}

function update(dt) {
  if (paused) return;
  if (shake > 0) shake = Math.max(0, shake - dt*22);
  if (freeze > 0) { freeze -= dt; dt *= 0.3; }

  if (state === 'playing') {
    levelTime += dt;

    if (Net.role === 'client' && Net.active) applyInterpolatedState();

    updatePlats(dt);
    updateHaz(dt);
    updatePlayers(dt);
    updateBullets(dt);
    updateMonsters(dt);
    updateItems(dt);
    updateModeLogic(dt);
    updateParticles(dt);
    updateCamera(dt);

    if (Net.active) {
      if (Net.role === 'host') {
        for (const pid in Net.remIn) {
          const p = players.find(x => x.id === +pid);
          if (p) p._netIn = Net.remIn[pid];
        }
        Net.bcast();
      } else if (Net.role === 'client') {
        const my = players.find(x => x.id === Net.myId);
        if (my) {
          const m = KEYMAP[my.id];
          Net.sendIn({
            left: m.left.some(k => keys[k]) || (my.id === 0 && touchEnabled && touchKeys.left),
            right: m.right.some(k => keys[k]) || (my.id === 0 && touchEnabled && touchKeys.right),
            jumpP: m.jump.some(k => pressed[k]) || (my.id === 0 && touchEnabled && touchPressed.jump),
            jumpHeld: m.jump.some(k => keys[k]) || (my.id === 0 && touchEnabled && touchKeys.jump),
            dashP: m.dash.some(k => pressed[k]) || (my.id === 0 && touchEnabled && touchPressed.dash),
            attackP: m.attack.some(k => pressed[k]) || (my.id === 0 && touchEnabled && touchPressed.attack),
            skillP: m.skill ? m.skill.some(k => pressed[k]) : false,
            myX: my.x, myY: my.y, myFacing: my.facing,
            myHp: my.hp, myAlive: my.alive, myDashing: my.dashing,
            myCharging: my.charging, myChargeTime: my.chargeTime,
            myShield: my.shield, myHeavy: my.heavy > 0, mySpeed: my.speedBoost > 0,
            myFinished: my.finished, myFinishOrder: my.finishOrder, myFinishTime: my.finishTime
          });
        }
      }
    }

    if (Net.role === 'host' && Net.active && gameMode === 'race' && state === 'playing' && level && level.goal) {
      let allAtGoal = players.length > 0;
      for (const p of players) {
        if (!p.finished && !rect(p, level.goal)) { allAtGoal = false; break; }
      }
      if (allAtGoal) {
        for (const p of players) {
          if (!p.finished) {
            p.finished = true; finishCount++;
            p.finishOrder = finishCount; p.finishTime = levelTime;
            spawnP(p.x + p.w/2, p.y + p.h/2, 36, '#ffd54f', 360, 1.1, 400);
          }
        }
        shake = Math.max(shake, 6);
      }
    }

    if (Net.role !== 'client' && gameMode === 'race' && players.length > 0 && players.every(p => p.finished)) {
      state = 'levelend'; transT = 2.4; S.clear();
      const mvp = calculateMVP();
      if (mvp) {
        mvpState = {
          active:true, timer:0, duration:2.4, player:mvp,
          title:'MVP', subTitle:`第 ${li+1} 关 · 最有价值玩家`,
          stats: [
            { label:'击杀', value:mvp.kills || 0, color:'#ff8a65' },
            { label:'得分', value:mvp.score || 0, color:'#ffd54f' },
            { label:'用时', value:mvp.finished ? mvp.finishTime.toFixed(1) + 's' : '--', color:'#4fc3f7' },
            { label:'掉落', value:mvp.fell || 0, color:'#ff5252' }
          ],
          playedSounds:{}
        };
      }
    }
  } else if (state === 'levelend') {
    updateParticles(dt); updateBullets(dt); updateHaz(dt); updateCamera(dt);
    if (!(Net.role === 'client' && Net.active)) {
      transT -= dt;
      if (transT <= 0) {
        li++;
        if (li >= totalLv) {
          state = 'gameover';
          Save.clearProgress();
          BGM.play('victory'); S.victory();
          Achievements.stats.wins++;
          if (diffKey === 'inferno') Achievements.unlock('infernoWin');
          Achievements.unlock('firstWin');
          if (totalTime < (Achievements.stats.bestTime || Infinity)) Achievements.stats.bestTime = totalTime;
          Achievements.save();
          const mvp = calculateMVP();
          if (mvp) {
            mvpState = {
              active:true, timer:0, duration:5.0, player:mvp,
              title:'总 MVP', subTitle:'全场最有价值玩家',
              stats: [
                { label:'总分', value:mvp.score || 0, color:'#ffd54f' },
                { label:'总击杀', value:mvp.kills || 0, color:'#ff8a65' },
                { label:'掉落', value:mvp.fell || 0, color:'#ff5252' },
                { label:'死亡', value:mvp.deaths || 0, color:'#4fc3f7' }
              ],
              playedSounds:{}
            };
          }
        } else {
          loadLevel(li);
          state = 'playing';
          saveProgress();
        }
      }
    }
  } else if (state === 'gameover') {
    updateParticles(dt);
    if (mvpState.active) {
      mvpState.timer += dt;
      if (mvpState.timer > mvpState.duration) mvpState.active = false;
    }
  }
  for (const k in pressed) delete pressed[k];
  for (const k in touchPressed) delete touchPressed[k];
}

function calculateMVP() {
  const r = [...players].map(p => {
    const ks = (p.kills || 0)*100;
    const fs = p.finished ? Math.max(0, 300 - p.finishTime*5) : 0;
    const dp = (p.deaths || 0)*30 + (p.fell || 0)*20;
    p._mvp = (p.score || 0) + ks + fs - dp;
    return p;
  });
  r.sort((a, b) => b._mvp - a._mvp);
  return r[0];
}

/* ═══ 渲染 ═══ */
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  const bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#0b1120'); bg.addColorStop(1, '#04070d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  if (state === 'menu') return;

  const shakeX = (Math.random() - 0.5) * shake;
  const shakeY = (Math.random() - 0.5) * shake;
  const sx = VW/2 - camera.x * currentScale + shakeX;
  const sy = VH/2 - camera.y * currentScale + shakeY;

  ctx.save();
  ctx.setTransform(currentScale, 0, 0, currentScale, sx, sy);
  const cx0 = camera.x - viewW/2 - 200;
  const cy0 = camera.y - viewH/2 - 200;
  ctx.beginPath();
  ctx.rect(cx0, cy0, viewW + 400, viewH + 400);
  ctx.clip();
  drawWorld();
  ctx.restore();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();

  if (state === 'levelend') drawLevelEnd();
  if (state === 'gameover') drawGameOver();
  if (mvpState.active) drawMVP(dt);
}

function drawWorld() {
  if (!level) return;
  const camMinX = camera.x - viewW/2 - 250;
  const camMaxX = camera.x + viewW/2 + 250;

  const g = ctx.createLinearGradient(0, 0, 0, WH);
  g.addColorStop(0, '#101a2c'); g.addColorStop(0.6, '#0a1120'); g.addColorStop(1, '#05080f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, WW, WH);

  ctx.save();
  for (let i = 0; i < 300; i++) {
    const sxs = (i * 197) % WW;
    const sys = ((i * 331) % 1000) + 40;
    if (sxs < camMinX || sxs > camMaxX) continue;
    const tw = 0.6 + 0.4 * Math.sin(performance.now()/900 + i);
    ctx.fillStyle = `rgba(160,200,255,${0.08 + tw*0.16})`;
    ctx.fillRect(sxs, sys, 2, 2);
  }
  ctx.restore();

  ctx.save();
  const abyss = ctx.createLinearGradient(0, 1250, 0, WH);
  abyss.addColorStop(0, 'rgba(120,20,40,0)');
  abyss.addColorStop(1, 'rgba(180,30,60,0.55)');
  ctx.fillStyle = abyss; ctx.fillRect(0, 1250, WW, WH-1250);
  ctx.restore();

  if (gameMode === 'koth' && modeState.zone) {
    const z = modeState.zone;
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/500*3);
    ctx.save();
    ctx.globalAlpha = 0.15 + pulse*0.15;
    ctx.fillStyle = '#a78bfa';
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.6; ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.stroke();
    ctx.font = 'bold 32px system-ui';
    ctx.fillStyle = '#d4b9ff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('占 点 区', z.x, z.y-10);
    ctx.restore();
  }

  for (const plat of level.plats) {
    if (plat.x + plat.w < camMinX || plat.x > camMaxX) continue;
    drawPlatform(plat);
  }

  for (const h of level.haz) {
    if (h.x < camMinX - 200 || h.x > camMaxX + 200) continue;
    if (h.type === 'spike') drawSpike(h);
    else if (h.type === 'saw') drawSaw(h);
    else if (h.type === 'laser') drawLaser(h);
    else if (h.type === 'missile') drawMissileLauncher(h);
    else if (h.type === 'drone') drawDrone(h);
    else if (h.type === 'boulder') drawBoulder(h);
  }

  if (gameMode === 'collect' && modeState.coins) {
    for (const c of modeState.coins) {
      if (c.taken || c.x < camMinX || c.x > camMaxX) continue;
      const bob = Math.sin(performance.now()/300 + c.bob)*5;
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffb300';
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
      ctx.font = 'bold 14px system-ui';
      ctx.fillStyle = '#fff8e1';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 0);
      ctx.restore();
    }
  }

  if (gameMode === 'ctf' && modeState.flags) {
    for (const f of modeState.flags) {
      if (f.carrier) continue;
      ctx.save();
      ctx.shadowColor = f.team === 0 ? '#4fc3f7' : '#ff8a65';
      ctx.shadowBlur = 20;
      ctx.fillStyle = f.team === 0 ? '#4fc3f7' : '#ff8a65';
      ctx.fillRect(f.x-3, f.y-40, 6, 50);
      ctx.beginPath();
      ctx.moveTo(f.x+3, f.y-40);
      ctx.lineTo(f.x+35, f.y-25);
      ctx.lineTo(f.x+3, f.y-10);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  for (const item of level.items) {
    if (item.x < camMinX || item.x > camMaxX) continue;
    drawItem(item);
  }

  drawGoal();

  for (const m of missiles) drawMissile(m);
  for (const b of bullets) drawBullet(b, b.color);
  for (const b of enemyBullets) drawBullet(b, '#e040fb');

  for (const pt of particles) {
    if (pt.x < camMinX || pt.x > camMaxX) continue;
    const a = clamp(pt.life/pt.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size*a, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const m of monsters) drawMonster(m);
  for (const p of players) drawPlayer(p);

  for (const s of streakPopups) {
    const a = Math.min(1, s.life/0.4);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(s.x, s.y); ctx.scale(s.scale, s.scale);
    ctx.font = s.big ? 'bold 26px system-ui' : 'bold 20px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(s.text, 0, 0);
    ctx.fillStyle = s.color;
    ctx.fillText(s.text, 0, 0);
    ctx.restore();
  }

  for (const t of floats) {
    if (t.x < camMinX || t.x > camMaxX) continue;
    const a = clamp(t.life/t.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    if (t.ping) {
      const pulse = 0.5 + 0.5*Math.sin(performance.now()/100);
      ctx.font = 'bold 40px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.shadowColor = t.color; ctx.shadowBlur = 20 * pulse;
      ctx.fillText(t.text, t.x, t.y);
    } else if (t.emoji) {
      ctx.font = 'bold 36px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.text, t.x, t.y);
    } else {
      ctx.font = 'bold 17px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.restore();
  }
}

function drawBoulder(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.arc(3, 5, h.r, 0, Math.PI*2);
  ctx.fill();
  // 主体
  const g = ctx.createRadialGradient(-h.r*0.3, -h.r*0.3, 2, 0, 0, h.r);
  g.addColorStop(0, '#a1887f');
  g.addColorStop(0.7, '#5d4037');
  g.addColorStop(1, '#2d1f18');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, h.r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#1a0f0a';
  ctx.lineWidth = 2;
  ctx.stroke();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.arc(-h.r*0.35, -h.r*0.4, h.r*0.25, 0, Math.PI*2);
  ctx.fill();
  // 裂缝
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-h.r*0.5, -h.r*0.2);
  ctx.lineTo(-h.r*0.1, 0);
  ctx.lineTo(h.r*0.2, -h.r*0.3);
  ctx.moveTo(-h.r*0.2, h.r*0.5);
  ctx.lineTo(h.r*0.1, h.r*0.2);
  ctx.lineTo(h.r*0.4, h.r*0.5);
  ctx.stroke();
  // 危险光晕
  ctx.save();
  ctx.globalAlpha = 0.4 + 0.3*Math.sin(performance.now()/200);
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, h.r + 4, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawBullet(b, color) {
  ctx.save();
  ctx.globalAlpha = 0.85 + 0.15*Math.sin(performance.now()/40);
  ctx.shadowColor = color; ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawMissile(m) {
  ctx.save();
  ctx.translate(m.x, m.y); ctx.rotate(m.angle);
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.4*Math.random();
  ctx.fillStyle = '#ff9800';
  ctx.beginPath(); ctx.ellipse(-16, 0, 12, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath(); ctx.ellipse(-10, 0, 7, 3.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#e0e0e0'; ctx.strokeStyle = '#424242'; ctx.lineWidth = 2;
  rr(ctx, -14, -5, 26, 10, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(20, 0); ctx.lineTo(12, 5); ctx.closePath();
  ctx.fillStyle = '#ff5722'; ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawLaser(h) {
  if (h.state === 'off') {
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    if (h.axis === 'v') { ctx.moveTo(h.x, h.y); ctx.lineTo(h.x, h.y + h.h); }
    else { ctx.moveTo(h.x, h.y); ctx.lineTo(h.x + h.w, h.y); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore(); return;
  }
  if (h.state === 'warn') {
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/60);
    ctx.save();
    ctx.globalAlpha = 0.3 + pulse*0.3;
    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (h.axis === 'v') { ctx.moveTo(h.x, h.y); ctx.lineTo(h.x, h.y + h.h); }
    else { ctx.moveTo(h.x, h.y); ctx.lineTo(h.x + h.w, h.y); }
    ctx.stroke();
    ctx.restore(); return;
  }
  const pulse = 0.85 + 0.15*Math.sin(performance.now()/30);
  ctx.save();
  ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 30;
  ctx.fillStyle = `rgba(255,23,68,${pulse})`;
  if (h.axis === 'v') {
    ctx.fillRect(h.x - h.w/2, h.y, h.w, h.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.fillRect(h.x - h.w/4, h.y, h.w/2, h.h);
  } else {
    ctx.fillRect(h.x, h.y - h.h/2, h.w, h.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.fillRect(h.x, h.y - h.h/4, h.w, h.h/2);
  }
  ctx.restore();
}

function drawMissileLauncher(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.fillStyle = '#424242';
  rr(ctx, -20, -16, 40, 32, 6); ctx.fill();
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#212121'; ctx.fillRect(-6, -22, 12, 12);
  const blink = Math.sin(performance.now()/200) > 0 ? 1 : 0.3;
  ctx.fillStyle = `rgba(255,82,82,${blink})`;
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawDrone(h) {
  ctx.save();
  ctx.translate(h.droneX, h.droneY);
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.2*Math.sin(performance.now()/150);
  ctx.shadowColor = '#e040fb'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#e040fb';
  ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.rotate(Math.sin(performance.now()/400)*0.2);
  ctx.fillStyle = '#2c1a3d';
  rr(ctx, -16, -12, 32, 24, 8); ctx.fill();
  ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 2; ctx.stroke();
  const blink = Math.sin(performance.now()/500) > -0.9 ? 1 : 0.2;
  ctx.fillStyle = `rgba(255,82,82,${blink})`;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(224,64,251,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-14, -10, 8, 3, h.droneAngle, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(14, -10, 8, 3, -h.droneAngle, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawMonster(m) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(m.x + m.w/2, m.y + m.h + 3, m.w*0.5, 4, 0, 0, Math.PI*2); ctx.fill();
  const g = ctx.createRadialGradient(m.x + m.w/2 - 5, m.y + m.h/2 - 5, 2, m.x + m.w/2, m.y + m.h/2, m.w);
  g.addColorStop(0, '#ff8a80'); g.addColorStop(1, '#8b1e1e');
  ctx.fillStyle = g;
  rr(ctx, m.x, m.y, m.w, m.h, 6); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(m.x + m.w/2 - 5, m.y + m.h/2 - 3, 3, 0, Math.PI*2);
  ctx.arc(m.x + m.w/2 + 5, m.y + m.h/2 - 3, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(m.x + m.w/2 - 5 + (m.facing || 0), m.y + m.h/2 - 3, 1.5, 0, Math.PI*2);
  ctx.arc(m.x + m.w/2 + 5 + (m.facing || 0), m.y + m.h/2 - 3, 1.5, 0, Math.PI*2);
  ctx.fill();
  const bw = 30;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(m.x + m.w/2 - bw/2 - 1, m.y - 8, bw + 2, 5);
  ctx.fillStyle = '#ff5252';
  ctx.fillRect(m.x + m.w/2 - bw/2, m.y - 7, bw*(m.hp/m.maxHp), 3);
  ctx.restore();
}

function drawPlatform(plat) {
  const { x, y, w, h, type } = plat;
  if (!plat.active) {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#ff8a65'; ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    const t = 1 - plat.resp / CRUMBLE_RESPAWN;
    ctx.globalAlpha = 0.3 + t*0.3;
    ctx.fillStyle = '#ff8a65';
    ctx.fillRect(x, y + h - 3, w*t, 3);
    ctx.restore(); return;
  }
  let c1, c2;
  switch (type) {
    case 'ice': c1 = '#8fd6ff'; c2 = '#2b6fa8'; break;
    case 'spring': c1 = '#7ee08a'; c2 = '#25793a'; break;
    case 'crumble': {
      const t = plat.crumble > 0 ? plat.crumble / DIFF.crumb : 0;
      c1 = `rgb(${255 - t*60}, ${190 - t*110}, ${80 - t*50})`;
      c2 = `rgb(${170 - t*50}, ${95 - t*65}, ${30 - t*20})`;
      break;
    }
    default:
      if (plat.move) { c1 = '#c99aff'; c2 = '#5c2b9c'; }
      else { c1 = '#5f83aa'; c2 = '#25344a'; }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  rr(ctx, x + 3, y + 5, w, h, Math.min(8, h/2)); ctx.fill();
  rr(ctx, x, y, w, h, Math.min(8, h/2));
  const grd = ctx.createLinearGradient(0, y, 0, y + h);
  grd.addColorStop(0, c1); grd.addColorStop(1, c2);
  ctx.fillStyle = grd; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.fillRect(x + 2, y + 1, Math.max(0, w - 4), 2);
  if (type === 'ice') {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    for (let i = 0; i < w; i += 40) {
      ctx.beginPath();
      ctx.moveTo(x + i + 6, y + 5);
      ctx.lineTo(x + i + 14, y + h - 5);
      ctx.stroke();
    }
    ctx.restore();
  } else if (type === 'spring') {
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    const coils = Math.max(2, Math.floor(w/34));
    for (let i = 0; i < coils; i++) {
      const sxp = x + 10 + i * (w - 20) / (coils - 1 || 1);
      ctx.beginPath();
      ctx.moveTo(sxp - 7, y - 1);
      ctx.lineTo(sxp, y - 11);
      ctx.lineTo(sxp + 7, y - 1);
      ctx.stroke();
    }
    ctx.restore();
  } else if (type === 'crumble') {
    ctx.save();
    ctx.strokeStyle = 'rgba(60,20,0,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const cxp = x + 12 + i * (w - 24) / 3;
      ctx.moveTo(cxp, y + 3);
      ctx.lineTo(cxp + 5, y + h - 3);
    }
    ctx.stroke();
    ctx.restore();
  } else if (plat.move) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    const cxp = x + w/2, cyp = y + h/2;
    ctx.translate(cxp, cyp);
    if (plat.move.axis === 'y') ctx.rotate(Math.PI/2);
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-6, -5); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, -5); ctx.lineTo(6, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawSpike(h) {
  const H = 24;
  const count = Math.max(2, Math.floor(h.w/17));
  const sw = h.w/count;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let i = 0; i < count; i++) {
    const x0 = h.x + i*sw;
    ctx.beginPath();
    ctx.moveTo(x0 + 2, h.y + H + 3);
    ctx.lineTo(x0 + sw/2 + 2, h.y + 3);
    ctx.lineTo(x0 + sw + 2, h.y + H + 3);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  for (let i = 0; i < count; i++) {
    const x0 = h.x + i*sw;
    ctx.beginPath();
    ctx.moveTo(x0, h.y + H);
    ctx.lineTo(x0 + sw/2, h.y);
    ctx.lineTo(x0 + sw, h.y + H);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, h.y, 0, h.y + H);
    g.addColorStop(0, '#ff8a80'); g.addColorStop(1, '#8b1e1e');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawSaw(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(3, 5, h.r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.rotate(h.angle);
  const teeth = 12;
  ctx.beginPath();
  for (let i = 0; i < teeth*2; i++) {
    const a = i * Math.PI / teeth;
    const r = i%2 === 0 ? h.r : h.r*0.72;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, h.r);
  g.addColorStop(0, '#f0f0f0'); g.addColorStop(0.7, '#a0a0a0'); g.addColorStop(1, '#606060');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#282828'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, h.r*0.3, 0, Math.PI*2);
  ctx.fillStyle = '#ff5252'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.restore();
}

function drawItem(item) {
  if (item.taken) return;
  const t = performance.now()/1000;
  const bob = Math.sin(t*3 + item.phase)*6;
  ctx.save();
  ctx.translate(item.x, item.y + bob);
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.2*Math.sin(t*4 + item.phase);
  ctx.shadowColor = item.color; ctx.shadowBlur = 26;
  ctx.fillStyle = item.color;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.beginPath();
  if (item.type === 'shield') {
    for (let i = 0; i < 6; i++) {
      const a = i*Math.PI/3 - Math.PI/2;
      const px = Math.cos(a)*15, py = Math.sin(a)*15;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  } else if (item.type === 'heavy') rr(ctx, -14, -14, 28, 28, 6);
  else {
    ctx.moveTo(3, -16); ctx.lineTo(-9, 2); ctx.lineTo(-1, 2);
    ctx.lineTo(-4, 16); ctx.lineTo(9, -3); ctx.lineTo(1, -3); ctx.closePath();
  }
  const g = ctx.createLinearGradient(0, -16, 0, 16);
  g.addColorStop(0, '#fff'); g.addColorStop(1, item.color);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawGoal() {
  if (!level.goal) return;
  const goal = level.goal;
  const pulse = 0.5 + 0.5*Math.sin(performance.now()/260);
  ctx.save();
  ctx.shadowColor = '#ffd54f'; ctx.shadowBlur = 26 + pulse*28;
  rr(ctx, goal.x, goal.y, goal.w, goal.h, 14);
  ctx.fillStyle = `rgba(255,213,79,${0.13 + pulse*0.15})`; ctx.fill();
  ctx.strokeStyle = `rgba(255,213,79,${0.72 + pulse*0.28})`; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.restore();
  const cx = goal.x + goal.w/2, cy = goal.y + goal.h/2;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i*Math.PI/5;
    const r = i%2 === 0 ? 26 : 12;
    const px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText('终 点', cx, goal.y - 18);
  ctx.fillStyle = '#ffe082';
  ctx.fillText('终 点', cx, goal.y - 18);
  ctx.restore();
}

function drawPlayer(p) {
  if (!p.alive) return;
  ctx.save();
  if (p.finished) ctx.globalAlpha = 0.42;
  if (p.invuln > 0) ctx.globalAlpha *= 0.55 + 0.45*Math.sin(performance.now()/50);

  // 技能激活特效
  if (p.skillActive > 0) {
    ctx.save();
    const col = p.character === 'robot' ? '#ff5252' : (p.character === 'alien' ? '#81c784' : '#d8b4fe');
    ctx.globalAlpha = 0.6 + 0.3*Math.sin(performance.now()/80);
    ctx.shadowColor = col; ctx.shadowBlur = 30;
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w * 1.3, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  if (p.charging) {
    const ratio = p.chargeTime / CHARGE_TIME;
    ctx.save();
    ctx.globalAlpha = 0.3 + ratio*0.5;
    ctx.shadowColor = ratio > 0.85 ? '#ffd54f' : p.color;
    ctx.shadowBlur = 18 + ratio*30;
    ctx.strokeStyle = ratio > 0.85 ? '#ffd54f' : p.color;
    ctx.lineWidth = 2.5 + ratio*3;
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w*(0.9 + ratio*0.7), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  if (p.dashing > 0) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = p.color;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(p.x + p.w/2 - p.facing*i*14, p.y + p.h/2, p.w*0.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  const glowPulse = 0.5 + 0.5*Math.sin(performance.now()/220);
  ctx.save();
  ctx.globalAlpha = 0.28 + glowPulse*0.22;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 28;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w*0.85, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(p.x + p.w/2, p.y + p.h + 3, p.w*0.55, 5, 0, 0, Math.PI*2);
  ctx.fill();

  if (p.shield) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25*Math.sin(performance.now()/160);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w*1.0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.heavy > 0) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w*1.15, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  if (p.speedBoost > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#22d3ee';
    for (let i = 1; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(p.x + p.w/2 - p.facing*i*17, p.y + p.h/2 + (i-1)*6, 4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  let squash = 1;
  if (p.charging) squash = 1 - (p.chargeTime / CHARGE_TIME)*0.24;
  const bh = p.h*squash;
  const by = p.y + p.h - bh;
  const cx = p.x + p.w/2;
  const cy = by + bh/2;

  const drawFn = CHAR_DRAW[p.character] || CHAR_DRAW.ninja;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squash);
  drawFn(ctx, 0, 0, p.w/2, p, performance.now()/1000);
  ctx.beginPath();
  ctx.arc(0, 0, p.w/2 + 3, 0, Math.PI*2);
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.9;
  ctx.stroke();
  ctx.restore();

  // 技能冷却环
  if (p.skillCd > 0) {
    const cdef0 = CHARS.find(c => c.id === p.character) || CHARS[0];
    const cdMax = (cdef0.skillCd || 5) * (p.mul && p.mul.cd ? p.mul.cd : 1);
    const ratio = 1 - p.skillCd / cdMax;
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w * 1.25, -Math.PI/2, -Math.PI/2 + Math.PI*2*ratio);
    ctx.stroke();
    ctx.restore();
  }

  if (p.charging) {
    const ratio = p.chargeTime / CHARGE_TIME;
    const bw = 46, bh2 = 6;
    const bx = p.x + p.w/2 - bw/2;
    const byy = by - 26;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    rr(ctx, bx - 1, byy - 1, bw + 2, bh2 + 2, 4); ctx.fill();
    const barColor = ratio > 0.85 ? '#ffd54f' : (ratio > 0.5 ? '#ffb74d' : p.color);
    rr(ctx, bx, byy, bw*ratio, bh2, 3);
    ctx.fillStyle = barColor; ctx.fill();
  }

  ctx.font = 'bold 12.5px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(p.name, p.x + p.w/2, p.y - 11);
  ctx.fillStyle = p.color;
  ctx.fillText(p.name, p.x + p.w/2, p.y - 11);

  // 连击数
  if (p.combo >= 2) {
    ctx.font = 'bold 14px system-ui';
    ctx.fillStyle = '#ffd54f';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = 3;
    const comboTxt = `x${p.combo}`;
    ctx.strokeText(comboTxt, p.x + p.w + 12, p.y + 6);
    ctx.fillText(comboTxt, p.x + p.w + 12, p.y + 6);
  }

  if (p.hasFlag) {
    ctx.font = 'bold 20px system-ui';
    ctx.fillText('🚩', p.x + p.w/2, p.y - 45);
  }
  ctx.restore();
}

function drawHUD() {
  const modeNames = { race:'竞速', dm:'死斗', koth:'占点', collect:'收集', ctf:'夺旗', horde:'大乱斗', survive:'生存' };

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = 'bold 20px system-ui';
  ctx.fillStyle = '#8fd3ff';
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 8;
  if (gameMode === 'race') ctx.fillText(`第 ${li+1} / ${totalLv} 关`, VW/2, 16);
  else ctx.fillText(`${modeNames[gameMode]} 模式`, VW/2, 16);
  ctx.shadowBlur = 0;

  if (gameMode === 'dm') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ff8a65'; ctx.fillText(`先达到 ${modeState.targetKills} 杀获胜`, VW/2, 42); }
  else if (gameMode === 'koth') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#a78bfa'; ctx.fillText(`守住中央区 ${modeState.targetScore} 秒获胜`, VW/2, 42); }
  else if (gameMode === 'collect') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ffd54f'; ctx.fillText(`先收集 ${modeState.targetCoins} 金币获胜`, VW/2, 42); }
  else if (gameMode === 'ctf') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ffd54f'; ctx.fillText(`先夺旗 ${modeState.targetScore} 次获胜`, VW/2, 42); }
  else if (gameMode === 'horde') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ff8a65'; ctx.fillText(`击杀 ${modeState.targetKills} 个怪物获胜`, VW/2, 42); }
  else if (gameMode === 'survive') { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ff5252'; ctx.fillText('活到最后获胜', VW/2, 42); }

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = '#7d94b0';
  ctx.fillText(levelTime.toFixed(1) + 's', VW - 22, 18);

  if (nPlayers === 1) {
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = '#5f7691';
    ctx.fillText('累计 ' + totalTime.toFixed(1) + 's', VW - 22, 44);
  }

  if (nPlayers >= 2 && (gameMode === 'dm' || gameMode === 'race')) {
    const ranked = [...players].sort((a, b) => (b.kills || 0) - (a.kills || 0));
    const bx = VW - 216, by = 60, bw = 200, rowH = 26;
    ctx.save();
    rr(ctx, bx, by, bw, 26, 6); ctx.fillStyle = 'rgba(50,20,80,0.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(167,139,250,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = '#a78bfa';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚔ 击杀榜', bx + bw/2, by + 13);
    ranked.forEach((p, i) => {
      const y = by + 30 + i*rowH;
      rr(ctx, bx, y, bw, rowH - 2, 4);
      ctx.fillStyle = 'rgba(10,16,26,0.75)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.stroke();
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'left';
      ctx.fillStyle = p.color;
      ctx.fillText(p.name, bx + 10, y + (rowH - 2)/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.fillText(p.kills || 0, bx + bw - 10, y + (rowH - 2)/2);
    });
    ctx.restore();
  }

  if (killFeed.length > 0) {
    const bx = VW - 216, by0 = 200;
    killFeed.forEach((k, i) => {
      const y = by0 + i*28;
      const a = Math.min(1, k.life/0.5);
      ctx.save();
      ctx.globalAlpha = a;
      rr(ctx, bx, y, 200, 26, 5);
      ctx.fillStyle = 'rgba(10,16,26,0.85)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,82,82,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = k.killerColor;
      ctx.fillText(k.killerName, bx + 10, y + 13);
      ctx.fillStyle = '#ff8a80';
      ctx.textAlign = 'center';
      ctx.fillText('⚔', bx + 100, y + 13);
      ctx.textAlign = 'right';
      ctx.fillStyle = k.victimColor;
      ctx.globalAlpha = a*0.7;
      ctx.fillText(k.victimName, bx + 190, y + 13);
      ctx.restore();
    });
  }

  for (const b of screenBanners) {
    const t = 1 - b.life/b.maxLife;
    let yOff, alpha;
    if (t < 0.2) { const p = t/0.2; yOff = -80 + p*80; alpha = p; }
    else if (t < 0.75) { yOff = 0; alpha = 1; }
    else { const p = (t - 0.75)/0.25; yOff = p*80; alpha = 1-p; }
    ctx.save();
    ctx.globalAlpha = alpha;
    const cx = VW/2, cy = VH*0.28 + yOff;
    const grd = ctx.createLinearGradient(cx - 300, 0, cx + 300, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(0.5, `rgba(255,82,82,${0.25*alpha})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - 300, cy - 32, 600, 64);
    ctx.font = 'bold 42px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(b.text, cx, cy - 6);
    ctx.fillStyle = b.accent;
    ctx.shadowColor = b.accent; ctx.shadowBlur = 20;
    ctx.fillText(b.text, cx, cy - 6);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = b.color;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(b.subText, cx, cy + 26);
    ctx.fillText(b.subText, cx, cy + 26);
    ctx.restore();
  }

  const pw = 160, ph = 72, gap = 8;
  const tw = players.length * pw + (players.length - 1) * gap;
  let px = (VW - tw)/2;
  const py = VH - ph - 12;
  for (const p of players) {
    rr(ctx, px, py, pw, ph, 9);
    ctx.fillStyle = 'rgba(10,16,26,0.85)'; ctx.fill();
    ctx.strokeStyle = p.finished ? '#ffd54f' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = p.finished ? 2.5 : 1.5; ctx.stroke();
    rr(ctx, px + 8, py + 10, 4, ph - 20, 2);
    ctx.fillStyle = p.color; ctx.fill();

    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = 'bold 13px system-ui'; ctx.fillStyle = p.color;
    ctx.fillText(p.name, px + 20, py + 8);
    // 技能就绪指示
    const cdef0 = CHARS.find(c => c.id === p.character) || CHARS[0];
    const skillReady = p.skillCd <= 0;
    const dotX = px + 24 + ctx.measureText(p.name).width;
    const dotY = py + 14;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 4, 0, Math.PI*2);
    ctx.fillStyle = skillReady ? '#4ade80' : '#444';
    ctx.fill();
    if (!skillReady) {
      const cdMax = (cdef0.skillCd || 5) * (p.mul && p.mul.cd ? p.mul.cd : 1);
      const ratio = clamp(1 - p.skillCd / cdMax, 0, 1);
      ctx.beginPath();
      ctx.arc(dotX, dotY, 4, -Math.PI/2, -Math.PI/2 + Math.PI*2*ratio);
      ctx.strokeStyle = '#4fc3f7';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.textAlign = 'right';
    ctx.font = 'bold 16px system-ui'; ctx.fillStyle = '#fff';
    if (gameMode === 'dm') ctx.fillText(`${p.kills || 0} 杀`, px + pw - 10, py + 6);
    else if (gameMode === 'koth') ctx.fillText(`${(p.kothTime || 0).toFixed(1)}s`, px + pw - 10, py + 6);
    else if (gameMode === 'collect') ctx.fillText(`${p.coins || 0} 币`, px + pw - 10, py + 6);
    else if (gameMode === 'horde') ctx.fillText(`${p.kills || 0} 怪`, px + pw - 10, py + 6);
    else if (gameMode === 'ctf') ctx.fillText(`${p.score || 0} 旗`, px + pw - 10, py + 6);
    else ctx.fillText(p.score, px + pw - 10, py + 6);

    const hbw = pw - 30, hbh = 6;
    const hbx = px + 20, hby = py + 28;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(ctx, hbx, hby, hbw, hbh, 3); ctx.fill();
    const hf = clamp(p.hp/p.maxHp, 0, 1);
    const hc = hf > 0.5 ? '#4ade80' : hf > 0.25 ? '#ffb74d' : '#ff5252';
    rr(ctx, hbx, hby, hbw*hf, hbh, 3);
    ctx.fillStyle = hc; ctx.fill();

    ctx.font = '11px system-ui';
    ctx.fillStyle = '#6b7f96';
    ctx.textAlign = 'left';
    if (gameMode === 'race' && p.finished) {
      ctx.fillStyle = '#ffd54f';
      ctx.fillText(`✓ 第${p.finishOrder}名 ${p.finishTime.toFixed(1)}s`, px + 20, py + 42);
    } else {
      ctx.fillText(`K ${p.kills || 0} / D ${p.deaths || 0}`, px + 20, py + 42);
    }
    px += pw + gap;
  }
}

function drawLevelEnd() {
  ctx.fillStyle = 'rgba(0,0,0,0.68)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 48px system-ui';
  ctx.fillStyle = '#4ade80';
  ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 30;
  ctx.fillText('关 卡 完 成 ！', VW/2, VH/2 - 60);
  ctx.shadowBlur = 0;
  const next = Math.max(0, Math.ceil(transT));
  ctx.font = '17px system-ui';
  ctx.fillStyle = '#7d94b0';
  ctx.fillText(li + 1 >= totalLv ? '结算中…' : `${next} 秒后下一关…`, VW/2, VH/2 + 40);
  ctx.font = '13px system-ui';
  ctx.fillStyle = '#4ade80';
  ctx.fillText('✓ 进度已自动保存', VW/2, VH/2 + 70);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 50px system-ui';
  ctx.fillStyle = '#ffd54f';
  ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 36;
  ctx.fillText('最 终 结 算', VW/2, VH/2 - 200);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 16px system-ui';
  const diffColor = { easy:'#81c784', normal:'#4fc3f7', hard:'#ffb74d', hell:'#ff5252', chaos:'#e040fb', inferno:'#ff1744' }[diffKey];
  ctx.fillStyle = diffColor;
  ctx.fillText(`难度：${DIFF.name} · 关卡：${totalLv}`, VW/2, VH/2 - 155);

  let sorted = [...players];
  if (gameMode === 'dm' || gameMode === 'horde') sorted.sort((a, b) => (b.kills || 0) - (a.kills || 0));
  else if (gameMode === 'koth') sorted.sort((a, b) => (b.kothTime || 0) - (a.kothTime || 0));
  else if (gameMode === 'collect') sorted.sort((a, b) => (b.coins || 0) - (a.coins || 0));
  else if (gameMode === 'ctf') sorted.sort((a, b) => (b.score || 0) - (a.score || 0));
  else sorted.sort((a, b) => b.score - a.score);

  if (modeState.winner !== undefined && modeState.winner >= 0 && players[modeState.winner]) {
    ctx.font = 'bold 36px system-ui';
    ctx.fillStyle = players[modeState.winner].color;
    ctx.shadowColor = players[modeState.winner].color;
    ctx.shadowBlur = 30;
    ctx.fillText(`🏆 ${players[modeState.winner].name} 获胜！`, VW/2, VH/2 - 90);
    ctx.shadowBlur = 0;
  } else if (modeState.winner === -1) {
    ctx.font = 'bold 36px system-ui';
    ctx.fillStyle = '#9e9e9e';
    ctx.fillText('平局', VW/2, VH/2 - 90);
  }

  sorted.forEach((p, i) => {
    const y = VH/2 - 30 + i*50;
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'right';
    ctx.fillStyle = i === 0 ? '#ffd54f' : p.color;
    ctx.fillText(`${i+1}. ${p.name}`, VW/2 - 20, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    let val = '';
    if (gameMode === 'dm' || gameMode === 'horde') val = `${p.kills || 0} 杀`;
    else if (gameMode === 'koth') val = `${(p.kothTime || 0).toFixed(1)}s`;
    else if (gameMode === 'collect') val = `${p.coins || 0} 金币`;
    else if (gameMode === 'ctf') val = `${p.score || 0} 旗`;
    else val = `${p.score} 分`;
    ctx.fillText(val, VW/2 + 20, y);
    ctx.font = '13px system-ui';
    ctx.fillStyle = '#6b7f96';
    ctx.fillText(`杀${p.kills || 0} 死${p.deaths || 0} 掉${p.fell || 0}`, VW/2 + 20, y + 20);
  });

  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui';
  ctx.fillStyle = '#8fd3ff';
  ctx.fillText('按 R 键返回主菜单（房间保留）', VW/2, VH - 50);
}

function drawMVP(dt) {
  if (!mvpState.active || !mvpState.player) return;
  mvpState.timer += dt;
  const t = mvpState.timer;
  const dur = mvpState.duration;
  if (t > dur) { mvpState.active = false; return; }

  const bgA = t < 0.5 ? t/0.5 : (t > dur - 0.5 ? 1 - (t - (dur - 0.5))/0.5 : 1);
  const p = mvpState.player;
  const cx = VW/2, cy = VH/2;

  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${0.88*bgA})`;
  ctx.fillRect(0, 0, VW, VH);

  const swX = ((t*400) % (VW + 400)) - 200;
  const sw = ctx.createLinearGradient(swX - VW*0.25, 0, swX + VW*0.25, 0);
  sw.addColorStop(0, 'rgba(255,213,79,0)');
  sw.addColorStop(0.5, `rgba(255,213,79,${0.2*bgA})`);
  sw.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = sw;
  ctx.fillRect(0, 0, VW, VH);

  let yOff = 0;
  if (t < 0.5) yOff = (1 - t/0.5)*80;
  else if (t > dur - 0.5) yOff = -((t - (dur - 0.5))/0.5)*80;

  const sc = Math.min(1, VW/900, VH/600);
  ctx.globalAlpha = bgA;
  ctx.translate(cx, cy + yOff);
  ctx.scale(sc, sc);

  if (!mvpState.playedSounds.in) { S.mvpIn(); mvpState.playedSounds.in = true; }
  if (t > 0.3 && !mvpState.playedSounds.title) { S.mvpTitle(); mvpState.playedSounds.title = true; }

  const tp = 0.6 + 0.4*Math.sin(t*6);
  ctx.font = 'bold 68px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  const tg = ctx.createLinearGradient(-200, -180, 200, -100);
  tg.addColorStop(0, '#ffd54f'); tg.addColorStop(0.5, '#ffb300'); tg.addColorStop(1, '#ff8a65');
  ctx.strokeText(mvpState.title, 0, -140);
  ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 30*tp;
  ctx.fillStyle = tg;
  ctx.fillText(mvpState.title, 0, -140);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 20px system-ui';
  ctx.fillStyle = '#a78bfa';
  ctx.fillText(mvpState.subTitle, 0, -95);

  const hp = 1 + Math.sin(t*4)*0.08;
  ctx.save();
  ctx.scale(hp, hp);
  const hg = ctx.createRadialGradient(0, 0, 20, 0, 0, 140);
  hg.addColorStop(0, `${p.color}cc`);
  hg.addColorStop(0.5, `${p.color}44`);
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI*2); ctx.fill();
  for (let i = 0; i < 16; i++) {
    const a = (i/16)*Math.PI*2 + t*1.5;
    const px = Math.cos(a)*120, py = Math.sin(a)*120;
    const size = 3 + Math.sin(t*6 + i)*2;
    ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI*2);
    ctx.fillStyle = i%2 === 0 ? '#ffd54f' : p.color;
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
    ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.save();
  ctx.scale(2.2, 2.2);
  const drawFn = CHAR_DRAW[p.character] || CHAR_DRAW.ninja;
  drawFn(ctx, 0, 0, 22, p, t);
  ctx.restore();
  ctx.restore();

  ctx.font = 'bold 44px system-ui';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  ctx.strokeText(p.name, 0, 100);
  ctx.fillStyle = p.color;
  ctx.shadowColor = p.color; ctx.shadowBlur = 20;
  ctx.fillText(p.name, 0, 100);
  ctx.shadowBlur = 0;

  if (mvpState.stats) {
    const st = mvpState.stats;
    const cY = 160, cW = 88, g = 12;
    const totalW = st.length*cW + (st.length - 1)*g;
    let sx = -totalW/2;
    st.forEach((s, i) => {
      const ap = Math.min(1, Math.max(0, (t - 0.3 - i*0.12)/0.4));
      if (ap <= 0) return;
      const sk = 'stat' + i;
      if (!mvpState.playedSounds[sk]) { S.mvpStat(i); mvpState.playedSounds[sk] = true; }
      ctx.save();
      ctx.globalAlpha = ap;
      const cH = 68;
      rr(ctx, sx, cY, cW, cH, 10);
      ctx.fillStyle = 'rgba(20,30,45,0.9)'; ctx.fill();
      ctx.strokeStyle = `${s.color}88`; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = 'bold 11px system-ui';
      ctx.fillStyle = '#8ba3c0';
      ctx.textAlign = 'center';
      ctx.fillText(s.label, sx + cW/2, cY + 18);
      ctx.font = 'bold 24px system-ui';
      ctx.fillStyle = s.color;
      ctx.fillText(s.value, sx + cW/2, cY + 46);
      ctx.restore();
      sx += cW + g;
    });
  }
  ctx.restore();
}

/* ═══ 初始化 ═══ */
function checkCharAchievement() {
  const used = Achievements.stats.usedChars || {};
  for (const c of myChars) used[c] = true;
  Achievements.stats.usedChars = used;
  if (Object.keys(used).length >= CHARS.length) Achievements.unlock('allChars');
  Achievements.save();
}

function loadNamesInit() {
  try {
    const r = localStorage.getItem('bomb_names_v1');
    if (r) { const a = JSON.parse(r); for (let i = 0; i < 4; i++) if (a[i]) myNames[i] = a[i].slice(0, 8); }
  } catch(e) {}
  const saved = Save.load();
  if (saved && saved.settings) {
    if (saved.settings.musicOn !== undefined) S.musicOn = saved.settings.musicOn;
    if (saved.settings.vol !== undefined) {
      S.vol = saved.settings.vol;
      document.getElementById('volumeSlider').value = Math.round(S.vol*100);
      document.getElementById('volumeLabel').textContent = Math.round(S.vol*100) + '%';
      document.getElementById('musicToggle').textContent = S.musicOn ? '🎵 音乐' : '🔇 静音';
    }
  }
}

loadNamesInit();
Achievements.load();
buildUI();
updateContinueBtn();
updateQuickStats();
refreshRoomUI();
BGM.play('menu');

setInterval(() => {
  if (state === 'playing') {
    Achievements.stats.totalTime += 60;
    if (Achievements.stats.totalTime > 1800) Achievements.unlock('marathon');
    Achievements.save();
  }
}, 60000);

let lastT = performance.now();
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 1/30) dt = 1/30;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
